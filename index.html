<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⭐ 米米小舖-Club MStar ⭐</title>
  <style>
    :root {
      --bg-color: #36393f;
      --card-bg: #2f3136;
      --text-color: #dcddde;
      --accent-color: #5865f2;
      --danger-color: #ed4245;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 頂部列：標題、說明區塊與登入區 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      gap: 20px;
    }

    /* 左側標題與紅框說明區組合 */
    .title-left {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      flex: 1;
    }

    .title-left h2 {
      margin: 0;
      white-space: nowrap;
      line-height: 1.4;
    }

    /* 說明欄樣式 */
    .info-badge {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      background-color: #202225;
      border: 1px solid #4f545c;
      color: #b9bbbe;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
      width: 100%;
      max-width: 280px;
      min-height: 38px;
      box-sizing: border-box;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .info-badge .editable-text {
      flex: 1;
      outline: none;
    }

    /* 登入區控制 */
    .auth-box {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .auth-inputs {
      display: none;
      gap: 8px;
      align-items: center;
    }

    .auth-inputs input {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #4f545c;
      background: #202225;
      color: #fff;
    }

    .auth-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    .cancel-btn {
      background: #4f545c;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* 分頁選單 */
    .tabs-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #4f545c;
      padding-bottom: 10px;
      overflow-x: auto;
    }

    .tab-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #fff;
      font-weight: bold;
    }

    /* 上傳區 (預設隱藏，登入後顯示) */
    .drop-zone {
      border: 2px dashed #4f545c;
      background: var(--card-bg);
      padding: 25px;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 25px;
      display: none;
    }
    
    .drop-zone.dragover {
      background: #393c43;
      border-color: var(--accent-color);
    }

    /* 圖片網格：固定 120px */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, 120px);
      gap: 12px;
    }

    /* 圖片卡片：固定 120px */
    .img-card {
      width: 120px;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .img-wrapper {
      width: 120px;
      height: 120px;
      position: relative;
      background-color: #202225;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 右上角數量/售出標籤 (通用基礎樣式) */
    .status-select, .status-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 10;
      background-color: rgba(32, 34, 37, 0.85);
      color: #fff;
      border: 1px solid #4f545c;
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 10px;
      font-weight: bold;
      backdrop-filter: blur(4px);
    }

    /* 管理員顯示下拉選單 */
    .status-select {
      cursor: pointer;
      outline: none;
    }

    /* 訪客模式顯示純文字標籤 */
    .status-badge {
      display: inline-block;
      pointer-events: none;
    }

    /* 售出狀態的紅色樣式 */
    .status-select.is-sold, .status-badge.is-sold {
      background-color: rgba(237, 66, 69, 0.9);
      border-color: var(--danger-color);
      color: #ffffff;
    }

    .status-select option {
      background-color: #202225;
      color: #fff;
    }

    .status-select option.sold-option {
      color: #ed4245;
      font-weight: bold;
    }

    /* 刪除按鈕 (左上角) */
    .delete-btn {
      position: absolute;
      top: 4px;
      left: 4px;
      background-color: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      z-index: 10;
    }

    .delete-btn:hover {
      background-color: var(--danger-color);
    }

    .img-info {
      padding: 4px 6px;
      font-size: 11px;
      color: #b9bbbe;
      background-color: #2f3136;
      text-align: center;
    }

    .editable-text {
      outline: none;
      padding: 1px 2px;
      border-radius: 4px;
      color: #ffffff;
      word-break: break-all;
      display: block;
    }

    /* 登入後可編輯的視覺提示 */
    .is-admin .editable-text {
      background: rgba(0, 0, 0, 0.2);
      cursor: text;
    }
    .is-admin .editable-text:hover {
      border: 1px #4f545c solid;
    }
    .is-admin .img-card:hover .delete-btn {
      display: flex;
    }
  </style>
</head>
<body>

  <!-- 頂部列：左側標題與紅框說明區、右側登入區 -->
  <div class="header">
    <div class="title-left">
      <h2>⭐ 米米小舖 ⭐</h2>
      <div class="info-badge">
        <span class="info-icon">📕</span>
        <span class="editable-text" id="siteDescription" contenteditable="false">載入中...</span>
      </div>
    </div>

    <div class="auth-box" id="authBox">
      <button class="auth-btn" id="showLoginBtn">登入</button>
      <div class="auth-inputs" id="authInputs">
        <input type="email" id="emailInput" placeholder="管理員 Email">
        <input type="password" id="passwordInput" placeholder="密碼">
        <button class="auth-btn" id="loginBtn">確認</button>
        <button class="cancel-btn" id="cancelBtn">✕</button>
      </div>
    </div>
  </div>

  <!-- 分頁選單 -->
  <div class="tabs-container">
    <button class="tab-btn active" data-category="general">🏠 家具</button>
    <button class="tab-btn" data-category="memes">🧸 熊熊</button>
    <button class="tab-btn" data-category="design">💍 戒指(限男)</button>
    <button class="tab-btn" data-category="photos">💍 戒指(限女)</button>
    <button class="tab-btn" data-category="crops_m">🌱 作物(限男)</button>
    <button class="tab-btn" data-category="crops_f">🌱 作物(限女)</button>
  </div>
  
  <!-- 上傳區 (僅管理員可見) -->
  <div class="drop-zone" id="dropZone">
    <p style="font-size: 16px; margin-bottom: 8px;">💡 當前分頁：<b id="currentTabName">家具</b>（Ctrl + V 貼上圖片 / 拖曳上傳）</p>
    <p id="status" style="color: var(--accent-color); margin: 0; font-weight: bold;"></p>
  </div>

  <div class="gallery" id="gallery"></div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, update, remove, set, onValue, onChildAdded, onChildChanged, onChildRemoved, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCVUSw-B1it_bQ2sF3pAsTI0pXcyF-Tdfg",
      authDomain: "mimishop-93214.firebaseapp.com",
      databaseURL: "https://mimishop-93214-default-rtdb.firebaseio.com",
      projectId: "mimishop-93214",
      storageBucket: "mimishop-93214.firebasestorage.app",
      messagingSenderId: "953118400447",
      appId: "1:953118400447:web:3a0e2fc6c4d2b65425cb0a",
      measurementId: "G-0EDJDFNFWF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentCategory = 'general';
    let activeRef = null;
    let isAdmin = false;

    function getDefaultTimeStr() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // 1. 說明欄即時同步與編輯
    const descElem = document.getElementById('siteDescription');
    const descRef = ref(db, 'settings/description');

    onValue(descRef, (snapshot) => {
      const data = snapshot.val();
      const defaultText = "訪客僅供檢視，管理員登入後可上傳與編輯。";
      if (document.activeElement !== descElem) {
        descElem.innerText = data !== null ? data : defaultText;
      }
    });

    descElem.addEventListener('blur', () => {
      if (!isAdmin) return;
      const newDesc = descElem.innerText.trim();
      set(descRef, newDesc);
    });

    // 2. 登入狀態監聽
    onAuthStateChanged(auth, (user) => {
      const authBox = document.getElementById('authBox');
      const dropZone = document.getElementById('dropZone');

      if (user) {
        isAdmin = true;
        document.body.classList.add('is-admin');
        dropZone.style.display = 'block';
        if (descElem) descElem.contentEditable = "true";
        
        authBox.innerHTML = `
          <span style="color:#57F287; font-size:14px;">已登入管理員</span>
          <button class="auth-btn" id="logoutBtn" style="background:#4f545c">登出</button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
      } else {
        isAdmin = false;
        document.body.classList.remove('is-admin');
        dropZone.style.display = 'none';
        if (descElem) descElem.contentEditable = "false";
        
        authBox.innerHTML = `
          <button class="auth-btn" id="showLoginBtn">登入</button>
          <div class="auth-inputs" id="authInputs">
            <input type="email" id="emailInput" placeholder="管理員 Email">
            <input type="password" id="passwordInput" placeholder="密碼">
            <button class="auth-btn" id="loginBtn">確認</button>
            <button class="cancel-btn" id="cancelBtn">✕</button>
          </div>
        `;
        bindAuthEvents();
      }
      
      switchCategory(currentCategory);
    });

    function bindAuthEvents() {
      const showLoginBtn = document.getElementById('showLoginBtn');
      const authInputs = document.getElementById('authInputs');
      const cancelBtn = document.getElementById('cancelBtn');
      const loginBtn = document.getElementById('loginBtn');

      if (showLoginBtn) {
        showLoginBtn.addEventListener('click', () => {
          showLoginBtn.style.display = 'none';
          authInputs.style.display = 'flex';
        });
      }

      if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
          authInputs.style.display = 'none';
          showLoginBtn.style.display = 'inline-block';
        });
      }

      if (loginBtn) {
        loginBtn.addEventListener('click', handleLogin);
      }
    }

    async function handleLogin() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        alert('登入失敗：' + err.message);
      }
    }

    // 生成數量選單 HTML (1~10 與 售出)
    function generateSelectOptions(currentVal) {
      let options = '';
      for (let i = 1; i <= 10; i++) {
        const valStr = `${i}`;
        const selected = (currentVal === valStr || currentVal === `數量: ${i}` || (!currentVal && i === 1)) ? 'selected' : '';
        options += `<option value="${valStr}" ${selected}>${i}</option>`;
      }
      const soldSelected = (currentVal === '售出') ? 'selected' : '';
      options += `<option value="售出" class="sold-option" ${soldSelected}>售出</option>`;
      return options;
    }

    // 根據權限渲染右上角狀態（管理員為 select，訪客為 span 標籤）
    function renderStatusElement(key, statusValue) {
      const isSoldClass = statusValue === '售出' ? 'is-sold' : '';
      if (isAdmin) {
        return `
          <select class="status-select ${isSoldClass}" id="select-${key}">
            ${generateSelectOptions(statusValue)}
          </select>
        `;
      } else {
        return `
          <span class="status-badge ${isSoldClass}" id="badge-${key}">
            ${statusValue}
          </span>
        `;
      }
    }

    // 3. 圖片分頁監聽
    function switchCategory(newCategory) {
      if (activeRef) off(activeRef);

      currentCategory = newCategory;
      activeRef = ref(db, `images/${currentCategory}`);
      document.getElementById('gallery').innerHTML = '';

      onChildAdded(activeRef, (snapshot) => {
        const key = snapshot.key;
        const data = snapshot.val();
        const gallery = document.getElementById('gallery');

        const card = document.createElement('div');
        card.className = 'img-card';
        card.id = `card-${key}`;

        const textValue = data.caption || getDefaultTimeStr();
        const statusValue = data.quantity || '1';

        card.innerHTML = `
          <button class="delete-btn" title="刪除圖片">✕</button>
          <div class="img-wrapper">
            ${renderStatusElement(key, statusValue)}
            <img src="${data.url}" loading="lazy" alt="uploaded image" />
          </div>
          <div class="img-info">
            <span class="editable-text" contenteditable="${isAdmin}" id="text-${key}">${textValue}</span>
          </div>
        `;

        gallery.prepend(card);

        // 管理員模式下綁定下拉選單切換事件
        if (isAdmin) {
          const selectElem = card.querySelector(`#select-${key}`);
          if (selectElem) {
            selectElem.addEventListener('change', (e) => {
              const selectedVal = e.target.value;
              update(ref(db, `images/${currentCategory}/${key}`), { quantity: selectedVal });
            });
          }
        }

        // 刪除按鈕
        const deleteBtn = card.querySelector('.delete-btn');
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (isAdmin && confirm('確定要刪除這張圖片嗎？')) {
            remove(ref(db, `images/${currentCategory}/${key}`));
          }
        });

        // 編輯標題
        const editableElem = card.querySelector('.editable-text');
        editableElem.addEventListener('blur', () => {
          if (!isAdmin) return;
          const newText = editableElem.innerText.trim();
          update(ref(db, `images/${currentCategory}/${key}`), { caption: newText });
        });

        editableElem.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            editableElem.blur();
          }
        });
      });

      onChildChanged(activeRef, (snapshot) => {
        const key = snapshot.key;
        const data = snapshot.val();
        
        // 即時更新標題
        const targetTextElem = document.getElementById(`text-${key}`);
        if (targetTextElem && document.activeElement !== targetTextElem) {
          targetTextElem.innerText = data.caption || '';
        }

        // 即時更新數量/售出狀態
        const newStatus = data.quantity || '1';
        if (isAdmin) {
          const targetSelectElem = document.getElementById(`select-${key}`);
          if (targetSelectElem) {
            targetSelectElem.value = newStatus;
            if (newStatus === '售出') {
              targetSelectElem.classList.add('is-sold');
            } else {
              targetSelectElem.classList.remove('is-sold');
            }
          }
        } else {
          const targetBadgeElem = document.getElementById(`badge-${key}`);
          if (targetBadgeElem) {
            targetBadgeElem.innerText = newStatus;
            if (newStatus === '售出') {
              targetBadgeElem.classList.add('is-sold');
            } else {
              targetBadgeElem.classList.remove('is-sold');
            }
          }
        }
      });

      onChildRemoved(activeRef, (snapshot) => {
        const key = snapshot.key;
        const cardElem = document.getElementById(`card-${key}`);
        if (cardElem) cardElem.remove();
      });
    }

    // 分頁切換點擊
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('currentTabName').innerText = btn.innerText.replace(/^[^\s]+\s/, '');
        switchCategory(btn.getAttribute('data-category'));
      });
    });

    // 圖片上傳邏輯
    function handleImageFile(file) {
      if (!isAdmin || !file || !file.type.startsWith('image/')) return;

      const status = document.getElementById('status');
      status.innerText = "正在發送圖片...";

      const reader = new FileReader();
      reader.onload = function(e) {
        push(ref(db, `images/${currentCategory}`), {
          url: e.target.result,
          caption: getDefaultTimeStr(),
          quantity: '1',
          timestamp: Date.now()
        });
        status.innerText = "發送成功！";
        setTimeout(() => status.innerText = "", 1500);
      };
      reader.readAsDataURL(file);
    }

    // 剪貼簿與拖曳事件
    document.addEventListener('paste', (e) => {
      if (!isAdmin || document.activeElement.isContentEditable) return;
      const items = e.clipboardData?.items;
      if (!items) return;
      for (let item of items) {
        if (item.type.includes('image')) {
          handleImageFile(item.getAsFile());
          break;
        }
      }
    });

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (isAdmin && e.dataTransfer.files.length > 0) {
        handleImageFile(e.dataTransfer.files[0]);
      }
    });
  </script>
</body>
</html>
