<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⭐ 米米小舖-Club MStar ⭐</title>
  <style>
    :root {
      --bg-color: #ffe4e6;
      --card-bg: #fff0f3;
      --text-color: #5c4033;
      --accent-color: #ff69b4;
      --danger-color: #ff4d4d;
      --success-color: #2e8b57;
      --warning-color: #ffb347;
      --border-color: #ffb6c1;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      padding-right: 140px; 
    }

    @media (max-width: 900px) {
      body {
        padding-right: 20px;
      }
    }

    /* 上方黏貼頂端區塊 */
    .sticky-header-wrapper {
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      z-index: 1000;
      padding-top: 10px;
      padding-bottom: 15px;
      box-shadow: 0 4px 10px rgba(255, 182, 193, 0.3);
    }

    .header-layout {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .left-control-panel {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .title-area-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .title-area h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.4;
      white-space: nowrap;
      color: #d81b60;
    }

    .discord-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #fff;
      border: 1px solid var(--border-color);
      color: #d81b60;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      width: fit-content;
    }

    /* 公告區塊放右側並排顯示 */
    .center-notice-panel {
      flex: 1;
      min-width: 280px;
      max-width: 100%;
    }

    .info-badge {
      display: inline-flex;
      align-items: flex-start;
      gap: 6px;
      background-color: #fff;
      border: 1px solid var(--border-color);
      color: #7b5247;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      box-sizing: border-box;
      text-align: left;
      width: 100%;
    }

    .info-badge .editable-text {
      outline: none;
      color: #5c4033;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .is-admin .info-badge .editable-text {
      background: rgba(255, 182, 193, 0.2);
      cursor: text;
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px dashed var(--accent-color);
    }

    /* 右側直立懸浮分頁區塊 */
    .side-tabs-panel {
      position: fixed;
      right: 20px;
      top: 160px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1100;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(255, 182, 193, 0.5);
      border: 1px solid var(--border-color);
    }

    .tab-btn, .dropdown-toggle {
      background: #fff;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      width: 100px;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .tab-btn:hover, .dropdown-toggle:hover {
      background: #ffc0cb;
    }

    .tab-btn.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
      font-weight: bold;
    }

    .dropdown {
      position: relative;
      display: block;
      width: 100px;
    }

    /* 修改：子選單預設隱藏，透過 hover 或是 active 狀態來持續顯示，直到點擊子分頁 */
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 0;
      right: calc(100% + 8px);
      background-color: var(--card-bg);
      min-width: 110px;
      box-shadow: 0px 8px 16px 0px rgba(255, 182, 193, 0.5);
      border-radius: 6px;
      z-index: 1200;
      padding: 4px 0;
      border: 1px solid var(--border-color);
    }

    /* 支援 hover 展開 或 當父容器有 open 類別時展開 */
    .dropdown:hover .dropdown-menu,
    .dropdown.open .dropdown-menu,
    .dropdown-menu:hover {
      display: block;
    }

    .dropdown-item {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      color: var(--text-color);
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      box-sizing: border-box;
      background: none;
      border: none;
      text-align: left;
    }

    .dropdown-item:hover {
      background-color: var(--accent-color);
      color: #fff;
    }

    .auth-box {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .auth-inputs {
      display: none;
      gap: 6px;
      align-items: center;
    }

    .auth-inputs input {
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: #fff;
      color: var(--text-color);
      width: 90px;
      font-size: 12px;
    }

    .auth-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .cancel-btn {
      background: #d3d3d3;
      color: var(--text-color);
      border: none;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .search-input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #fff;
      color: var(--text-color);
      width: 100%;
      font-size: 13px;
      box-sizing: border-box;
    }

    .custom-notice-container {
      display: none;
      width: 100%;
      margin: 15px 0 0 0;
      text-align: center;
    }

    .custom-notice-box {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      background-color: #fff;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      text-align: left;
      box-sizing: border-box;
      width: 100%;
    }

    .custom-notice-box .editable-text {
      outline: none;
      color: var(--text-color);
      white-space: pre-wrap;
      word-break: break-all;
      flex: 1;
    }

    .is-admin .custom-notice-box .editable-text {
      background: rgba(255, 182, 193, 0.2);
      cursor: text;
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px dashed var(--accent-color);
    }

    .drop-zone {
      border: 2px dashed var(--border-color);
      background: var(--card-bg);
      padding: 25px;
      text-align: center;
      border-radius: 8px;
      margin-top: 20px;
      margin-bottom: 25px;
      display: none;
    }
    
    .drop-zone.dragover {
      background: #ffccd5;
      border-color: var(--accent-color);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, 120px);
      gap: 12px;
      align-items: start;
      margin-top: 20px;
    }

    .img-card {
      width: 120px;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(255, 182, 193, 0.3);
      display: flex;
      flex-direction: column;
      position: relative;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      border: 1px solid var(--border-color);
    }

    .img-card.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    .img-wrapper {
      width: 120px;
      height: 120px;
      position: relative;
      background-color: #fff;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .status-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 10;
      background-color: rgba(255, 255, 255, 0.9);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 9px;
      font-weight: bold;
      max-width: 85px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-badge.is-pending {
      background-color: rgba(254, 231, 92, 0.95);
      border-color: var(--warning-color);
      color: #000000;
    }

    .status-badge.is-sold {
      background-color: rgba(237, 66, 69, 0.9);
      border-color: var(--danger-color);
      color: #ffffff;
    }

    .status-select {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 10;
      background-color: rgba(255, 255, 255, 0.95);
      color: var(--text-color);
      border: 1px solid var(--accent-color);
      border-radius: 4px;
      padding: 1px 2px;
      font-size: 9px;
      font-weight: bold;
      cursor: pointer;
      outline: none;
    }

    .status-select.is-pending {
      background-color: rgba(254, 231, 92, 0.95);
      border-color: var(--warning-color);
      color: #000000;
    }

    .status-select.is-sold {
      background-color: rgba(237, 66, 69, 0.9);
      border-color: var(--danger-color);
      color: #ffffff;
    }

    .delete-btn {
      position: absolute;
      top: 4px;
      left: 4px;
      background-color: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      z-index: 10;
    }

    .delete-btn:hover { background-color: var(--danger-color); }

    .img-info {
      padding: 6px;
      font-size: 11px;
      color: var(--text-color);
      background-color: var(--card-bg);
      text-align: center;
      border-top: 1px solid var(--border-color);
    }

    .editable-text {
      outline: none;
      padding: 2px 4px;
      border-radius: 4px;
      color: var(--text-color);
      word-break: break-all;
      display: block;
    }

    .admin-note-box {
      display: none;
      background-color: #fff;
      border-top: 1px solid var(--border-color);
      padding: 6px;
      font-size: 10px;
      text-align: left;
    }

    .is-admin .admin-note-box { display: block; }

    .admin-note-label {
      color: var(--success-color);
      font-weight: bold;
      margin-bottom: 2px;
    }

    .admin-note-text {
      outline: none;
      color: var(--text-color);
      word-break: break-all;
      display: block;
      padding: 2px;
      border-radius: 3px;
      min-height: 14px;
    }

    .is-admin .editable-text, .is-admin .admin-note-text { 
      background: rgba(255, 182, 193, 0.2); 
      cursor: text; 
    }
    
    .is-admin .img-card:hover .delete-btn { display: flex; }
  </style>
</head>
<body>

  <!-- 右側直立懸浮分頁 -->
  <div class="side-tabs-panel">
    <button class="tab-btn active" data-category="general">🏠 家具</button>
    <button class="tab-btn" data-category="memes">🧸 熊熊</button>
    <button class="tab-btn" data-category="pot">🪴 花盆</button>
    
    <div class="dropdown" id="dropdown-ring">
      <button class="dropdown-toggle" data-dropdown="dropdown-ring">💍 戒指 ▾</button>
      <div class="dropdown-menu">
        <button class="dropdown-item tab-btn" data-category="ring_male">👦 限男</button>
        <button class="dropdown-item tab-btn" data-category="ring_female">👧 限女</button>
      </div>
    </div>

    <div class="dropdown" id="dropdown-crop">
      <button class="dropdown-toggle" data-dropdown="dropdown-crop">🌱 作物 ▾</button>
      <div class="dropdown-menu">
        <button class="dropdown-item tab-btn" data-category="crop_male">👦 限男</button>
        <button class="dropdown-item tab-btn" data-category="crop_female">👧 限女</button>
      </div>
    </div>

    <button class="tab-btn" data-category="gift">🎁 贈品區</button>
  </div>

  <!-- 上方黏貼頂端區塊 -->
  <div class="sticky-header-wrapper">
    <div class="header-layout">
      
      <!-- 第一行：左側標題與公告並排，右側登入 -->
      <div class="header-top-row">
        <div class="left-control-panel">
          <div class="title-area-group">
            <div class="title-area">
              <h2>⭐ 米米小舖 ⭐</h2>
            </div>
            <div class="discord-badge">
              <span>💬</span>
              <span>Discord：mimi_ouo</span>
            </div>
          </div>
          
          <!-- 公告區塊改放到標題旁邊 -->
          <div class="center-notice-panel">
            <div class="info-badge">
              <span>📕</span>
              <span class="editable-text" id="siteDescription" contenteditable="false">本人夜班，交易需另約時間，故不接急單
交易方式：可糖可T，比值1:1</span>
            </div>
          </div>
        </div>
        
        <!-- 登入按鈕 -->
        <div class="auth-box" id="authBox">
          <button class="auth-btn" id="showLoginBtn">登入</button>
          <div class="auth-inputs" id="authInputs">
            <input type="password" id="passwordInput" placeholder="管理員密碼">
            <button class="auth-btn" id="loginBtn">確認</button>
            <button class="cancel-btn" id="cancelBtn">✕</button>
          </div>
        </div>
      </div>

      <!-- 搜尋區 -->
      <div class="search-panel">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋名稱或備註...">
      </div>

    </div>
  </div>
  
  <!-- 贈品區說明 -->
  <div class="custom-notice-container" id="giftNoticeContainer">
    <div class="custom-notice-box">
      <span>🎁</span>
      <span class="editable-text" id="giftDescription" contenteditable="false">本區一律2糖，如有購買任一商品或本區滿五件，可選本區一件免費贈送</span>
    </div>
  </div>

  <!-- 戒指區說明 -->
  <div class="custom-notice-container" id="ringNoticeContainer">
    <div class="custom-notice-box">
      <span>💍</span>
      <span class="editable-text" id="ringDescription" contenteditable="false">情侶等級由買家負擔</span>
    </div>
  </div>

  <!-- 作物區說明 -->
  <div class="custom-notice-container" id="cropNoticeContainer">
    <div class="custom-notice-box">
      <span>🌱</span>
      <span class="editable-text" id="cropDescription" contenteditable="false">誕生作物只收T，一律種植後付款</span>
    </div>
  </div>

  <div class="drop-zone" id="dropZone">
    <p style="font-size: 16px; margin-bottom: 8px;">💡 當前分頁：<b id="currentTabName">🏠 家具</b>（Ctrl + V 貼上圖片 / 拖曳上傳）</p>
    <p id="status" style="color: var(--accent-color); margin: 0; font-weight: bold;"></p>
  </div>

  <div class="gallery" id="gallery"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVrP__g-bnoVRQQrJkKLlMZDhSbFeUuTMyw6-zVRhtYkkSedoVbJXKUwN0bUyc4vs3rQ/exec";

    let currentCategory = 'general';
    let currentCategoryDisplayName = '🏠 家具';
    let isAdmin = localStorage.getItem('isAdmin') === 'true';
    let allData = [];

    const ADMIN_PASSWORD = "1j6ul42l4ji3++";

    document.addEventListener('DOMContentLoaded', () => {
      initAuthUI();
      setupTabs();
      fetchData();
      
      document.getElementById('searchInput').addEventListener('input', renderGallery);
    });

    function initAuthUI() {
      const authBox = document.getElementById('authBox');
      const dropZone = document.getElementById('dropZone');
      const descElem = document.getElementById('siteDescription');
      const giftDescElem = document.getElementById('giftDescription');
      const ringDescElem = document.getElementById('ringDescription');
      const cropDescElem = document.getElementById('cropDescription');

      if (isAdmin) {
        document.body.classList.add('is-admin');
        dropZone.style.display = 'block';
        descElem.contentEditable = "true";
        giftDescElem.contentEditable = "true";
        ringDescElem.contentEditable = "true";
        cropDescElem.contentEditable = "true";
        authBox.innerHTML = `
          <span style="color:var(--success-color); font-size:13px; font-weight:bold;">已登入管理員</span>
          <button class="auth-btn" id="logoutBtn" style="background:#d3d3d3; color:var(--text-color);">登出</button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => {
          localStorage.removeItem('isAdmin');
          location.reload();
        });
      } else {
        document.body.classList.remove('is-admin');
        dropZone.style.display = 'none';
        descElem.contentEditable = "false";
        giftDescElem.contentEditable = "false";
        ringDescElem.contentEditable = "false";
        cropDescElem.contentEditable = "false";
        authBox.innerHTML = `
          <button class="auth-btn" id="showLoginBtn">登入</button>
          <div class="auth-inputs" id="authInputs">
            <input type="password" id="passwordInput" placeholder="管理員密碼">
            <button class="auth-btn" id="loginBtn">確認</button>
            <button class="cancel-btn" id="cancelBtn">✕</button>
          </div>
        `;
        bindAuthEvents();
      }

      setupEditableSave(descElem, 'settings_desc', 'caption');
      setupEditableSave(giftDescElem, 'settings_gift', 'caption');
      setupEditableSave(ringDescElem, 'settings_ring', 'caption');
      setupEditableSave(cropDescElem, 'settings_crop', 'caption');
    }

    function setupEditableSave(elem, id, field) {
      let originalText = "";
      elem.addEventListener('focus', () => {
        if (!isAdmin) return;
        originalText = elem.innerText;
      });

      elem.addEventListener('blur', async () => {
        if (!isAdmin) return;
        const newText = elem.innerText;
        if (newText === originalText) return;

        const status = document.getElementById('status');
        status.innerText = "正在儲存至雲端...";
        
        const success = await updateItemById(id, field, newText);
        if (success) {
          originalText = newText;
          status.innerText = "修改成功！";
        } else {
          status.innerText = "儲存失敗，請重試";
        }
        setTimeout(() => { status.innerText = ""; }, 1500);
      });
    }

    function bindAuthEvents() {
      const showLoginBtn = document.getElementById('showLoginBtn');
      const authInputs = document.getElementById('authInputs');
      const cancelBtn = document.getElementById('cancelBtn');
      const loginBtn = document.getElementById('loginBtn');

      showLoginBtn.addEventListener('click', () => {
        showLoginBtn.style.display = 'none';
        authInputs.style.display = 'flex';
      });

      cancelBtn.addEventListener('click', () => {
        authInputs.style.display = 'none';
        showLoginBtn.style.display = 'inline-block';
      });

      loginBtn.addEventListener('click', () => {
        const pass = document.getElementById('passwordInput').value;
        if (pass === ADMIN_PASSWORD) {
          localStorage.setItem('isAdmin', 'true');
          location.reload();
        } else {
          alert('密碼錯誤！');
        }
      });
    }

    function setupTabs() {
      // 處理下拉選單點擊展開/收合保持顯示直到點擊子分頁
      document.querySelectorAll('.dropdown-toggle').forEach(toggle => {
        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          const dropdownId = toggle.getAttribute('data-dropdown');
          const dropdownEl = document.getElementById(dropdownId);
          
          // 切換開啟狀態
          const isOpen = dropdownEl.classList.contains('open');
          // 關閉所有其他下拉
          document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
          
          if (!isOpen) {
            dropdownEl.classList.add('open');
          }
        });
      });

      // 點擊網頁其他地方時關閉未固定的下拉選單
      document.addEventListener('click', () => {
        document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
      });

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          
          // 如果點擊的是子分頁，讓對應的父分類標籤也保持高亮或開啟狀態
          const parentDropdown = btn.closest('.dropdown');
          if (parentDropdown) {
            parentDropdown.classList.remove('open');
          } else {
            // 點擊一般分頁時關閉所有下拉選單
            document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
          }

          currentCategory = btn.getAttribute('data-category');
          currentCategoryDisplayName = btn.innerText.trim();
          document.getElementById('currentTabName').innerText = currentCategoryDisplayName;
          
          document.getElementById('giftNoticeContainer').style.display = (currentCategory === 'gift') ? 'block' : 'none';
          document.getElementById('ringNoticeContainer').style.display = (currentCategory === 'ring_male' || currentCategory === 'ring_female') ? 'block' : 'none';
          document.getElementById('cropNoticeContainer').style.display = (currentCategory === 'crop_male' || currentCategory === 'crop_female') ? 'block' : 'none';

          renderGallery();
        });
      });
    }

    async function fetchData() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getData`);
        const result = await response.json();
        if (result.status === 'success') {
          const settingsIds = ['settings_desc', 'settings_gift', 'settings_ring', 'settings_crop'];
          allData = result.data.filter(item => !settingsIds.includes(String(item.id)));
          
          const loadSetting = (id, elemId) => {
            const item = result.data.find(i => String(i.id) === id);
            const elem = document.getElementById(elemId);
            if (item && item.caption && elem) elem.innerText = item.caption;
          };

          loadSetting('settings_desc', 'siteDescription');
          loadSetting('settings_gift', 'giftDescription');
          loadSetting('settings_ring', 'ringDescription');
          loadSetting('settings_crop', 'cropDescription');

          renderGallery();
        }
      } catch (err) {
        console.error("載入資料失敗", err);
      }
    }

    async function updateItemById(id, field, value) {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=updateItem&id=${id}&field=${field}&value=${encodeURIComponent(value)}`);
        const result = await response.json();
        return result.status === 'success';
      } catch (err) {
        console.error(err);
        return false;
      }
    }

    function hasChinese(str) {
      return /[\u4e00-\u9fa5]/.test(str);
    }

    function compareCaption(a, b) {
      const capA = String(a.caption || '').trim();
      const capB = String(b.caption || '').trim();

      if (!capA && !capB) return 0;
      if (!capA) return 1;
      if (!capB) return -1;

      const aHasChinese = hasChinese(capA);
      const bHasChinese = hasChinese(capB);

      if (aHasChinese && !bHasChinese) return -1;
      if (!aHasChinese && bHasChinese) return 1;

      return capA.localeCompare(capB, 'zh-Hant', { numeric: true, sensitivity: 'base' });
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = allData.filter(item => {
        const matchCategory = (item.category === currentCategory);
        if (!matchCategory) return false;

        if (!keyword) return true;
        const caption = String(item.caption || '').toLowerCase();
        const note = String(item.note || '').toLowerCase();
        return caption.includes(keyword) || note.includes(keyword);
      });
      
      filtered.sort(compareCaption);
      gallery.innerHTML = '';

      filtered.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'img-card';
        card.id = `card-${item.id}`;
        card.setAttribute('data-id', item.id);

        const currentQty = item.quantity || '數量: 1';
        const isPending = String(currentQty).includes('暫售');
        const isSold = String(currentQty).includes('售出');
        
        let statusClass = '';
        if (isPending) statusClass = 'is-pending';
        else if (isSold) statusClass = 'is-sold';

        let badgeHTML = '';
        if (isAdmin) {
          badgeHTML = `
            <select class="status-select ${statusClass}" id="badge-${item.id}">
              <option value="數量: 1" ${currentQty === '數量: 1' ? 'selected' : ''}>數量: 1</option>
              <option value="數量: 2" ${currentQty === '數量: 2' ? 'selected' : ''}>數量: 2</option>
              <option value="數量: 3" ${currentQty === '數量: 3' ? 'selected' : ''}>數量: 3</option>
              <option value="數量: 4" ${currentQty === '數量: 4' ? 'selected' : ''}>數量: 4</option>
              <option value="數量: 5" ${currentQty === '數量: 5' ? 'selected' : ''}>數量: 5</option>
              <option value="數量: 6" ${currentQty === '數量: 6' ? 'selected' : ''}>數量: 6</option>
              <option value="數量: 7" ${currentQty === '數量: 7' ? 'selected' : ''}>數量: 7</option>
              <option value="數量: 8" ${currentQty === '數量: 8' ? 'selected' : ''}>數量: 8</option>
              <option value="數量: 9" ${currentQty === '數量: 9' ? 'selected' : ''}>數量: 9</option>
              <option value="數量: 10" ${currentQty === '數量: 10' ? 'selected' : ''}>數量: 10</option>
              <option value="大量" ${currentQty === '大量' ? 'selected' : ''}>大量</option>
              <option value="暫售，待交易" ${isPending ? 'selected' : ''}>暫售，待交易</option>
              <option value="已售出" ${isSold ? 'selected' : ''}>已售出</option>
            </select>
          `;
        } else {
          badgeHTML = `<span class="status-badge ${statusClass}" id="badge-${item.id}">${currentQty}</span>`;
        }

        card.innerHTML = `
          <button class="delete-btn" title="刪除圖片">✕</button>
          <div class="img-wrapper">
            ${badgeHTML}
            <img src="${item.url}" alt="image" loading="lazy" decoding="async" />
          </div>
          <div class="img-info">
            <span class="editable-text" contenteditable="${isAdmin}" id="text-${item.id}">${item.caption || ''}</span>
          </div>
          <div class="admin-note-box">
            <div class="admin-note-label">🔒 備註</div>
            <span class="admin-note-text" contenteditable="${isAdmin}" id="note-${item.id}">${item.note || ''}</span>
          </div>
        `;

        const imgEl = card.querySelector('img');
        imgEl.addEventListener('load', () => {
          card.classList.add('loaded');
        });
        if (imgEl.complete) {
          card.classList.add('loaded');
        }

        if (isAdmin) {
          card.querySelector('.delete-btn').addEventListener('click', () => {
            if (confirm('確定要刪除這張圖片嗎？')) {
              deleteItem(item.id);
            }
          });
        }

        gallery.appendChild(card);

        if (isAdmin) {
          const selectEl = document.getElementById(`badge-${item.id}`);
          if (selectEl) {
            selectEl.addEventListener('change', async () => {
              const newValue = selectEl.value;
              const status = document.getElementById('status');
              status.innerText = "正在儲存至雲端...";
              
              const success = await updateItem(item.id, 'quantity', newValue);
              if (success) {
                item.quantity = newValue;
                selectEl.className = 'status-select';
                if (newValue.includes('暫售')) {
                  selectEl.classList.add('is-pending');
                } else if (newValue.includes('售出')) {
                  selectEl.classList.add('is-sold');
                }
                status.innerText = "修改成功！";
              } else {
                status.innerText = "儲存失敗，請重試";
              }
              setTimeout(() => { status.innerText = ""; }, 1500);
            });
          }

          bindEditable(item.id, 'caption', `text-${item.id}`);
          bindEditable(item.id, 'note', `note-${item.id}`);
        }
      });
    }

    function bindEditable(id, field, elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      let originalValue = "";

      el.addEventListener('focus', () => {
        if (!isAdmin) return;
        originalValue = el.innerText.trim();
      });

      el.addEventListener('blur', async () => {
        if (!isAdmin) return;
        const newValue = el.innerText.trim();
        if (newValue === originalValue) return;

        const targetItem = allData.find(item => item.id === id);
        if (targetItem) {
          targetItem[field] = newValue;
        }

        const status = document.getElementById('status');
        status.innerText = "正在儲存至雲端...";
        
        const success = await updateItem(id, field, newValue);
        if (success) {
          originalValue = newValue;
          status.innerText = "修改成功！";
          if (field === 'caption') {
            renderGallery();
          }
        } else {
          status.innerText = "儲存失敗，請重試";
        }
        setTimeout(() => { status.innerText = ""; }, 1500);
      });

      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && field !== 'caption') { e.preventDefault(); el.blur(); }
      });
    }

    async function updateItem(id, field, value) {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=updateItem&id=${id}&field=${field}&value=${encodeURIComponent(value)}`);
        const result = await response.json();
        return result.status === 'success';
      } catch (err) {
        console.error(err);
        return false;
      }
    }

    async function deleteItem(id) {
      await fetch(`${SCRIPT_URL}?action=deleteItem&id=${id}`);
      allData = allData.filter(item => item.id !== id);
      renderGallery();
    }

    function compressImage(srcUrl, maxSize = 400, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxSize) {
              height *= maxSize / width;
              width = maxSize;
            }
          } else {
            if (height > maxSize) {
              width *= maxSize / height;
              height = maxSize;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve(compressedDataUrl);
        };
        img.onerror = (e) => reject(e);
        img.src = srcUrl;
      });
    }

    function handleImageFile(file) {
      if (!isAdmin || !file || !file.type.startsWith('image/')) return;
      const status = document.getElementById('status');
      status.innerText = "正在縮小並上傳圖片...";

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const compressedDataUrl = await compressImage(e.target.result, 400, 0.8);
          const base64Data = compressedDataUrl.split(',')[1];
          const defaultTime = String(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
          const tempId = 'temp_' + new Date().getTime();

          const tempItem = {
            id: tempId,
            category: currentCategory,
            url: compressedDataUrl,
            caption: defaultTime,
            quantity: '數量: 1',
            note: '',
            timestamp: new Date().getTime()
          };
          
          allData.unshift(tempItem);
          renderGallery();

          const formData = new URLSearchParams();
          formData.append('action', 'addItem');
          formData.append('category', currentCategory);
          formData.append('caption', defaultTime);
          formData.append('quantity', '數量: 1');
          formData.append('note', '');
          formData.append('mimeType', 'image/jpeg');
          formData.append('imageBase64', base64Data);

          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: formData
          });
          const result = await response.json();
          if (result.status === 'success') {
            status.innerText = "上傳成功！";
            fetchData();
            setTimeout(() => status.innerText = "", 1500);
          }
        } catch (err) {
          status.innerText = "上傳失敗";
          console.error(err);
          fetchData();
        }
      };
      reader.readAsDataURL(file);
    }

    document.addEventListener('paste', (e) => {
      if (!isAdmin || document.activeElement.isContentEditable) return;
      const items = e.clipboardData?.items;
      if (!items) return;
      for (let item of items) {
        if (item.type.includes('image')) {
          handleImageFile(item.getAsFile());
          break;
        }
      }
    });

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (isAdmin && e.dataTransfer.files.length > 0) {
        handleImageFile(e.dataTransfer.files[0]);
      }
    });
  </script>
</body>
