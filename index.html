<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⭐ 米米小舖-Club MStar ⭐</title>
  <style>
    :root {
      --bg-color: #36393f;
      --card-bg: #2f3136;
      --text-color: #dcddde;
      --accent-color: #5865f2;
      --success-color: #57f287;
      --danger-color: #ed4245;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 頂部列 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      gap: 20px;
    }

    .title-left {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      flex: 1;
    }

    .title-left h2 {
      margin: 0;
      white-space: nowrap;
      line-height: 1.4;
    }

    .info-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: #202225;
      border: 1px solid #4f545c;
      color: #b9bbbe;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
      width: 100%;
      max-width: 320px;
      box-sizing: border-box;
      word-break: break-word;
    }

    .info-badge .editable-text {
      flex: 1;
      outline: none;
    }

    /* 登入控制 */
    .auth-box {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .auth-inputs {
      display: none;
      gap: 8px;
      align-items: center;
    }

    .auth-inputs input {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #4f545c;
      background: #202225;
      color: #fff;
    }

    .auth-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    .cancel-btn {
      background: #4f545c;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* 下拉選單與分頁導覽列 */
    .tabs-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 2px solid #4f545c;
      padding-bottom: 10px;
      flex-wrap: wrap;
    }

    .tab-btn, .dropdown-toggle {
      background: var(--card-bg);
      color: var(--text-color);
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #fff;
      font-weight: bold;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #2f3136;
      min-width: 150px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5);
      border-radius: 6px;
      z-index: 100;
      margin-top: 4px;
      padding: 4px 0;
      border: 1px solid #4f545c;
    }

    .dropdown:hover .dropdown-menu {
      display: block;
    }

    .dropdown-item {
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-color);
      cursor: pointer;
      font-size: 13px;
    }

    .dropdown-item:hover {
      background-color: var(--accent-color);
      color: #fff;
    }

    .tab-text {
      outline: none;
      border-radius: 4px;
      padding: 2px 4px;
    }

    .is-admin .tab-text { cursor: text; }
    .is-admin .tab-text:hover { background: rgba(255, 255, 255, 0.15); }

    /* 上傳區 */
    .drop-zone {
      border: 2px dashed #4f545c;
      background: var(--card-bg);
      padding: 25px;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 25px;
      display: none;
    }
    
    .drop-zone.dragover {
      background: #393c43;
      border-color: var(--accent-color);
    }

    /* 圖片畫廊 */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, 130px);
      gap: 12px;
      align-items: start;
    }

    .img-card {
      width: 130px;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .img-wrapper {
      width: 130px;
      height: 130px;
      position: relative;
      background-color: #202225;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .status-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 10;
      background-color: rgba(32, 34, 37, 0.85);
      color: #fff;
      border: 1px solid #4f545c;
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 9px;
      font-weight: bold;
      backdrop-filter: blur(4px);
      max-width: 85px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      outline: none;
    }

    .is-admin .status-badge { cursor: text; }
    .is-admin .status-badge:hover { border-color: var(--accent-color); }

    .status-badge.is-sold {
      background-color: rgba(237, 66, 69, 0.9);
      border-color: var(--danger-color);
      color: #ffffff;
    }

    .delete-btn {
      position: absolute;
      top: 4px;
      left: 4px;
      background-color: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      z-index: 10;
    }

    .delete-btn:hover { background-color: var(--danger-color); }

    /* 圖片下方內容區域 */
    .img-info {
      padding: 6px;
      font-size: 11px;
      color: #b9bbbe;
      background-color: #2f3136;
      text-align: center;
    }

    .editable-text {
      outline: none;
      padding: 2px 4px;
      border-radius: 4px;
      color: #ffffff;
      word-break: break-all;
      display: block;
    }

    /* 🔒 圖片下方獨立備註欄（僅管理員可見） */
    .admin-note-box {
      display: none;
      background-color: #202225;
      border-top: 1px solid #4f545c;
      padding: 6px;
      font-size: 10px;
      text-align: left;
    }

    .is-admin .admin-note-box {
      display: block;
    }

    .admin-note-label {
      color: #57F287;
      font-weight: bold;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .admin-note-text {
      outline: none;
      color: #dcddde;
      word-break: break-all;
      display: block;
      padding: 2px;
      border-radius: 3px;
      min-height: 14px;
    }

    .is-admin .editable-text, .is-admin .admin-note-text { 
      background: rgba(0, 0, 0, 0.2); 
      cursor: text; 
    }
    
    .is-admin .editable-text:hover, .is-admin .admin-note-text:hover { 
      border: 1px #4f545c solid; 
    }
    
    .is-admin .img-card:hover .delete-btn { display: flex; }
  </style>
</head>
<body>

  <!-- 頂部列 -->
  <div class="header">
    <div class="title-left">
      <h2>⭐ 米米小舖 ⭐</h2>
      <div class="info-badge">
        <span class="info-icon">📕</span>
        <span class="editable-text" id="siteDescription" contenteditable="false">載入中...</span>
      </div>
    </div>

    <div class="auth-box" id="authBox">
      <button class="auth-btn" id="showLoginBtn">登入</button>
      <div class="auth-inputs" id="authInputs">
        <input type="email" id="emailInput" placeholder="管理員 Email">
        <input type="password" id="passwordInput" placeholder="密碼">
        <button class="auth-btn" id="loginBtn">確認</button>
        <button class="cancel-btn" id="cancelBtn">✕</button>
      </div>
    </div>
  </div>

  <!-- 下拉選單與分頁導覽列 -->
  <div class="tabs-container" id="tabsContainer">
    <!-- 單一分頁：家具 -->
    <button class="tab-btn active" data-category="general">
      <span class="tab-text" id="tab-title-general" contenteditable="false">🏠 家具</span>
    </button>
    
    <!-- 單一分頁：熊熊 -->
    <button class="tab-btn" data-category="memes">
      <span class="tab-text" id="tab-title-memes" contenteditable="false">🧸 熊熊</span>
    </button>

    <!-- 下拉選單：戒指 -->
    <div class="dropdown">
      <button class="dropdown-toggle">
        <span class="tab-text" id="tab-title-ring_group" contenteditable="false">💍 戒指</span> ▾
      </button>
      <div class="dropdown-menu">
        <div class="dropdown-item tab-btn" data-category="ring_male">
          <span class="tab-text" id="tab-title-ring_male" contenteditable="false">👦 限男</span>
        </div>
        <div class="dropdown-item tab-btn" data-category="ring_female">
          <span class="tab-text" id="tab-title-ring_female" contenteditable="false">👧 限女</span>
        </div>
      </div>
    </div>

    <!-- 下拉選單：作物 -->
    <div class="dropdown">
      <button class="dropdown-toggle">
        <span class="tab-text" id="tab-title-crop_group" contenteditable="false">🌱 作物</span> ▾
      </button>
      <div class="dropdown-menu">
        <div class="dropdown-item tab-btn" data-category="crop_male">
          <span class="tab-text" id="tab-title-crop_male" contenteditable="false">👦 限男</span>
        </div>
        <div class="dropdown-item tab-btn" data-category="crop_female">
          <span class="tab-text" id="tab-title-crop_female" contenteditable="false">👧 限女</span>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 上傳區 -->
  <div class="drop-zone" id="dropZone">
    <p style="font-size: 16px; margin-bottom: 8px;">💡 當前分頁：<b id="currentTabName">🏠 家具</b>（Ctrl + V 貼上圖片 / 拖曳上傳）</p>
    <p id="status" style="color: var(--success-color); margin: 0; font-weight: bold; min-height: 20px;"></p>
  </div>

  <div class="gallery" id="gallery"></div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, update, remove, set, onValue, onChildAdded, onChildChanged, onChildRemoved, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCVUSw-B1it_bQ2sF3pAsTI0pXcyF-Tdfg",
      authDomain: "mimishop-93214.firebaseapp.com",
      databaseURL: "https://mimishop-93214-default-rtdb.firebaseio.com",
      projectId: "mimishop-93214",
      storageBucket: "mimishop-93214.firebasestorage.app",
      messagingSenderId: "953118400447",
      appId: "1:953118400447:web:3a0e2fc6c4d2b65425cb0a",
      measurementId: "G-0EDJDFNFWF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentCategory = 'general';
    let currentCategoryDisplayName = '🏠 家具';
    let activeRef = null;
    let isAdmin = false;

    const fallbackCategories = {
      general: "🏠 家具",
      memes: "🧸 熊熊",
      ring_group: "💍 戒指",
      ring_male: "👦 限男",
      ring_female: "👧 限女",
      crop_group: "🌱 作物",
      crop_male: "👦 限男",
      crop_female: "👧 限女"
    };

    function showStatusSuccess() {
      const status = document.getElementById('status');
      if (status) {
        status.innerText = "上傳成功";
        setTimeout(() => { status.innerText = ""; }, 1500);
      }
    }

    function getDefaultTimeStr() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatStatusValue(val) {
      return val || '數量: 1';
    }

    function updateCurrentTabDisplay(name) {
      currentCategoryDisplayName = name || currentCategoryDisplayName;
      document.getElementById('currentTabName').innerText = currentCategoryDisplayName;
    }

    // 1. 說明欄載入與自動儲存
    const descElem = document.getElementById('siteDescription');
    const descRef = ref(db, 'settings/description');

    onValue(descRef, (snapshot) => {
      const data = snapshot.val();
      const defaultText = "訪客僅供檢視，管理員登入後可上傳與編輯。";
      if (document.activeElement !== descElem) {
        descElem.innerText = (data !== null && data !== undefined) ? data : defaultText;
      }
    });

    descElem.addEventListener('blur', () => {
      if (!isAdmin) return;
      set(descRef, descElem.innerText.trim()).then(() => showStatusSuccess());
    });

    descElem.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); descElem.blur(); }
    });

    // 2. 分頁標題同步與自動儲存
    const menuRef = ref(db, 'settings/menus/tabNames');
    onValue(menuRef, (snapshot) => {
      const data = snapshot.val() || {};
      Object.keys(fallbackCategories).forEach(cat => {
        const textElem = document.getElementById(`tab-title-${cat}`);
        if (textElem && document.activeElement !== textElem) {
          if (data[cat] !== undefined && data[cat] !== "") {
            textElem.innerText = data[cat];
          } else if (!textElem.innerText.trim()) {
            textElem.innerText = fallbackCategories[cat];
          }
        }
      });
    });

    Object.keys(fallbackCategories).forEach(cat => {
      const textSpan = document.getElementById(`tab-title-${cat}`);
      const btn = document.querySelector(`[data-category="${cat}"]`);

      if (textSpan) {
        textSpan.addEventListener('blur', () => {
          if (!isAdmin) return;
          update(ref(db, `settings/menus/tabNames`), { [cat]: textSpan.innerText.trim() })
            .then(() => showStatusSuccess());
        });

        textSpan.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); textSpan.blur(); }
        });
      }

      if (btn) {
        btn.addEventListener('click', (e) => {
          if (document.activeElement === textSpan) return;

          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          
          let displayName = textSpan.innerText.trim();
          const parentGroup = btn.closest('.dropdown');
          if (parentGroup) {
            const groupTitle = parentGroup.querySelector('.dropdown-toggle .tab-text').innerText.trim();
            displayName = `${groupTitle} - ${displayName}`;
          }

          updateCurrentTabDisplay(displayName);
          switchCategory(cat);
        });
      }
    });

    // 3. Auth 權限管理
    onAuthStateChanged(auth, (user) => {
      const authBox = document.getElementById('authBox');
      const dropZone = document.getElementById('dropZone');

      isAdmin = !!user;

      document.querySelectorAll('.tab-text').forEach(el => {
        el.contentEditable = isAdmin ? "true" : "false";
      });

      if (user) {
        document.body.classList.add('is-admin');
        dropZone.style.display = 'block';
        if (descElem) descElem.contentEditable = "true";
        
        authBox.innerHTML = `
          <span style="color:#57F287; font-size:14px;">已登入管理員</span>
          <button class="auth-btn" id="logoutBtn" style="background:#4f545c">登出</button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
      } else {
        document.body.classList.remove('is-admin');
        dropZone.style.display = 'none';
        if (descElem) descElem.contentEditable = "false";
        
        authBox.innerHTML = `
          <button class="auth-btn" id="showLoginBtn">登入</button>
          <div class="auth-inputs" id="authInputs">
            <input type="email" id="emailInput" placeholder="管理員 Email">
            <input type="password" id="passwordInput" placeholder="密碼">
            <button class="auth-btn" id="loginBtn">確認</button>
            <button class="cancel-btn" id="cancelBtn">✕</button>
          </div>
        `;
        bindAuthEvents();
      }
      
      switchCategory(currentCategory);
    });

    function bindAuthEvents() {
      const showLoginBtn = document.getElementById('showLoginBtn');
      const authInputs = document.getElementById('authInputs');
      const cancelBtn = document.getElementById('cancelBtn');
      const loginBtn = document.getElementById('loginBtn');

      if (showLoginBtn) {
        showLoginBtn.addEventListener('click', () => {
          showLoginBtn.style.display = 'none';
          authInputs.style.display = 'flex';
        });
      }

      if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
          authInputs.style.display = 'none';
          showLoginBtn.style.display = 'inline-block';
        });
      }

      if (loginBtn) {
        loginBtn.addEventListener('click', handleLogin);
      }
    }

    async function handleLogin() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        alert('登入失敗：' + err.message);
      }
    }

    // 4. 切換與讀取分頁圖片
    function renderStatusElement(key, rawStatusValue) {
      const statusValue = formatStatusValue(rawStatusValue);
      const isSoldClass = statusValue.includes('售出') ? 'is-sold' : '';
      return `
        <span class="status-badge ${isSoldClass}" id="badge-${key}" contenteditable="${isAdmin}">
          ${statusValue}
        </span>
      `;
    }

    function switchCategory(newCategory) {
      if (activeRef) off(activeRef);

      currentCategory = newCategory;
      activeRef = ref(db, `images/${currentCategory}`);
      document.getElementById('gallery').innerHTML = '';

      onChildAdded(activeRef, (snapshot) => {
        const key = snapshot.key;
        const data = snapshot.val();
        const gallery = document.getElementById('gallery');

        const card = document.createElement('div');
        card.className = 'img-card';
        card.id = `card-${key}`;

        const textValue = data.caption || getDefaultTimeStr();
        const statusValue = data.quantity || '數量: 1';
        const noteValue = data.note || '';

        card.innerHTML = `
          <button class="delete-btn" title="刪除圖片">✕</button>
          <div class="img-wrapper">
            ${renderStatusElement(key, statusValue)}
            <img src="${data.url}" loading="lazy" alt="uploaded image" />
          </div>
          <div class="img-info">
            <span class="editable-text" contenteditable="${isAdmin}" id="text-${key}">${textValue}</span>
          </div>
          <div class="admin-note-box">
            <div class="admin-note-label">🔒 備註</div>
            <span class="admin-note-text" contenteditable="${isAdmin}" id="note-${key}">${noteValue}</span>
          </div>
        `;

        gallery.prepend(card);

        // 刪除圖片
        const deleteBtn = card.querySelector('.delete-btn');
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (isAdmin && confirm('確定要刪除這張圖片嗎？')) {
            remove(ref(db, `images/${currentCategory}/${key}`));
          }
        });

        // 自動儲存與顯示「上傳成功」
        const bindAutoSave = (element, fieldName) => {
          if (!element) return;
          
          element.addEventListener('blur', () => {
            if (!isAdmin) return;
            const newValue = element.innerText.trim();
            update(ref(db, `images/${currentCategory}/${key}`), {
              [fieldName]: newValue
            }).then(() => showStatusSuccess());
          });

          element.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              element.blur();
            }
          });
        };

        bindAutoSave(card.querySelector(`#badge-${key}`), 'quantity');
        bindAutoSave(card.querySelector(`#text-${key}`), 'caption');
        bindAutoSave(card.querySelector(`#note-${key}`), 'note');
      });

      onChildChanged(activeRef, (snapshot) => {
        const key = snapshot.key;
        const data = snapshot.val();
        
        const targetTextElem = document.getElementById(`text-${key}`);
        if (targetTextElem && document.activeElement !== targetTextElem) {
          targetTextElem.innerText = data.caption || '';
        }

        const targetNoteElem = document.getElementById(`note-${key}`);
        if (targetNoteElem && document.activeElement !== targetNoteElem) {
          targetNoteElem.innerText = data.note || '';
        }

        const newStatus = formatStatusValue(data.quantity);
        const targetBadgeElem = document.getElementById(`badge-${key}`);
        if (targetBadgeElem && document.activeElement !== targetBadgeElem) {
          targetBadgeElem.innerText = newStatus;
          if (newStatus.includes('售出')) {
            targetBadgeElem.classList.add('is-sold');
          } else {
            targetBadgeElem.classList.remove('is-sold');
          }
        }
      });

      onChildRemoved(activeRef, (snapshot) => {
        const key = snapshot.key;
        const cardElem = document.getElementById(`card-${key}`);
        if (cardElem) cardElem.remove();
      });
    }

    // 圖片上傳
    function handleImageFile(file) {
      if (!isAdmin || !file || !file.type.startsWith('image/')) return;

      const status = document.getElementById('status');
      status.innerText = "正在上傳...";

      const reader = new FileReader();
      reader.onload = function(e) {
        push(ref(db, `images/${currentCategory}`), {
          url: e.target.result,
          caption: getDefaultTimeStr(),
          quantity: '數量: 1',
          note: '',
          timestamp: Date.now()
        }).then(() => {
          showStatusSuccess();
        });
      };
      reader.readAsDataURL(file);
    }

    document.addEventListener('paste', (e) => {
      if (!isAdmin || document.activeElement.isContentEditable) return;
      const items = e.clipboardData?.items;
      if (!items) return;
      for (let item of items) {
        if (item.type.includes('image')) {
          handleImageFile(item.getAsFile());
          break;
        }
      }
    });

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (isAdmin && e.dataTransfer.files.length > 0) {
        handleImageFile(e.dataTransfer.files[0]);
      }
    });
  </script>
</body>
</html>
