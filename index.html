<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⭐ 米米小舖-Club MStar ⭐</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #ffffff;
      --danger-color: #ff4d4d;
      --success-color: #cccccc;
      --warning-color: #ffd700;
      --cart-color: #2b73df; /* 藍色系購物車/勾選框 */
      --border-color: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      padding-right: 20px; 
    }

    /* 上方黏貼頂端區塊 */
    .sticky-header-wrapper {
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      z-index: 900;
      padding-top: 10px;
      padding-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .header-layout {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .left-control-panel {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      flex: 1;
      min-width: 280px;
    }

    .title-area-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .title-area h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.4;
      white-space: nowrap;
      color: #ffffff;
    }

    .discord-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(43, 115, 223, 0.15);
      border: 1px solid rgba(43, 115, 223, 0.4);
      color: #7289da;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      width: fit-content;
      text-decoration: none;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .discord-badge:hover {
      background-color: rgba(43, 115, 223, 0.3);
      border-color: rgba(43, 115, 223, 0.8);
      color: #8fa3ef;
    }

    .center-notice-panel {
      flex: 1;
      min-width: 280px;
      max-width: 100%;
    }

    .info-badge {
      display: inline-flex;
      align-items: flex-start;
      gap: 6px;
      background-color: transparent;
      border: none;
      color: var(--text-color);
      padding: 0;
      border-radius: 0;
      font-size: 15px;
      line-height: 1.5;
      box-sizing: border-box;
      text-align: left;
      width: 100%;
    }

    .info-badge .editable-text,
    .custom-notice-box .editable-text {
      outline: none;
      color: var(--text-color);
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 15px;
      text-align: left;
    }

    .is-admin .info-badge .editable-text,
    .is-admin .custom-notice-box .editable-text {
      background: rgba(255, 255, 255, 0.1);
      cursor: text;
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px dashed var(--accent-color);
    }

    /* 右側直立懸浮分頁 */
    .side-tabs-panel {
      position: fixed;
      right: 20px;
      top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1100;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      transition: all 0.3s ease;
    }

    .side-tabs-panel.collapsed {
      padding: 8px;
      gap: 4px;
    }
    .side-tabs-panel.collapsed .collapse-content {
      display: none;
    }

    .collapse-toggle-btn {
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 100px;
      box-sizing: border-box;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .collapse-toggle-btn:hover {
      background: #2a2a2a;
      border-color: var(--accent-color);
    }

    .collapse-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tab-btn, .dropdown-toggle {
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      width: 100px;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .tab-btn:hover, .dropdown-toggle:hover {
      background: #2a2a2a;
      border-color: var(--accent-color);
    }

    .tab-btn.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: #121212;
      font-weight: bold;
    }

    /* 購物車分頁特別樣式（藍色系，即使收合也常駐在面板最上方） */
    .tab-btn[data-category="cart"] {
      border-color: var(--cart-color);
      color: #7289da;
      justify-content: space-between;
      position: relative;
    }
    .tab-btn[data-category="cart"].active {
      background: var(--cart-color);
      color: #ffffff;
      font-weight: bold;
    }

    /* 紅底白字圓形數量徽章樣式 */
    .cart-badge-count {
      background-color: #ff4d4d;
      color: #ffffff;
      font-size: 10px;
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 14px;
      line-height: 1.2;
    }

    .dropdown {
      position: relative;
      display: block;
      width: 100px;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 0;
      right: calc(100% + 8px);
      background-color: var(--card-bg);
      min-width: 110px;
      box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.5);
      border-radius: 6px;
      z-index: 1200;
      padding: 4px 0;
      border: 1px solid var(--border-color);
    }

    .dropdown:hover .dropdown-menu,
    .dropdown.open .dropdown-menu,
    .dropdown-menu:hover {
      display: block;
    }

    .dropdown-item {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      color: var(--text-color);
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      box-sizing: border-box;
      background: none;
      border: none;
      text-align: left;
    }

    .dropdown-item:hover {
      background-color: var(--accent-color);
      color: #121212;
    }

    .auth-section-wrapper {
      border-top: 1px solid var(--border-color);
      padding-top: 8px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100px;
      box-sizing: border-box;
    }

    .auth-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .auth-inputs {
      display: none;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .auth-inputs input {
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      width: 100%;
      font-size: 12px;
      box-sizing: border-box;
    }

    .auth-btn {
      background: var(--accent-color);
      color: #121212;
      border: none;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }

    .cancel-btn {
      background: #333333;
      color: var(--text-color);
      border: none;
      padding: 4px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      width: 100%;
      text-align: center;
    }

    .search-input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      width: 100%;
      font-size: 13px;
      box-sizing: border-box;
    }

    .custom-notice-container {
      display: none;
      width: 100%;
      margin: 15px 0 0 0;
      text-align: center;
    }

    .custom-notice-box {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.5;
      text-align: left;
      box-sizing: border-box;
      width: 100%;
    }

    .drop-zone {
      border: 2px dashed var(--border-color);
      background: var(--card-bg);
      padding: 25px;
      text-align: center;
      border-radius: 8px;
      margin-top: 20px;
      margin-bottom: 25px;
      display: none;
    }
    
    .drop-zone.dragover {
      background: #2a2a2a;
      border-color: var(--accent-color);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, 120px);
      gap: 12px;
      align-items: start;
      margin-top: 20px;
    }

    .img-card {
      width: 120px;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      position: relative;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      border: 1px solid var(--border-color);
    }

    .img-card.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    .img-wrapper {
      width: 120px;
      height: 120px;
      position: relative;
      background-color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-text {
      position: absolute;
      font-size: 11px;
      color: #888888;
      text-align: center;
      width: 100%;
      padding: 0 4px;
      box-sizing: border-box;
      z-index: 1;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      position: relative;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .img-card.loaded .img-wrapper img {
      opacity: 1;
    }

    .status-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 10;
      background-color: rgba(30, 30, 30, 0.9);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 9px;
      font-weight: bold;
      max-width: 85px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-badge.is-pending {
      background-color: rgba(255, 215, 0, 0.95);
      border-color: var(--warning-color);
      color: #121212;
    }

    .status-badge.is-sold {
      background-color: rgba(255, 77, 77, 0.9);
      border-color: var(--danger-color);
      color: #ffffff;
    }

    .status-select {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 10;
      background-color: rgba(30, 30, 30, 0.95);
      color: var(--text-color);
      border: 1px solid var(--accent-color);
      border-radius: 4px;
      padding: 1px 2px;
      font-size: 9px;
      font-weight: bold;
      cursor: pointer;
      outline: none;
    }

    /* 左上角藍色系勾選方框（管理端與客戶端通用） */
    .cart-checkbox {
      position: absolute;
      top: 4px;
      left: 4px;
      z-index: 10;
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--cart-color);
    }

    /* 購物車內訪客可選擇數量的下拉選單 */
    .cart-qty-select {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 10;
      background-color: rgba(30, 30, 30, 0.95);
      color: #ffffff;
      border: 1px solid var(--cart-color);
      border-radius: 4px;
      padding: 1px 2px;
      font-size: 9px;
      font-weight: bold;
      cursor: pointer;
      outline: none;
    }

    .delete-btn {
      position: absolute;
      top: 4px;
      left: 26px; /* 讓位給左上角的勾選框 */
      background-color: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      z-index: 10;
    }

    .delete-btn:hover { background-color: #555555; }

    .img-info {
      padding: 6px;
      font-size: 11px;
      color: var(--text-color);
      background-color: var(--card-bg);
      text-align: center;
      border-top: 1px solid var(--border-color);
    }

    .caption-container {
      display: flex;
      align-items: center;
      background-color: #171717;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      padding: 2px 4px;
      box-sizing: border-box;
      width: 100%;
      gap: 4px;
    }

    .price-col {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 37px; 
      flex-shrink: 0;
      gap: 1px;
      color: #ffffff;
      font-weight: bold;
      font-size: 11px;
    }

    .price-col .currency-symbol {
      color: #ffffff;
      user-select: none;
    }

    .price-col .editable-price {
      width: 24px;
      text-align: center;
      outline: none;
      color: #ffffff;
      font-size: 11px;
    }

    .desc-col {
      flex: 1;
      min-width: 0;
      border-left: 1px solid var(--border-color);
      padding-left: 4px;
    }

    .desc-col .editable-text {
      outline: none;
      padding: 2px 4px;
      border-radius: 4px;
      color: var(--text-color);
      word-break: break-all;
      display: block;
      text-align: center;
      font-size: 11px;
      width: 100%;
      box-sizing: border-box;
    }

    .admin-note-box {
      display: none;
      background-color: #181818;
      border-top: 1px solid var(--border-color);
      padding: 6px;
      font-size: 10px;
      text-align: left;
    }

    .is-admin .admin-note-box { display: block; }

    .admin-note-label {
      color: var(--success-color);
      font-weight: bold;
      margin-bottom: 2px;
    }

    .admin-note-text {
      outline: none;
      color: var(--text-color);
      word-break: break-all;
      display: block;
      padding: 2px;
      border-radius: 3px;
      min-height: 14px;
    }

    .is-admin .desc-col .editable-text, 
    .is-admin .info-badge .editable-text, 
    .is-admin .custom-notice-box .editable-text, 
    .is-admin .admin-note-text, 
    .is-admin .editable-price { 
      background: rgba(255, 255, 255, 0.1); 
      cursor: text; 
    }
    
    .is-admin .img-card:hover .delete-btn { display: flex; }
  </style>
</head>
<body>

  <!-- 右側直立懸浮分頁 -->
  <div class="side-tabs-panel" id="sideTabsPanel">
    <button class="collapse-toggle-btn" id="collapseToggleBtn">📂 收合 ▾</button>
    
    <!-- 購物車按鈕獨立放於外面，即使面板收合也不會消失 -->
    <button class="tab-btn" id="cartTabBtn" data-category="cart">
      <span>🛒 購物車</span>
    </button>

    <div class="collapse-content" id="collapseContent">
      <button class="tab-btn active" data-category="general">🏠 家具</button>
      <button class="tab-btn" data-category="memes">🧸 熊熊</button>
      <button class="tab-btn" data-category="pot">🪴 花盆</button>
      
      <div class="dropdown" id="dropdown-ring">
        <button class="dropdown-toggle" data-dropdown="dropdown-ring">💍 戒指 ▾</button>
        <div class="dropdown-menu">
          <button class="dropdown-item tab-btn" data-category="ring_male">👦 限男</button>
          <button class="dropdown-item tab-btn" data-category="ring_female">👧 限女</button>
        </div>
      </div>

      <div class="dropdown" id="dropdown-crop">
        <button class="dropdown-toggle" data-dropdown="dropdown-crop">🌱 作物 ▾</button>
        <div class="dropdown-menu">
          <button class="dropdown-item tab-btn" data-category="crop_male">👦 限男</button>
          <button class="dropdown-item tab-btn" data-category="crop_female">👧 限女</button>
        </div>
      </div>

      <button class="tab-btn" data-category="gift">🎁 贈品區</button>
    </div>

    <div class="auth-section-wrapper">
      <div class="auth-box" id="authBox">
        <button class="auth-btn" id="showLoginBtn">登入</button>
        <div class="auth-inputs" id="authInputs">
          <input type="password" id="passwordInput" placeholder="管理員密碼">
          <button class="auth-btn" id="loginBtn">確認</button>
          <button class="cancel-btn" id="cancelBtn">✕</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 上方黏貼頂端區塊 -->
  <div class="sticky-header-wrapper">
    <div class="header-layout">
      
      <div class="header-top-row">
        <div class="left-control-panel">
          <div class="title-area-group">
            <div class="title-area">
              <h2>⭐ 米米小舖 ⭐</h2>
            </div>
            <a href="https://discord.com/users/mimi_ouo" target="_blank" class="discord-badge" title="點擊前往 Discord 聯絡">
              <span>💬</span>
              <span>Discord：mimi_ouo</span>
            </a>
          </div>
          
          <div class="center-notice-panel">
            <div class="info-badge">
              <span>📕</span>
              <span class="editable-text" id="siteDescription" contenteditable="false">本人夜班, 交易需另約時間, 故不接急單
交易方式: 可糖可T, 比值1:1</span>
            </div>
          </div>
        </div>
      </div>

      <div class="search-panel">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋全區名稱或備註...">
      </div>

    </div>
  </div>
  
  <div class="custom-notice-container" id="giftNoticeContainer">
    <div class="custom-notice-box">
      <span>🎁</span>
      <span class="editable-text" id="giftDescription" contenteditable="false">本區一律2糖, 如有購買任一商品或本區滿五件, 可選本區一件免費贈送</span>
    </div>
  </div>

  <div class="custom-notice-container" id="ringNoticeContainer">
    <div class="custom-notice-box">
      <span>💍</span>
      <span class="editable-text" id="ringDescription" contenteditable="false">情侶等級由買家負擔</span>
    </div>
  </div>

  <div class="custom-notice-container" id="cropNoticeContainer">
    <div class="custom-notice-box">
      <span>🌱</span>
      <span class="editable-text" id="cropDescription" contenteditable="false">誕生作物只收T, 一律種植後付款</span>
    </div>
  </div>

  <div class="drop-zone" id="dropZone">
    <p style="font-size: 16px; margin-bottom: 8px;">💡 當前分頁：<b id="currentTabName">🏠 家具</b>（Ctrl + V 貼上圖片 / 拖曳上傳）</p>
    <p id="status" style="color: var(--accent-color); margin: 0; font-weight: bold;"></p>
  </div>

  <div class="gallery" id="gallery"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVrP__g-bnoVRQQrJkKLlMZDhSbFeUuTMyw6-zVRhtYkkSedoVbJXKUwN0bUyc4vs3rQ/exec";

    let currentCategory = 'general';
    let currentCategoryDisplayName = '🏠 家具';
    let isAdmin = localStorage.getItem('isAdmin') === 'true';
    let allData = [];
    let cartItems = new Map(); // 用 Map 記錄加入購物車的商品 ID 與其選擇的數量

    const ADMIN_PASSWORD = "1j6ul42l4ji3++";

    document.addEventListener('DOMContentLoaded', () => {
      initAuthUI();
      setupTabs();
      setupCollapseToggle();
      fetchData();
      updateCartButtonBadge();
      
      document.getElementById('searchInput').addEventListener('input', renderGallery);
    });

    function setupCollapseToggle() {
      const toggleBtn = document.getElementById('collapseToggleBtn');
      const panel = document.getElementById('sideTabsPanel');

      toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        panel.classList.toggle('collapsed');
        if (panel.classList.contains('collapsed')) {
          toggleBtn.innerText = "📂 展開 ▴";
        } else {
          toggleBtn.innerText = "📂 收合 ▾";
        }
      });
    }

    function updateCartButtonBadge() {
      const cartBtn = document.getElementById('cartTabBtn');
      if (cartItems.size > 0) {
        cartBtn.innerHTML = `<span>🛒 購物車</span><span class="cart-badge-count">${cartItems.size}</span>`;
      } else {
        cartBtn.innerHTML = `<span>🛒 購物車</span>`;
      }
    }

    function initAuthUI() {
      const authBox = document.getElementById('authBox');
      const dropZone = document.getElementById('dropZone');
      const descElem = document.getElementById('siteDescription');
      const giftDescElem = document.getElementById('giftDescription');
      const ringDescElem = document.getElementById('ringDescription');
      const cropDescElem = document.getElementById('cropDescription');

      if (isAdmin) {
        document.body.classList.add('is-admin');
        dropZone.style.display = 'block';
        descElem.contentEditable = "true";
        giftDescElem.contentEditable = "true";
        ringDescElem.contentEditable = "true";
        cropDescElem.contentEditable = "true";
        authBox.innerHTML = `
          <div style="font-size:11px; font-weight:bold; color:var(--success-color); text-align:center; margin-bottom:4px;">已登入</div>
          <button class="auth-btn" id="logoutBtn" style="background:#333; color:var(--text-color);">登出</button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => {
          localStorage.removeItem('isAdmin');
          location.reload();
        });
      } else {
        document.body.classList.remove('is-admin');
        dropZone.style.display = 'none';
        descElem.contentEditable = "false";
        giftDescElem.contentEditable = "false";
        ringDescElem.contentEditable = "false";
        cropDescElem.contentEditable = "false";
        authBox.innerHTML = `
          <button class="auth-btn" id="showLoginBtn">登入</button>
          <div class="auth-inputs" id="authInputs">
            <input type="password" id="passwordInput" placeholder="管理員密碼">
            <button class="auth-btn" id="loginBtn">確認</button>
            <button class="cancel-btn" id="cancelBtn">✕</button>
          </div>
        `;
        bindAuthEvents();
      }

      setupEditableSave(descElem, 'settings_desc', 'caption');
      setupEditableSave(giftDescElem, 'settings_gift', 'caption');
      setupEditableSave(ringDescElem, 'settings_ring', 'caption');
      setupEditableSave(cropDescElem, 'settings_crop', 'caption');
    }

    function setupEditableSave(elem, id, field) {
      let originalText = "";
      elem.addEventListener('focus', () => {
        if (!isAdmin) return;
        originalText = elem.innerText;
      });

      elem.addEventListener('blur', async () => {
        if (!isAdmin) return;
        const newText = elem.innerText;
        if (newText === originalText) return;

        const status = document.getElementById('status');
        status.innerText = "正在儲存至雲端...";
        
        const success = await updateItemById(id, field, newText);
        if (success) {
          originalText = newText;
          status.innerText = "修改成功！";
        } else {
          status.innerText = "儲存失敗，請重試";
        }
        setTimeout(() => { status.innerText = ""; }, 1500);
      });
    }

    function bindAuthEvents() {
      const showLoginBtn = document.getElementById('showLoginBtn');
      const authInputs = document.getElementById('authInputs');
      const cancelBtn = document.getElementById('cancelBtn');
      const loginBtn = document.getElementById('loginBtn');

      showLoginBtn.addEventListener('click', () => {
        showLoginBtn.style.display = 'none';
        authInputs.style.display = 'flex';
      });

      cancelBtn.addEventListener('click', () => {
        authInputs.style.display = 'none';
        showLoginBtn.style.display = 'block';
      });

      loginBtn.addEventListener('click', () => {
        const pass = document.getElementById('passwordInput').value;
        if (pass === ADMIN_PASSWORD) {
          localStorage.setItem('isAdmin', 'true');
          location.reload();
        } else {
          alert('密碼錯誤！');
        }
      });
    }

    function setupTabs() {
      document.querySelectorAll('.dropdown-toggle').forEach(toggle => {
        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          const dropdownId = toggle.getAttribute('data-dropdown');
          const dropdownEl = document.getElementById(dropdownId);
          
          const isOpen = dropdownEl.classList.contains('open');
          document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
          
          if (!isOpen) {
            dropdownEl.classList.add('open');
          }
        });
      });

      document.addEventListener('click', () => {
        document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
      });

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          
          const parentDropdown = btn.closest('.dropdown');
          if (parentDropdown) {
            parentDropdown.classList.remove('open');
          } else {
            document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
          }

          currentCategory = btn.getAttribute('data-category');
          currentCategoryDisplayName = btn.getAttribute('data-category') === 'cart' ? '🛒 購物車' : btn.innerText.trim();
          document.getElementById('currentTabName').innerText = currentCategoryDisplayName;
          
          document.getElementById('giftNoticeContainer').style.display = (currentCategory === 'gift') ? 'block' : 'none';
          document.getElementById('ringNoticeContainer').style.display = (currentCategory === 'ring_male' || currentCategory === 'ring_female') ? 'block' : 'none';
          document.getElementById('cropNoticeContainer').style.display = (currentCategory === 'crop_male' || currentCategory === 'crop_female') ? 'block' : 'none';

          document.getElementById('searchInput').value = '';
          renderGallery();
        });
      });
    }

    async function fetchData() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getData`);
        const result = await response.json();
        if (result.status === 'success') {
          const settingsIds = ['settings_desc', 'settings_gift', 'settings_ring', 'settings_crop'];
          allData = result.data.filter(item => !settingsIds.includes(String(item.id)));
          
          const loadSetting = (id, elemId) => {
            const item = result.data.find(i => String(i.id) === id);
            const elem = document.getElementById(elemId);
            if (item && item.caption && elem) elem.innerText = item.caption;
          };

          loadSetting('settings_desc', 'siteDescription');
          loadSetting('settings_gift', 'giftDescription');
          loadSetting('settings_ring', 'ringDescription');
          loadSetting('settings_crop', 'cropDescription');

          renderGallery();
        }
      } catch (err) {
        console.error("載入資料失敗", err);
      }
    }

    async function updateItemById(id, field, value) {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=updateItem&id=${id}&field=${field}&value=${encodeURIComponent(value)}`);
        const result = await response.json();
        return result.status === 'success';
      } catch (err) {
        console.error(err);
        return false;
      }
    }

    function hasChinese(str) {
      return /[\u4e00-\u9fa5]/.test(str);
    }

    function compareItems(a, b) {
      const priceA = parseFloat(a.price) || 0;
      const priceB = parseFloat(b.price) || 0;

      if (priceA !== priceB) {
        return priceA - priceB;
      }

      const capA = String(a.caption || '').trim();
      const capB = String(b.caption || '').trim();

      if (!capA && !capB) return 0;
      if (!capA) return 1;
      if (!capB) return -1;

      const aHasChinese = hasChinese(capA);
      const bHasChinese = hasChinese(capB);

      if (aHasChinese && !bHasChinese) return -1;
      if (!aHasChinese && bHasChinese) return 1;

      return capA.localeCompare(capB, 'zh-Hant', { numeric: true, sensitivity: 'base' });
    }

    function generateVisitorQtyOptions(adminQtyStr, selectedQty) {
      let optionsHTML = '';
      const text = String(adminQtyStr).trim();

      if (text === '大量') {
        const options = ['數量: 1', '數量: 2', '數量: 3', '數量: 4', '數量: 5', '數量: 6', '數量: 7', '數量: 8', '數量: 9', '數量: 10', '大量'];
        options.forEach(opt => {
          optionsHTML += `<option value="${opt}" ${selectedQty === opt ? 'selected' : ''}>${opt}</option>`;
        });
      } else {
        const match = text.match(/\d+/);
        const maxNum = match ? parseInt(match[0], 10) : 1;
        
        for (let i = 1; i <= maxNum; i++) {
          const val = `數量: ${i}`;
          optionsHTML += `<option value="${val}" ${selectedQty === val ? 'selected' : ''}>${val}</option>`;
        }
      }
      return optionsHTML;
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = allData.filter(item => {
        if (keyword) {
          const caption = String(item.caption || '').toLowerCase();
          const note = String(item.note || '').toLowerCase();
          return caption.includes(keyword) || note.includes(keyword);
        } else if (currentCategory === 'cart') {
          return cartItems.has(String(item.id));
        } else {
          return item.category === currentCategory;
        }
      });
      
      filtered.sort(compareItems);
      gallery.innerHTML = '';

      filtered.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'img-card';
        card.id = `card-${item.id}`;
        card.setAttribute('data-id', item.id);

        const currentQty = item.quantity || '數量: 1';
        const isPending = String(currentQty).includes('暫售');
        const isSold = String(currentQty).includes('售出');
        
        let statusClass = '';
        if (isPending) statusClass = 'is-pending';
        else if (isSold) statusClass = 'is-sold';

        let badgeHTML = '';
        const isChecked = cartItems.has(String(item.id));
        const selectedQty = cartItems.get(String(item.id)) || '數量: 1';

        if (isAdmin) {
          let topRightHTML = `<select class="status-select ${statusClass}" id="badge-${item.id}">
            <option value="數量: 1" ${currentQty === '數量: 1' ? 'selected' : ''}>數量: 1</option>
            <option value="數量: 2" ${currentQty === '數量: 2' ? 'selected' : ''}>數量: 2</option>
            <option value="數量: 3" ${currentQty === '數量: 3' ? 'selected' : ''}>數量: 3</option>
            <option value="數量: 4" ${currentQty === '數量: 4' ? 'selected' : ''}>數量: 4</option>
            <option value="數量: 5" ${currentQty === '數量: 5' ? 'selected' : ''}>數量: 5</option>
            <option value="數量: 6" ${currentQty === '數量: 6' ? 'selected' : ''}>數量: 6</option>
            <option value="數量: 7" ${currentQty === '數量: 7' ? 'selected' : ''}>數量: 7</option>
            <option value="數量: 8" ${currentQty === '數量: 8' ? 'selected' : ''}>數量: 8</option>
            <option value="數量: 9" ${currentQty === '數量: 9' ? 'selected' : ''}>數量: 9</option>
            <option value="數量: 10" ${currentQty === '數量: 10' ? 'selected' : ''}>數量: 10</option>
            <option value="大量" ${currentQty === '大量' ? 'selected' : ''}>大量</option>
            <option value="暫售，待交易" ${isPending ? 'selected' : ''}>暫售，待交易</option>
            <option value="已售出" ${isSold ? 'selected' : ''}>已售出</option>
          </select>`;

          if (isChecked) {
            topRightHTML = `
              <select class="cart-qty-select" id="cart-qty-${item.id}">
                ${generateVisitorQtyOptions(currentQty, selectedQty)}
              </select>
            `;
          }

          badgeHTML = `
            <input type="checkbox" class="cart-checkbox" id="cart-chk-${item.id}" ${isChecked ? 'checked' : ''} title="加入購物車" />
            ${topRightHTML}
          `;
        } else {
          let topRightHTML = `<span class="status-badge ${statusClass}" style="right:4px; left:auto;" id="badge-${item.id}">${currentQty}</span>`;
          if (isChecked) {
            topRightHTML = `
              <select class="cart-qty-select" id="cart-qty-${item.id}">
                ${generateVisitorQtyOptions(currentQty, selectedQty)}
              </select>
            `;
          }

          badgeHTML = `
            <input type="checkbox" class="cart-checkbox" id="cart-chk-${item.id}" ${isChecked ? 'checked' : ''} title="加入購物車" />
            ${topRightHTML}
          `;
        }

        const fullCaption = item.caption || '';
        let priceVal = item.price || '';
        let textVal = fullCaption;

        card.innerHTML = `
          <button class="delete-btn" title="刪除圖片">✕</button>
          <div class="img-wrapper">
            <span class="loading-text">加載中請稍後</span>
            ${badgeHTML}
            <img src="${item.url}" alt="image" loading="lazy" decoding="async" />
          </div>
          <div class="img-info">
            <div class="caption-container">
              <div class="price-col">
                <span class="currency-symbol">$</span>
                <span class="editable-price" contenteditable="${isAdmin}" id="price-${item.id}" maxlength="3">${priceVal}</span>
              </div>
              <div class="desc-col">
                <span class="editable-text" contenteditable="${isAdmin}" id="text-${item.id}">${textVal}</span>
              </div>
            </div>
          </div>
          <div class="admin-note-box">
            <div class="admin-note-label">🔒 備註</div>
            <span class="admin-note-text" contenteditable="${isAdmin}" id="note-${item.id}">${item.note || ''}</span>
          </div>
        `;

        const imgEl = card.querySelector('img');
        imgEl.addEventListener('load', () => {
          card.classList.add('loaded');
        });
        if (imgEl.complete) {
          card.classList.add('loaded');
        }

        if (isAdmin) {
          card.querySelector('.delete-btn').addEventListener('click', () => {
            if (confirm('確定要刪除這張圖片嗎？')) {
              deleteItem(item.id);
            }
          });
        }

        const chkEl = card.querySelector(`#cart-chk-${item.id}`);
        if (chkEl) {
          chkEl.addEventListener('change', () => {
            const status = document.getElementById('status');
            if (chkEl.checked) {
              cartItems.set(String(item.id), '數量: 1');
              status.innerText = "🛒 已加入購物車！";
            } else {
              cartItems.delete(String(item.id));
              status.innerText = "❌ 已從購物車移除";
            }
            setTimeout(() => { status.innerText = ""; }, 1500);
            updateCartButtonBadge();
            renderGallery();
          });
        }

        const qtySelEl = card.querySelector(`#cart-qty-${item.id}`);
        if (qtySelEl) {
          qtySelEl.addEventListener('change', () => {
            cartItems.set(String(item.id), qtySelEl.value);
            updateCartButtonBadge();
          });
        }

        gallery.appendChild(card);

        if (isAdmin) {
          const selectEl = document.getElementById(`badge-${item.id}`);
          if (selectEl) {
            selectEl.addEventListener('change', async () => {
              const newValue = selectEl.value;
              const status = document.getElementById('status');
              status.innerText = "正在儲存至雲端...";
              
              const success = await updateItem(item.id, 'quantity', newValue);
              if (success) {
                item.quantity = newValue;
                selectEl.className = 'status-select';
                if (newValue.includes('暫售')) {
                  selectEl.classList.add('is-pending');
                } else if (newValue.includes('售出')) {
                  selectEl.classList.add('is-sold');
                }
                status.innerText = "修改成功！";
              } else {
                status.innerText = "儲存失敗，請重試";
              }
              setTimeout(() => { status.innerText = ""; }, 1500);
            });
          }

          bindEditable(item.id, 'caption', `text-${item.id}`);
          bindEditable(item.id, 'price', `price-${item.id}`);
          bindEditable(item.id, 'note', `note-${item.id}`);
        }
      });
    }

    function bindEditable(id, field, elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      let originalValue = "";

      el.addEventListener('focus', () => {
        if (!isAdmin) return;
        originalValue = el.innerText.trim();
      });

      el.addEventListener('blur', async () => {
        if (!isAdmin) return;
        let newValue = el.innerText.trim();
        
        if (field === 'price') {
          newValue = newValue.replace(/\D/g, '').slice(0, 3);
          el.innerText = newValue;
        }

        if (newValue === originalValue) return;

        const targetItem = allData.find(item => String(item.id) === String(id));
        if (targetItem) {
          targetItem[field] = newValue;
        }

        const status = document.getElementById('status');
        status.innerText = "正在儲存至雲端...";
        
        const success = await updateItem(id, field, newValue);
        if (success) {
          originalValue = newValue;
          status.innerText = "修改成功！";
          if (field === 'caption' || field === 'price') {
            renderGallery();
          }
        } else {
          status.innerText = "儲存失敗，請重試";
        }
        setTimeout(() => { status.innerText = ""; }, 1500);
      });

      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      });
    }

    async function updateItem(id, field, value) {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=updateItem&id=${id}&field=${field}&value=${encodeURIComponent(value)}`);
        const result = await response.json();
        return result.status === 'success';
      } catch (err) {
        console.error(err);
        return false;
      }
    }

    async function deleteItem(id) {
      await fetch(`${SCRIPT_URL}?action=deleteItem&id=${id}`);
      allData = allData.filter(item => String(item.id) !== String(id));
      cartItems.delete(String(id));
      updateCartButtonBadge();
      renderGallery();
    }

    function compressImage(srcUrl, maxSize = 400, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxSize) {
              height *= maxSize / width;
              width = maxSize;
            }
          } else {
            if (height > maxSize) {
              width *= maxSize / height;
              height = maxSize;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve(compressedDataUrl);
        };
        img.onerror = (e) => reject(e);
        img.src = srcUrl;
      });
    }

    function handleImageFile(file) {
      if (!isAdmin || !file || !file.type.startsWith('image/')) return;
      const status = document.getElementById('status');
      status.innerText = "正在縮小並上傳圖片...";

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const compressedDataUrl = await compressImage(e.target.result, 400, 0.8);
          const base64Data = compressedDataUrl.split(',')[1];
          const defaultTime = String(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
          const tempId = 'temp_' + new Date().getTime();

          const tempItem = {
            id: tempId,
            category: currentCategory,
            url: compressedDataUrl,
            caption: defaultTime,
            price: '',
            quantity: '數量: 1',
            note: '',
            timestamp: new Date().getTime()
          };
          
          allData.unshift(tempItem);
          renderGallery();

          const formData = new URLSearchParams();
          formData.append('action', 'addItem');
          formData.append('category', currentCategory);
          formData.append('caption', defaultTime);
          formData.append('price', '');
          formData.append('quantity', '數量: 1');
          formData.append('note', '');
          formData.append('mimeType', 'image/jpeg');
          formData.append('imageBase64', base64Data);

          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: formData
          });
          const result = await response.json();
          if (result.status === 'success') {
            status.innerText = "上傳成功！";
            fetchData();
            setTimeout(() => status.innerText = "", 1500);
          }
        } catch (err) {
          status.innerText = "上傳失敗";
          console.error(err);
          fetchData();
        }
      };
      reader.readAsDataURL(file);
    }

    document.addEventListener('paste', (e) => {
      if (!isAdmin || document.activeElement.isContentEditable) return;
      const items = e.clipboardData?.items;
      if (!items) return;
      for (let item of items) {
        if (item.type.includes('image')) {
          handleImageFile(item.getAsFile());
          break;
        }
      }
    });

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (isAdmin && e.dataTransfer.files.length > 0) {
        handleImageFile(e.dataTransfer.files[0]);
      }
    });
  </script>
