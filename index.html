<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⭐ 米米小舖-Club MStar ⭐</title>
  <style>
    :root {
      --bg-color: #36393f;
      --card-bg: #2f3136;
      --text-color: #dcddde;
      --accent-color: #5865f2;
      --danger-color: #ed4245;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 頂部列 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      gap: 20px;
    }

    .title-left {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      flex: 1;
    }

    .title-left h2 {
      margin: 0;
      white-space: nowrap;
      line-height: 1.4;
    }

    .info-badge {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      background-color: #202225;
      border: 1px solid #4f545c;
      color: #b9bbbe;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
      width: 100%;
      max-width: 280px;
      min-height: 38px;
      box-sizing: border-box;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .info-badge .editable-text {
      flex: 1;
      outline: none;
    }

    /* 登入控制 */
    .auth-box {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .auth-inputs {
      display: none;
      gap: 8px;
      align-items: center;
    }

    .auth-inputs input {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #4f545c;
      background: #202225;
      color: #fff;
    }

    .auth-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    .cancel-btn {
      background: #4f545c;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* 分頁導覽列 */
    .tabs-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #4f545c;
      padding-bottom: 10px;
      overflow-x: visible;
    }

    .tab-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      position: relative;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #fff;
      font-weight: bold;
    }

    .tab-text {
      outline: none;
      border-radius: 4px;
      padding: 2px 4px;
    }

    .arrow-btn {
      font-size: 12px;
      opacity: 0.8;
      user-select: none;
      pointer-events: none;
    }

    .is-admin .tab-text { cursor: text; }
    .is-admin .tab-text:hover { background: rgba(255, 255, 255, 0.15); }

    /* 下拉選單結構 */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #202225;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5);
      border-radius: 6px;
      z-index: 100;
      padding: 6px 0;
      margin-top: 4px;
      border: 1px solid #4f545c;
    }

    .dropdown:hover .dropdown-menu { display: block; }

    .dropdown-item {
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-color);
      cursor: pointer;
      font-size: 14px;
    }

    .dropdown-item:hover, .dropdown-item.active {
      background-color: var(--accent-color);
      color: white;
      font-weight: bold;
    }

    .del-sub-btn {
      background: none;
      border: none;
      color: #8e9297;
      cursor: pointer;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 50%;
      display: none;
    }

    .dropdown-item:hover .del-sub-btn { color: #fff; }
    .is-admin .del-sub-btn { display: inline-block; }

    .add-sub-btn {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-top: 1px solid #4f545c;
      color: #57F287;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      display: none;
    }

    .is-admin .add-sub-btn { display: block; }
    .add-sub-btn:hover { background-color: #2f3136; }

    /* 上傳區 */
    .drop-zone {
      border: 2px dashed #4f545c;
      background: var(--card-bg);
      padding: 25px;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 25px;
      display: none;
    }
    
    .drop-zone.dragover {
      background: #393c43;
      border-color: var(--accent-color);
    }

    /* 圖片畫廊 */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, 120px);
      gap: 12px;
      align-items: start;
    }

    .img-card {
      width: 120px;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .img-wrapper {
      width: 120px;
      height: 120px;
      position: relative;
      background-color: #202225;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .status-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 10;
      background-color: rgba(32, 34, 37, 0.85);
      color: #fff;
      border: 1px solid #4f545c;
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 9px;
      font-weight: bold;
      backdrop-filter: blur(4px);
      max-width: 75px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      outline: none;
    }

    .is-admin .status-badge { cursor: text; }
    .is-admin .status-badge:hover { border-color: var(--accent-color); }

    .status-badge.is-sold {
      background-color: rgba(237, 66, 69, 0.9);
      border-color: var(--danger-color);
      color: #ffffff;
    }

    .delete-btn {
      position: absolute;
      top: 4px;
      left: 4px;
      background-color: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      z-index: 10;
    }

    .delete-btn:hover { background-color: var(--danger-color); }

    /* 圖片下方內容區域 */
    .img-info {
      padding: 6px;
      font-size: 11px;
      color: #b9bbbe;
      background-color: #2f3136;
      text-align: center;
    }

    .editable-text {
      outline: none;
      padding: 2px 4px;
      border-radius: 4px;
      color: #ffffff;
      word-break: break-all;
      display: block;
    }

    /* 🔒 圖片下方專屬備註欄（位在圖片正下方，僅管理員可見） */
    .admin-note-box {
      display: none;
      background-color: #202225;
      border-top: 1px solid #4f545c;
      padding: 6px;
      font-size: 10px;
      text-align: left;
    }

    .is-admin .admin-note-box {
      display: block; /* 管理員登入時顯示在圖片下方 */
    }

    .admin-note-label {
      color: #57F287;
      font-weight: bold;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .admin-note-text {
      outline: none;
      color: #dcddde;
      word-break: break-all;
      display: block;
      padding: 2px;
      border-radius: 3px;
      min-height: 14px;
    }

    .is-admin .editable-text, .is-admin .admin-note-text { 
      background: rgba(0, 0, 0, 0.2); 
      cursor: text; 
    }
    
    .is-admin .editable-text:hover, .is-admin .admin-note-text:hover { 
      border: 1px #4f545c solid; 
    }
    
    .is-admin .img-card:hover .delete-btn { display: flex; }
  </style>
</head>
<body>

  <!-- 頂部列 -->
  <div class="header">
    <div class="title-left">
      <h2>⭐ 米米小舖 ⭐</h2>
      <div class="info-badge">
        <span class="info-icon">📕</span>
        <span class="editable-text" id="siteDescription" contenteditable="false">載入中...</span>
      </div>
    </div>

    <div class="auth-box" id="authBox">
      <button class="auth-btn" id="showLoginBtn">登入</button>
      <div class="auth-inputs" id="authInputs">
        <input type="email" id="emailInput" placeholder="管理員 Email">
        <input type="password" id="passwordInput" placeholder="密碼">
        <button class="auth-btn" id="loginBtn">確認</button>
        <button class="cancel-btn" id="cancelBtn">✕</button>
      </div>
    </div>
  </div>

  <!-- 分頁導覽列 -->
  <div class="tabs-container" id="tabsContainer">
    <button class="tab-btn active" data-category="general">
      <span class="tab-text" id="tab-title-general" contenteditable="false">🏠 家具</span>
    </button>
    
    <button class="tab-btn" data-category="memes">
      <span class="tab-text" id="tab-title-memes" contenteditable="false">🧸 熊熊</span>
    </button>

    <!-- 戒指 (下拉選單) -->
    <div class="dropdown">
      <button class="tab-btn" id="ringParentBtn">
        <span class="tab-text" id="tab-title-ringGroup" contenteditable="false">💍 戒指</span>
        <span class="arrow-btn">▾</span>
      </button>
      <div class="dropdown-menu" id="ringSubMenu">
        <button class="add-sub-btn" data-group="ringGroup">➕ 新增子項目</button>
      </div>
    </div>

    <!-- 作物 (下拉選單) -->
    <div class="dropdown">
      <button class="tab-btn" id="cropParentBtn">
        <span class="tab-text" id="tab-title-cropGroup" contenteditable="false">🌱 作物</span>
        <span class="arrow-btn">▾</span>
      </button>
      <div class="dropdown-menu" id="cropSubMenu">
        <button class="add-sub-btn" data-group="cropGroup">➕ 新增子項目</button>
      </div>
    </div>
  </div>
  
  <!-- 上傳區 -->
  <div class="drop-zone" id="dropZone">
    <p style="font-size: 16px; margin-bottom: 8px;">💡 當前分頁：<b id="currentTabName">🏠 家具</b>（Ctrl + V 貼上圖片 / 拖曳上傳）</p>
    <p id="status" style="color: var(--accent-color); margin: 0; font-weight: bold;"></p>
  </div>

  <div class="gallery" id="gallery"></div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, update, remove, set, onValue, onChildAdded, onChildChanged, onChildRemoved, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCVUSw-B1it_bQ2sF3pAsTI0pXcyF-Tdfg",
      authDomain: "mimishop-93214.firebaseapp.com",
      databaseURL: "https://mimishop-93214-default-rtdb.firebaseio.com",
      projectId: "mimishop-93214",
      storageBucket: "mimishop-93214.firebasestorage.app",
      messagingSenderId: "953118400447",
      appId: "1:953118400447:web:3a0e2fc6c4d2b65425cb0a",
      measurementId: "G-0EDJDFNFWF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentCategory = 'general';
    let currentCategoryDisplayName = '🏠 家具';
    let activeRef = null;
    let isAdmin = false;

    const defaultCategories = {
      tabNames: {
        general: "🏠 家具",
        memes: "🧸 熊熊",
        ringGroup: "💍 戒指",
        cropGroup: "🌱 作物"
      },
      subMenus: {
        ringGroup: {
          design: { name: "💍 戒指(限男)" },
          photos: { name: "💍 戒指(限女)" }
        },
        cropGroup: {
          crops_m: { name: "🌱 作物(限男)" },
          crops_f: { name: "🌱 作物(限女)" }
        }
      }
    };

    function getDefaultTimeStr() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatStatusValue(val) {
      return val || '數量: 1';
    }

    function updateCurrentTabDisplay(name) {
      currentCategoryDisplayName = name || currentCategoryDisplayName;
      document.getElementById('currentTabName').innerText = currentCategoryDisplayName;
    }

    // 1. 說明欄同步
    const descElem = document.getElementById('siteDescription');
    const descRef = ref(db, 'settings/description');

    onValue(descRef, (snapshot) => {
      const data = snapshot.val();
      const defaultText = "訪客僅供檢視，管理員登入後可上傳與編輯。";
      if (document.activeElement !== descElem) {
        descElem.innerText = data !== null ? data : defaultText;
      }
    });

    descElem.addEventListener('blur', () => {
      if (!isAdmin) return;
      set(descRef, descElem.innerText.trim());
    });

    // 2. 選單與子選單即時同步
    const menuRef = ref(db, 'settings/menus');
    onValue(menuRef, (snapshot) => {
      const data = snapshot.val() || {};
      const tabNames = Object.assign({}, defaultCategories.tabNames, data.tabNames || {});
      const subMenus = Object.assign({}, defaultCategories.subMenus, data.subMenus || {});

      Object.keys(tabNames).forEach(cat => {
        const textElem = document.getElementById(`tab-title-${cat}`);
        if (textElem && document.activeElement !== textElem) {
          textElem.innerText = tabNames[cat];
        }
      });

      renderSubMenu('ringGroup', subMenus.ringGroup || {}, 'ringSubMenu');
      renderSubMenu('cropGroup', subMenus.cropGroup || {}, 'cropSubMenu');
    });

    function renderSubMenu(groupKey, subData, containerId) {
      const container = document.getElementById(containerId);
      const addBtn = container.querySelector('.add-sub-btn');
      
      container.querySelectorAll('.dropdown-item').forEach(el => el.remove());

      Object.keys(subData).forEach(subKey => {
        const item = subData[subKey];
        const itemDiv = document.createElement('div');
        itemDiv.className = `dropdown-item ${currentCategory === subKey ? 'active' : ''}`;
        
        itemDiv.innerHTML = `
          <span class="tab-text" id="sub-${subKey}" contenteditable="${isAdmin}">${item.name}</span>
          <button class="del-sub-btn" title="僅隱藏選單，圖片保留">✕</button>
        `;

        itemDiv.addEventListener('click', (e) => {
          if (e.target.classList.contains('del-sub-btn') || document.activeElement === itemDiv.querySelector('.tab-text')) return;
          
          document.querySelectorAll('.tab-btn, .dropdown-item').forEach(b => b.classList.remove('active'));
          itemDiv.classList.add('active');
          
          const parentBtn = container.closest('.dropdown').querySelector('.tab-btn');
          if (parentBtn) parentBtn.classList.add('active');

          updateCurrentTabDisplay(item.name);
          switchCategory(subKey);
        });

        const textSpan = itemDiv.querySelector('.tab-text');
        textSpan.addEventListener('blur', () => {
          if (!isAdmin) return;
          update(ref(db, `settings/menus/subMenus/${groupKey}/${subKey}`), { name: textSpan.innerText.trim() });
        });
        textSpan.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); textSpan.blur(); }
        });

        const delBtn = itemDiv.querySelector('.del-sub-btn');
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm(`確定要移除「${item.name}」選項嗎？\n（舊有的圖片會安全保留在資料庫中）`)) {
            remove(ref(db, `settings/menus/subMenus/${groupKey}/${subKey}`));
          }
        });

        container.insertBefore(itemDiv, addBtn);
      });
    }

    // 新增子選單
    document.querySelectorAll('.add-sub-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!isAdmin) return;
        const groupKey = btn.getAttribute('data-group');
        const name = prompt("請輸入新增的分頁名稱：");
        if (name && name.trim() !== '') {
          const newSubKey = 'sub_' + Date.now();
          
          await update(ref(db, `settings/menus/subMenus/${groupKey}/${newSubKey}`), { name: name.trim() });
          
          document.querySelectorAll('.tab-btn, .dropdown-item').forEach(b => b.classList.remove('active'));
          const parentBtn = btn.closest('.dropdown').querySelector('.tab-btn');
          if (parentBtn) parentBtn.classList.add('active');

          updateCurrentTabDisplay(name.trim());
          switchCategory(newSubKey);
        }
      });
    });

    ['general', 'memes', 'ringGroup', 'cropGroup'].forEach(cat => {
      const textSpan = document.getElementById(`tab-title-${cat}`);
      if (!textSpan) return;

      textSpan.addEventListener('blur', () => {
        if (!isAdmin) return;
        update(ref(db, `settings/menus/tabNames`), { [cat]: textSpan.innerText.trim() });
      });

      textSpan.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); textSpan.blur(); }
      });
    });

    ['general', 'memes'].forEach(cat => {
      const btn = document.querySelector(`[data-category="${cat}"]`);
      if (btn) {
        btn.addEventListener('click', () => {
          const textSpan = btn.querySelector('.tab-text');
          if (document.activeElement === textSpan) return;

          document.querySelectorAll('.tab-btn, .dropdown-item').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          updateCurrentTabDisplay(textSpan.innerText.trim());
          switchCategory(cat);
        });
      }
    });

    // 3. Auth 權限狀態管理
    onAuthStateChanged(auth, (user) => {
      const authBox = document.getElementById('authBox');
      const dropZone = document.getElementById('dropZone');

      isAdmin = !!user;

      document.querySelectorAll('.tab-text').forEach(el => {
        el.contentEditable = isAdmin ? "true" : "false";
      });

      if (user) {
        document.body.classList.add('is-admin');
        dropZone.style.display = 'block';
        if (descElem) descElem.contentEditable = "true";
        
        authBox.innerHTML = `
          <span style="color:#57F287; font-size:14px;">已登入管理員</span>
          <button class="auth-btn" id="logoutBtn" style="background:#4f545c">登出</button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
      } else {
        document.body.classList.remove('is-admin');
        dropZone.style.display = 'none';
        if (descElem) descElem.contentEditable = "false";
        
        authBox.innerHTML = `
          <button class="auth-btn" id="showLoginBtn">登入</button>
          <div class="auth-inputs" id="authInputs">
            <input type="email" id="emailInput" placeholder="管理員 Email">
            <input type="password" id="passwordInput" placeholder="密碼">
            <button class="auth-btn" id="loginBtn">確認</button>
            <button class="cancel-btn" id="cancelBtn">✕</button>
          </div>
        `;
        bindAuthEvents();
      }
      
      switchCategory(currentCategory);
    });

    function bindAuthEvents() {
      const showLoginBtn = document.getElementById('showLoginBtn');
      const authInputs = document.getElementById('authInputs');
      const cancelBtn = document.getElementById('cancelBtn');
      const loginBtn = document.getElementById('loginBtn');

      if (showLoginBtn) {
        showLoginBtn.addEventListener('click', () => {
          showLoginBtn.style.display = 'none';
          authInputs.style.display = 'flex';
        });
      }

      if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
          authInputs.style.display = 'none';
          showLoginBtn.style.display = 'inline-block';
        });
      }

      if (loginBtn) {
        loginBtn.addEventListener('click', handleLogin);
      }
    }

    async function handleLogin() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        alert('登入失敗：' + err.message);
      }
    }

    // 4. 切換與讀取分頁圖片
    function renderStatusElement(key, rawStatusValue) {
      const statusValue = formatStatusValue(rawStatusValue);
      const isSoldClass = statusValue.includes('售出') ? 'is-sold' : '';
      return `
        <span class="status-badge ${isSoldClass}" id="badge-${key}" contenteditable="${isAdmin}">
          ${statusValue}
        </span>
      `;
    }

    function switchCategory(newCategory) {
      if (activeRef) off(activeRef);

      currentCategory = newCategory;
      activeRef = ref(db, `images/${currentCategory}`);
      document.getElementById('gallery').innerHTML = '';

      onChildAdded(activeRef, (snapshot) => {
        const key = snapshot.key;
        const data = snapshot.val();
        const gallery = document.getElementById('gallery');

        const card = document.createElement('div');
        card.className = 'img-card';
        card.id = `card-${key}`;

        const textValue = data.caption || getDefaultTimeStr();
        const statusValue = data.quantity || '數量: 1';
        const noteValue = data.note || '';

        card.innerHTML = `
          <button class="delete-btn" title="刪除圖片">✕</button>
          <div class="img-wrapper">
            ${renderStatusElement(key, statusValue)}
            <img src="${data.url}" loading="lazy" alt="uploaded image" />
          </div>
          <div class="img-info">
            <span class="editable-text" contenteditable="${isAdmin}" id="text-${key}">${textValue}</span>
          </div>
          <!-- 🔒 圖片下方獨立備註區（僅管理員可見） -->
          <div class="admin-note-box">
            <div class="admin-note-label">🔒 備註</div>
            <span class="admin-note-text" contenteditable="${isAdmin}" id="note-${key}">${noteValue}</span>
          </div>
        `;

        gallery.prepend(card);

        // 修改數量狀態
        const badgeElem = card.querySelector(`#badge-${key}`);
        if (badgeElem) {
          badgeElem.addEventListener('blur', () => {
            if (!isAdmin) return;
            update(ref(db, `images/${currentCategory}/${key}`), { quantity: badgeElem.innerText.trim() });
          });
          badgeElem.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); badgeElem.blur(); }
          });
        }

        // 刪除圖片
        const deleteBtn = card.querySelector('.delete-btn');
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (isAdmin && confirm('確定要刪除這張圖片嗎？')) {
            remove(ref(db, `images/${currentCategory}/${key}`));
          }
        });

        // 修改圖片公開文字
        const editableElem = card.querySelector('.editable-text');
        editableElem.addEventListener('blur', () => {
          if (!isAdmin) return;
          update(ref(db, `images/${currentCategory}/${key}`), { caption: editableElem.innerText.trim() });
        });
        editableElem.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); editableElem.blur(); }
        });

        // 🔒 修改圖片私人備註文字
        const noteElem = card.querySelector('.admin-note-text');
        noteElem.addEventListener('blur', () => {
          if (!isAdmin) return;
          update(ref(db, `images/${currentCategory}/${key}`), { note: noteElem.innerText.trim() });
        });
        noteElem.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); noteElem.blur(); }
        });
      });

      onChildChanged(activeRef, (snapshot) => {
        const key = snapshot.key;
        const data = snapshot.val();
        
        // 更新公開說明
        const targetTextElem = document.getElementById(`text-${key}`);
        if (targetTextElem && document.activeElement !== targetTextElem) {
          targetTextElem.innerText = data.caption || '';
        }

        // 🔒 更新私人備註
        const targetNoteElem = document.getElementById(`note-${key}`);
        if (targetNoteElem && document.activeElement !== targetNoteElem) {
          targetNoteElem.innerText = data.note || '';
        }

        // 更新狀態標籤
        const newStatus = formatStatusValue(data.quantity);
        const targetBadgeElem = document.getElementById(`badge-${key}`);
        if (targetBadgeElem && document.activeElement !== targetBadgeElem) {
          targetBadgeElem.innerText = newStatus;
          if (newStatus.includes('售出')) {
            targetBadgeElem.classList.add('is-sold');
          } else {
            targetBadgeElem.classList.remove('is-sold');
          }
        }
      });

      onChildRemoved(activeRef, (snapshot) => {
        const key = snapshot.key;
        const cardElem = document.getElementById(`card-${key}`);
        if (cardElem) cardElem.remove();
      });
    }

    // 圖片上傳
    function handleImageFile(file) {
      if (!isAdmin || !file || !file.type.startsWith('image/')) return;

      const status = document.getElementById('status');
      status.innerText = "正在發送圖片...";

      const reader = new FileReader();
      reader.onload = function(e) {
        push(ref(db, `images/${currentCategory}`), {
          url: e.target.result,
          caption: getDefaultTimeStr(),
          quantity: '數量: 1',
          note: '', // 預設新增空白私人備註
          timestamp: Date.now()
        });
        status.innerText = "發送成功！";
        setTimeout(() => status.innerText = "", 1500);
      };
      reader.readAsDataURL(file);
    }

    document.addEventListener('paste', (e) => {
      if (!isAdmin || document.activeElement.isContentEditable) return;
      const items = e.clipboardData?.items;
      if (!items) return;
      for (let item of items) {
        if (item.type.includes('image')) {
          handleImageFile(item.getAsFile());
          break;
        }
      }
    });

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (isAdmin && e.dataTransfer.files.length > 0) {
        handleImageFile(e.dataTransfer.files[0]);
      }
    });
  </script>
</body>
</html>
