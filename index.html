<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⭐ 米米小舖-Club MStar ⭐</title>
  <style>
    :root {
      --bg-color: #36393f;
      --card-bg: #2f3136;
      --text-color: #dcddde;
      --accent-color: #5865f2;
      --danger-color: #ed4245;
      --success-color: #43b581;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 頂部區域 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      gap: 20px;
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
    }

    .title-left h2 {
      margin: 0;
      white-space: nowrap;
      line-height: 1.4;
    }

    .desc-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      max-width: 400px;
    }

    .info-badge {
      background-color: #202225;
      border: 1px solid #4f545c;
      color: #b9bbbe;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
      width: 100%;
      min-height: 38px;
      box-sizing: border-box;
      outline: none;
    }

    .info-badge[contenteditable="true"]:focus {
      border-color: var(--accent-color);
      background-color: #2f3136;
    }

    /* 管理員登入控制面板 */
    .admin-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="password"] {
      background: #202225;
      border: 1px solid #4f545c;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      outline: none;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-save {
      background-color: var(--success-color);
      padding: 6px 12px;
      font-size: 12px;
    }

    /* 預設隱藏管理員專屬按鈕 */
    .admin-only {
      display: none !important;
    }

    /* 管理員模式下顯示專屬按鈕與元素 */
    .admin-mode .admin-only {
      display: inline-block !important;
    }

    .admin-mode .admin-block-only {
      display: block !important;
    }

    /* 分頁標籤 */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #202225;
      padding-bottom: 10px;
    }

    .tab-btn {
      background: #202225;
      color: #b9bbbe;
      border: 1px solid transparent;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #fff;
    }

    /* 圖片畫廊區域 */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .img-card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    .img-wrapper {
      position: relative;
      width: 100%;
      padding-top: 100%; /* 1:1 比例 */
      background: #202225;
    }

    .img-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .quantity-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      z-index: 2;
      outline: none;
    }

    .delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--danger-color);
      color: white;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 2;
      line-height: 1;
      padding: 0;
    }

    .img-info {
      padding: 10px;
    }

    .editable-text {
      display: block;
      outline: none;
      word-break: break-all;
    }

    .editable-text[contenteditable="true"]:focus,
    .admin-note-text[contenteditable="true"]:focus,
    .quantity-badge[contenteditable="true"]:focus {
      background: #202225;
      box-shadow: 0 0 0 2px var(--accent-color);
      border-radius: 4px;
    }

    /* 管理員備註 */
    .admin-note-box {
      background: #202225;
      margin: 0 10px 10px 10px;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }

    .admin-note-label {
      color: #8e9297;
      font-size: 10px;
      margin-bottom: 2px;
    }

    .admin-note-text {
      color: #faa61a;
      outline: none;
      display: block;
      min-height: 16px;
    }

    .card-footer {
      padding: 0 10px 10px 10px;
      text-align: right;
    }

    /* 狀態提示 */
    #status {
      margin-bottom: 10px;
      color: #faa61a;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-left">
      <h2>⭐ 米米小舖 ⭐</h2>
      <div class="desc-wrapper">
        <div id="siteDescription" class="info-badge" contenteditable="false">載入中...</div>
        <button id="saveDescBtn" class="btn-save admin-only">💾 儲存</button>
      </div>
    </div>
    
    <div class="admin-controls">
      <input type="password" id="adminPass" placeholder="管理員密碼">
      <button id="loginBtn">登入</button>
      <button id="logoutBtn" style="display: none; background-color: var(--danger-color);">登出</button>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" data-cat="cat1">
      <span class="tab-title" id="tab-title-cat1">分類一</span>
    </button>
    <button class="tab-btn" data-cat="cat2">
      <span class="tab-title" id="tab-title-cat2">分類二</span>
    </button>
    <button class="tab-btn" data-cat="cat3">
      <span class="tab-title" id="tab-title-cat3">分類三</span>
    </button>
  </div>

  <div id="status"></div>

  <div class="gallery-grid" id="gallery"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, update, remove, set, onValue, onChildAdded, onChildChanged, onChildRemoved, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCVUSw-B1it_bQ2sF3pAsTI0pXcyF-Tdfg",
      authDomain: "mimishop-93214.firebaseapp.com",
      databaseURL: "https://mimishop-93214-default-rtdb.firebaseio.com",
      projectId: "mimishop-93214",
      storageBucket: "mimishop-93214.firebasestorage.app",
      messagingSenderId: "953118400447",
      appId: "1:953118400447:web:3a0e2fc6c4d2b65425cb0a",
      measurementId: "G-0EDJDFNFWF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentCategory = 'cat1';
    let isAdmin = false;
    let activeRef = null;

    function getDefaultTimeStr() {
      const now = new Date();
      return `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    // --- 1. 說明欄位監聽與儲存 ---
    const descElem = document.getElementById('siteDescription');
    const saveDescBtn = document.getElementById('saveDescBtn');
    const descRef = ref(db, 'settings/description');

    onValue(descRef, (snapshot) => {
      const data = snapshot.val();
      const defaultText = "訪客僅供檢視，管理員登入後可上傳與編輯。";
      if (document.activeElement !== descElem) {
        descElem.innerText = (data !== null && data !== undefined) ? data : defaultText;
      }
    });

    // 點擊說明欄儲存按鈕發送更新
    saveDescBtn.addEventListener('click', () => {
      if (!isAdmin) return;
      set(descRef, descElem.innerText.trim())
        .then(() => alert("說明欄已儲存！"))
        .catch(err => alert("儲存失敗：" + err.message));
    });

    // --- 2. Auth 權限狀態管理 ---
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const adminPass = document.getElementById('adminPass');

    loginBtn.addEventListener('click', () => {
      const pass = adminPass.value;
      if (!pass) return;
      signInWithEmailAndPassword(auth, "admin@mimishop.com", pass)
        .then(() => { adminPass.value = ''; })
        .catch(err => alert("登入失敗: " + err.message));
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      isAdmin = !!user;
      document.body.classList.toggle('admin-mode', isAdmin);
      descElem.contentEditable = isAdmin;
      
      adminPass.style.display = isAdmin ? 'none' : 'inline-block';
      loginBtn.style.display = isAdmin ? 'none' : 'inline-block';
      logoutBtn.style.display = isAdmin ? 'inline-block' : 'none';

      switchCategory(currentCategory);
    });

    // --- 3. 切換與讀取分頁圖片 ---
    function switchCategory(newCategory) {
      if (activeRef) off(activeRef);

      currentCategory = newCategory;
      activeRef = ref(db, `images/${currentCategory}`);
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';

      onChildAdded(activeRef, (snapshot) => {
        const key = snapshot.key;
        const data = snapshot.val();

        const card = document.createElement('div');
        card.className = 'img-card';
        card.id = `card-${key}`;

        const textValue = data.caption || getDefaultTimeStr();
        const statusValue = data.quantity || '數量: 1';
        const noteValue = data.note || '';

        card.innerHTML = `
          <button class="delete-btn admin-only" title="刪除圖片">✕</button>
          <div class="img-wrapper">
            <span class="quantity-badge" contenteditable="${isAdmin}" id="qty-${key}">${statusValue}</span>
            <img src="${data.url}" loading="lazy" alt="uploaded image" />
          </div>
          <div class="img-info">
            <span class="editable-text" contenteditable="${isAdmin}" id="text-${key}">${textValue}</span>
          </div>
          <div class="admin-note-box admin-block-only">
            <div class="admin-note-label">🔒 備註</div>
            <span class="admin-note-text" contenteditable="${isAdmin}" id="note-${key}">${noteValue}</span>
          </div>
          <div class="card-footer admin-only">
            <button class="btn-save save-card-btn">💾 儲存</button>
          </div>
        `;

        gallery.prepend(card);

        // 綁定卡片「儲存」按鈕點擊事件
        const saveCardBtn = card.querySelector('.save-card-btn');
        saveCardBtn.addEventListener('click', () => {
          if (!isAdmin) return;
          const qtyVal = card.querySelector(`#qty-${key}`).innerText.trim();
          const textVal = card.querySelector(`#text-${key}`).innerText.trim();
          const noteVal = card.querySelector(`#note-${key}`).innerText.trim();

          update(ref(db, `images/${currentCategory}/${key}`), {
            quantity: qtyVal,
            caption: textVal,
            note: noteVal
          }).then(() => {
            alert("儲存成功！");
          }).catch(err => {
            alert("儲存失敗：" + err.message);
          });
        });

        // 刪除圖片事件
        const delBtn = card.querySelector('.delete-btn');
        delBtn.addEventListener('click', () => {
          if (!isAdmin) return;
          if (confirm("確定要刪除這張圖片嗎？")) {
            remove(ref(db, `images/${currentCategory}/${key}`));
          }
        });
      });

      // 數據庫更新即時同步至頁面 UI
      onChildChanged(activeRef, (snapshot) => {
        const key = snapshot.key;
        const data = snapshot.val();
        
        const qtyElem = document.getElementById(`qty-${key}`);
        const textElem = document.getElementById(`text-${key}`);
        const noteElem = document.getElementById(`note-${key}`);

        if (qtyElem && document.activeElement !== qtyElem) qtyElem.innerText = data.quantity || '數量: 1';
        if (textElem && document.activeElement !== textElem) textElem.innerText = data.caption || '';
        if (noteElem && document.activeElement !== noteElem) noteElem.innerText = data.note || '';
      });

      // 數據刪除時移除對應卡片
      onChildRemoved(activeRef, (snapshot) => {
        const card = document.getElementById(`card-${snapshot.key}`);
        if (card) card.remove();
      });
    }

    // 分頁標籤切換事件
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        const targetBtn = e.currentTarget;
        targetBtn.classList.add('active');
        switchCategory(targetBtn.dataset.cat);
      });
    });

    // --- 4. 圖片上傳處理 ---
    function handleImageFile(file) {
      if (!isAdmin || !file || !file.type.startsWith('image/')) return;

      const status = document.getElementById('status');
      status.innerText = "正在處理並上傳圖片...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const dataUrl = e.target.result;

        push(ref(db, `images/${currentCategory}`), {
          url: dataUrl,
          caption: getDefaultTimeStr(),
          quantity: '數量: 1',
          note: '',
          timestamp: Date.now()
        }).then(() => {
          status.innerText = "上傳成功！";
          setTimeout(() => status.innerText = "", 1500);
        }).catch(err => {
          status.innerText = "上傳失敗：" + err.message;
        });
      };
      reader.readAsDataURL(file);
    }

    window.addEventListener('paste', (e) => {
      if (!isAdmin) return;
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.type.indexOf('image') !== -1) {
          handleImageFile(item.getAsFile());
          break;
        }
      }
    });

    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      if (!isAdmin) return;
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        handleImageFile(e.dataTransfer.files[0]);
      }
    });
  </script>
</body>
</html>
