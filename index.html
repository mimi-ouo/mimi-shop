<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⭐ 米米小舖-Club MStar ⭐</title>
  <style>
    :root {
      --bg-color: #36393f;
      --card-bg: #2f3136;
      --text-color: #dcddde;
      --accent-color: #5865f2;
      --danger-color: #ed4245;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
      position: relative;
    }

    .title-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
      width: 100%;
    }

    .title-center h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .info-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: #202225;
      border: 1px solid #4f545c;
      color: #b9bbbe;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
      max-width: 100%;
      box-sizing: border-box;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .info-badge .editable-text {
      outline: none;
      color: #dcddde;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .is-admin .info-badge .editable-text {
      background: rgba(0, 0, 0, 0.2);
      cursor: text;
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px dashed #4f545c;
    }

    .auth-box {
      position: absolute;
      right: 0;
      top: 0;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .auth-inputs {
      display: none;
      gap: 8px;
      align-items: center;
    }

    .auth-inputs input {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #4f545c;
      background: #202225;
      color: #fff;
    }

    .auth-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    .cancel-btn {
      background: #4f545c;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .tabs-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 2px solid #4f545c;
      padding-bottom: 10px;
      flex-wrap: wrap;
    }

    .tab-btn, .dropdown-toggle {
      background: var(--card-bg);
      color: var(--text-color);
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #fff;
      font-weight: bold;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #2f3136;
      min-width: 150px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5);
      border-radius: 6px;
      z-index: 100;
      margin-top: 4px;
      padding: 4px 0;
      border: 1px solid #4f545c;
    }

    .dropdown:hover .dropdown-menu {
      display: block;
    }

    .dropdown-item {
      padding: 8px 14px;
      display: flex;
      align-items: center;
      color: var(--text-color);
      cursor: pointer;
      font-size: 13px;
    }

    .dropdown-item:hover {
      background-color: var(--accent-color);
      color: #fff;
    }

    .drop-zone {
      border: 2px dashed #4f545c;
      background: var(--card-bg);
      padding: 25px;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 25px;
      display: none;
    }
    
    .drop-zone.dragover {
      background: #393c43;
      border-color: var(--accent-color);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, 120px);
      gap: 12px;
      align-items: start;
    }

    .img-card {
      width: 120px;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      position: relative;
      content-visibility: auto;
      contain-intrinsic-size: 120px 180px;
    }

    .img-wrapper {
      width: 120px;
      height: 120px;
      position: relative;
      background-color: #202225;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      content-visibility: auto;
    }

    .status-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 10;
      background-color: rgba(32, 34, 37, 0.85);
      color: #fff;
      border: 1px solid #4f545c;
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 9px;
      font-weight: bold;
      max-width: 75px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      outline: none;
    }

    .is-admin .status-badge { cursor: text; }
    .status-badge.is-sold {
      background-color: rgba(237, 66, 69, 0.9);
      border-color: var(--danger-color);
      color: #ffffff;
    }

    .delete-btn {
      position: absolute;
      top: 4px;
      left: 4px;
      background-color: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      z-index: 10;
    }

    .delete-btn:hover { background-color: var(--danger-color); }

    .img-info {
      padding: 6px;
      font-size: 11px;
      color: #b9bbbe;
      background-color: #2f3136;
      text-align: center;
    }

    .editable-text {
      outline: none;
      padding: 2px 4px;
      border-radius: 4px;
      color: #ffffff;
      word-break: break-all;
      display: block;
    }

    .admin-note-box {
      display: none;
      background-color: #202225;
      border-top: 1px solid #4f545c;
      padding: 6px;
      font-size: 10px;
      text-align: left;
    }

    .is-admin .admin-note-box { display: block; }

    .admin-note-label {
      color: #57F287;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .admin-note-text {
      outline: none;
      color: #dcddde;
      word-break: break-all;
      display: block;
      padding: 2px;
      border-radius: 3px;
      min-height: 14px;
    }

    .is-admin .editable-text, .is-admin .admin-note-text { 
      background: rgba(0, 0, 0, 0.2); 
      cursor: text; 
    }
    
    .is-admin .img-card:hover .delete-btn { display: flex; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-center">
      <h2>⭐ 米米小舖 ⭐</h2>
    </div>
    <div class="info-badge">
      <span>📕</span>
      <span class="editable-text" id="siteDescription" contenteditable="false">本人夜班，交易需另約時間，故不接急單 ｜ 交易方式：可糖可T，比值1:1 ｜ Discord：mimi_ouo</span>
    </div>

    <div class="auth-box" id="authBox">
      <button class="auth-btn" id="showLoginBtn">登入</button>
      <div class="auth-inputs" id="authInputs">
        <input type="password" id="passwordInput" placeholder="管理員密碼">
        <button class="auth-btn" id="loginBtn">確認</button>
        <button class="cancel-btn" id="cancelBtn">✕</button>
      </div>
    </div>
  </div>

  <div class="tabs-container" id="tabsContainer">
    <button class="tab-btn active" data-category="general">🏠 家具</button>
    <button class="tab-btn" data-category="memes">🧸 熊熊</button>
    
    <div class="dropdown">
      <button class="dropdown-toggle">💍 戒指 ▾</button>
      <div class="dropdown-menu">
        <div class="dropdown-item tab-btn" data-category="ring_male">👦 限男</div>
        <div class="dropdown-item tab-btn" data-category="ring_female">👧 限女</div>
      </div>
    </div>

    <div class="dropdown">
      <button class="dropdown-toggle">🌱 作物 ▾</button>
      <div class="dropdown-menu">
        <div class="dropdown-item tab-btn" data-category="crop_male">👦 限男</div>
        <div class="dropdown-item tab-btn" data-category="crop_female">👧 限女</div>
      </div>
    </div>
  </div>
  
  <div class="drop-zone" id="dropZone">
    <p style="font-size: 16px; margin-bottom: 8px;">💡 當前分頁：<b id="currentTabName">🏠 家具</b>（Ctrl + V 貼上圖片 / 拖曳上傳）</p>
    <p id="status" style="color: var(--accent-color); margin: 0; font-weight: bold;"></p>
  </div>

  <div class="gallery" id="gallery"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz1ZR6VzbPvHAuiacE2pb9045XmBgTp1EVRWozozLvURQGu8tAUf2umSED_xha78DFNig/exec";

    let currentCategory = 'general';
    let currentCategoryDisplayName = '🏠 家具';
    let isAdmin = localStorage.getItem('isAdmin') === 'true';
    let allData = [];

    const ADMIN_PASSWORD = "1234";

    document.addEventListener('DOMContentLoaded', () => {
      initAuthUI();
      setupTabs();
      fetchData();
    });

    function initAuthUI() {
      const authBox = document.getElementById('authBox');
      const dropZone = document.getElementById('dropZone');
      const descElem = document.getElementById('siteDescription');

      if (isAdmin) {
        document.body.classList.add('is-admin');
        dropZone.style.display = 'block';
        descElem.contentEditable = "true";
        authBox.innerHTML = `
          <span style="color:#57F287; font-size:14px;">已登入管理員</span>
          <button class="auth-btn" id="logoutBtn" style="background:#4f545c">登出</button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => {
          localStorage.removeItem('isAdmin');
          location.reload();
        });
      } else {
        document.body.classList.remove('is-admin');
        dropZone.style.display = 'none';
        descElem.contentEditable = "false";
        authBox.innerHTML = `
          <button class="auth-btn" id="showLoginBtn">登入</button>
          <div class="auth-inputs" id="authInputs">
            <input type="password" id="passwordInput" placeholder="管理員密碼">
            <button class="auth-btn" id="loginBtn">確認</button>
            <button class="cancel-btn" id="cancelBtn">✕</button>
          </div>
        `;
        bindAuthEvents();
      }

      let originalDesc = "";
      descElem.addEventListener('focus', () => {
        if (!isAdmin) return;
        originalDesc = descElem.innerText;
      });

      descElem.addEventListener('blur', async () => {
        if (!isAdmin) return;
        const newText = descElem.innerText;
        if (newText === originalDesc) return;

        const status = document.getElementById('status');
        status.innerText = "正在儲存至雲端...";
        
        const success = await updateDescription(newText);
        if (success) {
          originalDesc = newText;
          status.innerText = "修改成功！";
        } else {
          status.innerText = "儲存失敗，請重試";
        }
        setTimeout(() => { status.innerText = ""; }, 1500);
      });
    }

    function bindAuthEvents() {
      const showLoginBtn = document.getElementById('showLoginBtn');
      const authInputs = document.getElementById('authInputs');
      const cancelBtn = document.getElementById('cancelBtn');
      const loginBtn = document.getElementById('loginBtn');

      showLoginBtn.addEventListener('click', () => {
        showLoginBtn.style.display = 'none';
        authInputs.style.display = 'flex';
      });

      cancelBtn.addEventListener('click', () => {
        authInputs.style.display = 'none';
        showLoginBtn.style.display = 'inline-block';
      });

      loginBtn.addEventListener('click', () => {
        const pass = document.getElementById('passwordInput').value;
        if (pass === ADMIN_PASSWORD) {
          localStorage.setItem('isAdmin', 'true');
          location.reload();
        } else {
          alert('密碼錯誤！');
        }
      });
    }

    function setupTabs() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.getAttribute('data-category');
          currentCategoryDisplayName = btn.innerText.trim();
          document.getElementById('currentTabName').innerText = currentCategoryDisplayName;
          renderGallery();
        });
      });
    }

    async function fetchData() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getData`);
        const result = await response.json();
        if (result.status === 'success') {
          allData = result.data.filter(item => item.id !== 'settings_desc');
          
          const descItem = result.data.find(item => item.id === 'settings_desc');
          const descElem = document.getElementById('siteDescription');
          if (descItem && descItem.caption) {
            descElem.innerText = descItem.caption;
          }

          renderGallery();
        }
      } catch (err) {
        console.error("載入資料失敗", err);
      }
    }

    async function updateDescription(newText) {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=updateItem&id=settings_desc&field=caption&value=${encodeURIComponent(newText)}`);
        const result = await response.json();
        return result.status === 'success';
      } catch (err) {
        console.error(err);
        return false;
      }
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      const filtered = allData.filter(item => item.category === currentCategory);
      filtered.sort((a, b) => b.timestamp - a.timestamp);

      const fragment = document.createDocumentFragment();

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'img-card';
        card.id = `card-${item.id}`;

        const isSoldClass = String(item.quantity).includes('售出') ? 'is-sold' : '';

        card.innerHTML = `
          <button class="delete-btn" title="刪除圖片">✕</button>
          <div class="img-wrapper">
            <span class="status-badge ${isSoldClass}" id="badge-${item.id}" contenteditable="${isAdmin}">${item.quantity || '數量: 1'}</span>
            <img src="${item.url}" loading="lazy" decoding="async" alt="image" />
          </div>
          <div class="img-info">
            <span class="editable-text" contenteditable="${isAdmin}" id="text-${item.id}">${item.caption || ''}</span>
          </div>
          <div class="admin-note-box">
            <div class="admin-note-label">🔒 備註</div>
            <span class="admin-note-text" contenteditable="${isAdmin}" id="note-${item.id}">${item.note || ''}</span>
          </div>
        `;

        if (isAdmin) {
          card.querySelector('.delete-btn').addEventListener('click', () => {
            if (confirm('確定要刪除這張圖片嗎？')) {
              deleteItem(item.id);
            }
          });
        }

        fragment.appendChild(card);
      });

      gallery.innerHTML = '';
      gallery.appendChild(fragment);

      if (isAdmin) {
        filtered.forEach(item => {
          bindEditable(item.id, 'quantity', `badge-${item.id}`);
          bindEditable(item.id, 'caption', `text-${item.id}`);
          bindEditable(item.id, 'note', `note-${item.id}`);
        });
      }
    }

    function bindEditable(id, field, elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      let originalValue = "";

      el.addEventListener('focus', () => {
        if (!isAdmin) return;
        originalValue = el.innerText.trim();
      });

      el.addEventListener('blur', async () => {
        if (!isAdmin) return;
        const newValue = el.innerText.trim();
        if (newValue === originalValue) return;

        const status = document.getElementById('status');
        status.innerText = "正在儲存至雲端...";
        
        const success = await updateItem(id, field, newValue);
        if (success) {
          originalValue = newValue;
          status.innerText = "修改成功！";
        } else {
          status.innerText = "儲存失敗，請重試";
        }
        setTimeout(() => { status.innerText = ""; }, 1500);
      });

      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && field !== 'caption') { e.preventDefault(); el.blur(); }
      });
    }

    async function updateItem(id, field, value) {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=updateItem&id=${id}&field=${field}&value=${encodeURIComponent(value)}`);
        const result = await response.json();
        return result.status === 'success';
      } catch (err) {
        console.error(err);
        return false;
      }
    }

    async function deleteItem(id) {
      await fetch(`${SCRIPT_URL}?action=deleteItem&id=${id}`);
      document.getElementById(`card-${id}`).remove();
    }

    function handleImageFile(file) {
      if (!isAdmin || !file || !file.type.startsWith('image/')) return;
      const status = document.getElementById('status');
      status.innerText = "正在上傳至 Google 雲端...";

      const reader = new FileReader();
      reader.onload = async function(e) {
        const base64Data = e.target.result.split(',')[1];
        const defaultTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const tempId = 'temp_' + new Date().getTime();

        const tempItem = {
          id: tempId,
          category: currentCategory,
          url: e.target.result,
          caption: defaultTime,
          quantity: '數量: 1',
          note: '',
          timestamp: new Date().getTime()
        };
        
        allData.unshift(tempItem);
        renderGallery();

        const formData = new URLSearchParams();
        formData.append('action', 'addItem');
        formData.append('category', currentCategory);
        formData.append('caption', defaultTime);
        formData.append('quantity', '數量: 1');
        formData.append('note', '');
        formData.append('mimeType', file.type);
        formData.append('imageBase64', base64Data);

        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: formData
          });
          const result = await response.json();
          if (result.status === 'success') {
            status.innerText = "上傳成功！";
            fetchData();
            setTimeout(() => status.innerText = "", 1500);
          }
        } catch (err) {
          status.innerText = "上傳失敗";
          console.error(err);
          fetchData();
        }
      };
      reader.readAsDataURL(file);
    }

    document.addEventListener('paste', (e) => {
      if (!isAdmin || document.activeElement.isContentEditable) return;
      const items = e.clipboardData?.items;
      if (!items) return;
      for (let item of items) {
        if (item.type.includes('image')) {
          handleImageFile(item.getAsFile());
          break;
        }
      }
    });

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (isAdmin && e.dataTransfer.files.length > 0) {
        handleImageFile(e.dataTransfer.files[0]);
      }
    });
  </script>
</body>
</html>
