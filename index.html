<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⭐ 米米小舖-Club MStar ⭐</title>

  <!-- 引入 Firebase Compat 版本 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #ffffff;
      --danger-color: #ff4d4d;
      --success-color: #cccccc;
      --warning-color: #ffd700;
      --cart-color: #2b73df;
      --border-color: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      width: 100%;
      box-sizing: border-box;
      margin: 0;
      padding: 15px;
      padding-right: 15px;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    .online-counter-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-color);
      z-index: 900;
      padding-top: 10px;
      padding-bottom: 15px;
      box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.5);
    }

    .counter-box {
      font-size: 14px;
      color: var(--text-color);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    #count {
      font-size: 16px;
      color: #00ff88;
      font-weight: bold;
    }

    .update-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(135deg, #ff3366, #ff9933);
      color: #fff;
      text-align: center;
      padding: 12px;
      font-weight: bold;
      z-index: 99999;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from { transform: translateY(-100%); }
      to { transform: translateY(0); }
    }

    @keyframes spinStar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .rotating-star {
      display: inline-block;
      animation: spinStar 3s linear infinite;
      font-size: 10px;
    }

    .update-banner button {
      background: #fff;
      color: #ff3366;
      border: none;
      padding: 5px 15px;
      margin-left: 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .update-banner button:hover {
      background: #f0f0f0;
    }

    .cart-summary {
      background: var(--card-bg);
      border: 1px solid var(--cart-color);
      color: #ffffff;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .clear-cart-btn {
      background-color: var(--danger-color);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    
    .clear-cart-btn:hover {
      background-color: #cc3d3d;
    }

    #backToTopBtn {
      position: fixed;
      bottom: 75px;
      right: 30px;
      display: none;
      background-color: var(--card-bg);
      color: var(--accent-color);
      border: 1px solid var(--border-color);
      padding: 10px 15px;
      border-radius: 50px;
      cursor: pointer;
      z-index: 9999;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: background 0.3s;
    }
    #backToTopBtn:hover {
      background-color: #333;
    }

    .sticky-header-wrapper {
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      z-index: 900;
      padding-top: 10px;
      padding-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .header-layout {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .left-control-panel {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      flex: 1;
      min-width: 280px;
    }

    .title-area-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .title-discord-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .title-area h2 {
      margin: 0;
      font-size: 26px;
      line-height: 1.4;
      white-space: nowrap;
      color: #ffffff;
      background: linear-gradient(45deg, #ff3366, #ff9933, #33cc33, #3399ff, #9933ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .discord-wrapper {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .discord-container {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .discord-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #5865F2;
      border: 1px solid #4752C4;
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      width: fit-content;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(88, 101, 242, 0.35);
      transition: all 0.2s ease-in-out;
    }

    .discord-badge:hover {
      background-color: #4752C4;
      border-color: #3b429f;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(88, 101, 242, 0.55);
      transform: translateY(-1px);
    }

    .discord-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @keyframes pointLeftRight {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-5px); }
    }

    .pointing-hand {
      display: inline-block;
      animation: pointLeftRight 1s infinite ease-in-out;
    }

    .side-tabs-panel {
      position: fixed;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1100;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      transition: opacity 0.3s ease, padding 0.3s ease;
    }

    @media (min-width: 769px) {
      .side-tabs-panel {
        top: calc(120px + (100vh - 120px - 60px) / 2);
        transform: translateY(-50%);
        left: calc(50% + 615px);
        right: auto;
      }
    }

    @media (max-width: 768px) {
      .side-tabs-panel {
        top: 10px;
        right: 15px;
        left: auto;
        transform: none;
      }
    }

    .side-tabs-panel.collapsed {
      padding: 8px;
      gap: 4px;
    }
    .side-tabs-panel.collapsed .collapse-content {
      display: none;
    }

    .collapse-toggle-btn {
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 100px;
      box-sizing: border-box;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .collapse-toggle-btn:hover {
      background: #2a2a2a;
      border-color: var(--accent-color);
    }

    .collapse-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tab-btn, .dropdown-toggle {
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      width: 100px;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .tab-btn:hover, .dropdown-toggle:hover {
      background: #2a2a2a;
      border-color: var(--accent-color);
    }

    .tab-btn.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: #121212;
      font-weight: bold;
    }

    .tab-btn[data-category="cart"] {
      border-color: var(--cart-color);
      color: #7289da;
      justify-content: space-between;
      position: relative;
    }
    .tab-btn[data-category="cart"].active {
      background: var(--cart-color);
      color: #ffffff;
      font-weight: bold;
    }

    .cart-badge-count {
      background-color: #ff4d4d;
      color: #ffffff;
      font-size: 10px;
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 14px;
      line-height: 1.2;
    }

    .dropdown {
      position: relative;
      display: block;
      width: 100px;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 0;
      right: calc(100% + 8px);
      background-color: var(--card-bg);
      min-width: 110px;
      box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.5);
      border-radius: 6px;
      z-index: 1200;
      padding: 4px 0;
      border: 1px solid var(--border-color);
    }

    .dropdown:hover .dropdown-menu,
    .dropdown.open .dropdown-menu,
    .dropdown-menu:hover {
      display: block;
    }

    .dropdown-item {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      color: var(--text-color);
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      box-sizing: border-box;
      background: none;
      border: none;
      text-align: left;
    }

    .dropdown-item:hover {
      background-color: var(--accent-color);
      color: #121212;
    }

    .auth-section-wrapper {
      border-top: 1px solid var(--border-color);
      padding-top: 8px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100px;
      box-sizing: border-box;
    }

    .auth-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .auth-inputs {
      display: none;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .auth-inputs input {
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      width: 100%;
      font-size: 12px;
      box-sizing: border-box;
    }

    .auth-btn {
      background: var(--accent-color);
      color: #121212;
      border: none;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }

    .cancel-btn {
      background: #333333;
      color: var(--text-color);
      border: none;
      padding: 4px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      width: 100%;
      text-align: center;
    }

    .section-sort-container {
      display: flex;
      justify-content: flex-end;
      margin-top: 15px;
      margin-bottom: 5px;
      width: 100%;
    }

    .search-sort-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
    }

    .search-input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      flex: 1;
      font-size: 13px;
      box-sizing: border-box;
    }

    .sort-select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      font-size: 13px;
      cursor: pointer;
      outline: none;
      box-sizing: border-box;
    }

    .custom-notice-container {
      display: none;
      width: 100%;
      margin: 15px 0 0 0;
      text-align: center;
    }

    .custom-notice-box {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.5;
      text-align: left;
      box-sizing: border-box;
      width: 100%;
    }

    .drop-zone {
      border: 2px dashed var(--border-color);
      background: var(--card-bg);
      padding: 25px;
      text-align: center;
      border-radius: 8px;
      margin-top: 20px;
      margin-bottom: 25px;
      display: none;
    }
    
    .drop-zone.dragover {
      background: #2a2a2a;
      border-color: var(--accent-color);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      align-items: start;
      margin-top: 10px;
      margin-bottom: 50px;
    }

    @media (max-width: 768px) {
      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
        gap: 5px;
      }
      .img-card, .img-wrapper {
        width: 112px !important;
      }
      .img-wrapper {
        height: 112px !important;
      }
    }

    .welcome-message {
      grid-column: 1 / -1;
      text-align: left;
      padding: 35px 30px;
      font-size: 15px;
      line-height: 1.8;
      border: 1px solid rgba(255, 153, 51, 0.3);
      background: linear-gradient(145deg, #181818, #222222);
      border-radius: 16px;
      margin-top: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .welcome-message::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 100%;
      background: linear-gradient(to bottom, #ff3366, #ff9933, #9933ff);
    }

    .welcome-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 20px;
      letter-spacing: 1px;
      animation: colorFlash 1.5s infinite;
      text-align: center;
      text-shadow: 0 2px 10px rgba(255, 100, 100, 0.2);
    }

    @keyframes colorFlash {
      0% { color: #ff3366; }
      25% { color: #ff9933; }
      50% { color: #33cc33; }
      75% { color: #3399ff; }
      100% { color: #9933ff; }
    }

    .welcome-content-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: rgba(0, 0, 0, 0.25);
      padding: 22px 25px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .welcome-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .welcome-label {
      font-weight: 700;
      color: #ffd700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .welcome-desc {
      color: #dcdcdc;
      font-size: 14px;
      padding-left: 24px;
      font-weight: normal;
    }

    .welcome-footer-action {
      margin-top: 25px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .welcome-sweet-tip {
      font-size: 16px;
      font-weight: bold;
      color: #ff99bb;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(255, 153, 187, 0.2);
    }

    .welcome-action-btn {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      background: linear-gradient(135deg, #ff3366, #ff9933);
      padding: 12px 30px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
      letter-spacing: 1.5px;
      display: inline-block;
      transition: transform 0.2s, box-shadow 0.2s;
      user-select: none;
      cursor: pointer;
    }

    .welcome-action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 51, 102, 0.6);
    }

    .img-card {
      width: 140px;
      background-color: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      position: relative;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .img-card.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    .img-wrapper {
      width: 140px;
      height: 140px;
      position: relative;
      background-color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-text {
      position: absolute;
      font-size: 10px;
      color: #888888;
      text-align: center;
      width: 100%;
      padding: 0 2px;
      box-sizing: border-box;
      z-index: 1;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      position: relative;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .img-card.loaded .img-wrapper img {
      opacity: 1;
    }

    .status-badge {
      position: absolute;
      top: 3px;
      right: 3px;
      z-index: 10;
      background-color: rgba(30, 30, 30, 0.9);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 3px;
      padding: 1px 3px;
      font-size: 8px;
      font-weight: bold;
      max-width: 80px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-badge.is-pending {
      background-color: rgba(255, 215, 0, 0.95);
      border-color: var(--warning-color);
      color: #121212;
    }

    .status-badge.is-sold {
      background-color: #ff4d4d !important;
      border-color: #ff4d4d !important;
      color: #ffffff !important;
    }

    .status-select {
      position: absolute;
      top: 3px;
      right: 3px;
      z-index: 10;
      background-color: rgba(30, 30, 30, 0.95);
      color: var(--text-color);
      border: 1px solid var(--accent-color);
      border-radius: 3px;
      padding: 1px 2px;
      font-size: 8px;
      font-weight: bold;
      cursor: pointer;
      outline: none;
    }

    .status-select.is-sold {
      background-color: #ff4d4d !important;
      border-color: #ff4d4d !important;
      color: #ffffff !important;
    }

    .status-select.is-pending {
      background-color: rgba(255, 215, 0, 0.95) !important;
      border-color: var(--warning-color) !important;
      color: #121212 !important;
    }

    .cart-checkbox {
      position: absolute;
      top: 3px;
      left: 3px;
      z-index: 10;
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--cart-color);
    }

    .cart-qty-select {
      position: absolute;
      top: 3px;
      right: 3px;
      z-index: 10;
      background-color: rgba(30, 30, 30, 0.95);
      color: #ffffff;
      border: 1px solid var(--cart-color);
      border-radius: 3px;
      padding: 1px 2px;
      font-size: 8px;
      font-weight: bold;
      cursor: pointer;
      outline: none;
    }

    .delete-btn {
      position: absolute;
      top: 3px;
      left: 22px;
      background-color: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      z-index: 10;
    }

    .delete-btn:hover { background-color: #555555; }

    .img-info {
      padding: 4px;
      font-size: 10px;
      color: var(--text-color);
      background-color: var(--card-bg);
      text-align: center;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .caption-container {
      display: flex;
      flex-direction: column;
      background-color: #171717;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 3px;
      box-sizing: border-box;
      width: 100%;
      gap: 3px;
    }

    .caption-row-top {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 3px;
    }

    .price-col {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px; 
      flex-shrink: 0;
      gap: 1px;
      color: #ffffff;
      font-weight: bold;
      font-size: 10px;
    }

    .price-col .currency-symbol {
      color: #ffffff;
      user-select: none;
    }

    .price-col .editable-price {
      width: 20px;

    const firebaseConfig = {
      apiKey: "AIzaSyDPapDe0cUgAhVfixTC50x9VWGtxteo4wQ",
      authDomain: "mimi-ouo-mimishop.firebaseapp.com",
      databaseURL: "https://mimi-ouo-mimishop-default-rtdb.firebaseio.com",
      projectId: "mimi-ouo-mimishop",
      storageBucket: "mimi-ouo-mimishop.firebasestorage.app",
      messagingSenderId: "909483575893",
      appId: "1:909483575893:web:1526adce01aa2b70f3e2dc"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const userStatusDatabaseRef = db.ref('status');

    db.ref('.info/connected').on('value', function(snapshot) {
      if (snapshot.val() === false) return;
      const myConnectionRef = userStatusDatabaseRef.push();
      myConnectionRef.onDisconnect().remove();
      myConnectionRef.set({
        online: true,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });
    });

    userStatusDatabaseRef.on('value', function(snapshot) {
      const onlineCount = snapshot.numChildren();
      const countElem = document.getElementById('count');
      if (countElem) countElem.innerText = onlineCount;
    });

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVrP__g-bnoVRQQrJkKLlMZDhSbFeUuTMyw6-zVRhtYkkSedoVbJXKUwN0bUyc4vs3rQ/exec";

    let currentCategory = ''; 
    let currentCategoryDisplayName = '尚未選擇分頁';
    let isAdmin = localStorage.getItem('isAdmin') === 'true';
    let allData = [];
    let cartItems = loadCartFromStorage();
    let activeModalItem = null;
    let currentAlbumList = [];
    let currentAlbumIndex = 0;

    let scheduleYear = 2026;
    let scheduleMonth = 7;
    let initialDataHash = '';
    const ADMIN_PASSWORD = "1313765591181";

    function loadCartFromStorage() {
      try {
        const stored = localStorage.getItem('userCartItems');
        if (stored) return new Map(JSON.parse(stored));
      } catch (e) {
        console.error('讀取購物車失敗:', e);
      }
      return new Map();
    }

    function saveCartToStorage() {
      try {
        localStorage.setItem('userCartItems', JSON.stringify(Array.from(cartItems.entries())));
      } catch (e) {
        console.error('儲存購物車失敗:', e);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initAuthUI();
      setupTabs();
      setupCollapseToggle();
      setupModalEvents();
      setupBackToTop();
      setupClearCartBtn();
      setupScheduleEvents();
      
      fetchData(true); 

      if (!isAdmin) {
        setInterval(checkForUpdates, 10000);
      }

      updateCartButtonBadge();
      renderGallery(); 
      
      document.getElementById('searchInput').addEventListener('input', renderGallery);
      document.getElementById('sortSelect').addEventListener('change', renderGallery);
    });

    function computeDataHash(data) {
      return JSON.stringify(data.map(i => i.id).sort());
    }

    async function checkForUpdates() {
      if (isAdmin) return;
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getData`);
        const result = await response.json();
        if (result.status === 'success') {
          const settingsIds = ['settings_desc', 'settings_gift', 'settings_ring', 'settings_crop'];
          const filtered = result.data.filter(item => !settingsIds.includes(String(item.id)) && item.category !== 'album_item');
          const newHash = computeDataHash(filtered);

          if (initialDataHash && newHash !== initialDataHash) {
            document.getElementById('updateBanner').style.display = 'block';
          }
        }
      } catch (err) {
        console.error("檢查更新失敗", err);
      }
    }

    function setupClearCartBtn() {
      document.getElementById('clearCartBtn').addEventListener('click', () => {
        if (confirm('確定要清空購物車嗎？')) {
          cartItems.clear();
          saveCartToStorage();
          updateCartButtonBadge();
          renderGallery();
          calculateTotal();
        }
      });
    }

    function calculateTotal() {
        let total = 0;
        cartItems.forEach((qtyStr, id) => {
            const item = allData.find(i => String(i.id) === String(id));
            if (item && item.category !== 'gift') {
                const price = parseInt(item.price) || 0;

    function setupEditableSave(elem, id, field) {
      let originalText = "";
      elem.addEventListener('focus', () => {
        if (!isAdmin) return;
        originalText = elem.innerText;
      });

      elem.addEventListener('blur', async () => {
        if (!isAdmin) return;
        const newText = elem.innerText;
        if (newText === originalText) return;

        const status = document.getElementById('status');
        status.innerText = "正在儲存至雲端...";
        
        const success = await updateItemById(id, field, newText);
        if (success) {
          originalText = newText;
          status.innerText = "修改成功！";
        } else {
          status.innerText = "儲存失敗，請重試";
        }
        setTimeout(() => { status.innerText = ""; }, 1500);
      });

          const dropdownEl = document.getElementById(dropdownId);
          const isOpen = dropdownEl.classList.contains('open');
          document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
          if (!isOpen) dropdownEl.classList.add('open');
        });
      });

      document.addEventListener('click', () => {
        document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
      });

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          window.scrollTo({ top: 0, behavior: 'smooth' });

          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.dropdown-toggle').forEach(t => t.classList.remove('active'));
          btn.classList.add('active');
          
          const parentDropdown = btn.closest('.dropdown');
          if (parentDropdown) {
            parentDropdown.classList.remove('open');

      document.getElementById('prevMonthBtn').addEventListener('click', () => {

        renderSchedule();
      });

      document.getElementById('nextMonthBtn').addEventListener('click', () => {

        renderSchedule();

    function isWorkDay(date) {
      const baseDate = new Date(2026, 7, 8); 
      const diffTime = date.getTime() - baseDate.getTime();
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
      const mod = ((diffDays % 4) + 4) % 4;
      return mod === 2 || mod === 3;
    }

    function renderSchedule() {
      const titleElem = document.getElementById('scheduleMonthTitle');
      const gridElem = document.getElementById('calendarDaysGrid');
      
      titleElem.innerText = `${scheduleYear}年 ${scheduleMonth + 1}月 班表`;
      gridElem.innerHTML = '';

      const firstDayIndex = new Date(scheduleYear, scheduleMonth, 1).getDay();
      const totalDays = new Date(scheduleYear, scheduleMonth + 1, 0).getDate();
      const prevTotalDays = new Date(scheduleYear, scheduleMonth, 0).getDate();

      for (let i = firstDayIndex - 1; i >= 0; i--) {
        const dayNum = prevTotalDays - i;
        const cell = document.createElement('div');
        cell.className = 'calendar-cell other-month';
        const work = isWorkDay(new Date(scheduleYear, scheduleMonth - 1, dayNum));
        cell.innerHTML = `
          <div class="calendar-date-num">${dayNum}</div>
          <div class="calendar-badge ${work ? 'badge-work' : 'badge-off'}">${work ? '🫠 上班' : '😍 休假'}</div>
        `;
        gridElem.appendChild(cell);
      }

      for (let i = 1; i <= totalDays; i++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-cell';
        const d = new Date(scheduleYear, scheduleMonth, i);
        const work = isWorkDay(d);
        
        const today = new Date();
        const isToday = d.toDateString() === today.toDateString();
        if (isToday) cell.style.borderColor = 'var(--accent-color)';

        cell.innerHTML = `
          <div class="calendar-date-num" ${isToday ? 'style="color:var(--warning-color);"' : ''}>${i}${isToday ? ' <span class="rotating-star">⭐</span> 今天' : ''}</div>
          <div class="calendar-badge ${work ? 'badge-work' : 'badge-off'}">${work ? '🫠 上班' : '😍 休假'}</div>
        `;
        gridElem.appendChild(cell);
      }

      const totalCells = firstDayIndex + totalDays;
      const remainingCells = (totalCells % 7 === 0) ? 0 : 7 - (totalCells % 7);
      for (let i = 1; i <= remainingCells; i++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-cell other-month';
        const work = isWorkDay(new Date(scheduleYear, scheduleMonth + 1, i));
        cell.innerHTML = `
          <div class="calendar-date-num">${i}</div>
          <div class="calendar-badge ${work ? 'badge-work' : 'badge-off'}">${work ? '🫠 上班' : '😍 休假'}</div>
        `;
        gridElem.appendChild(cell);
      }
    }

    async function fetchData(isInitial = false) {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getData`);
        const result = await response.json();
        if (result.status === 'success') {
          const settingsIds = ['settings_desc', 'settings_gift', 'settings_ring', 'settings_crop'];
          allData = result.data.filter(item => !settingsIds.includes(String(item.id)) && item.category !== 'album_item');
          window._rawServerData = result.data;

          if (isInitial) initialDataHash = computeDataHash(allData);

          allData.forEach(item => {
            if (item.category === 'general') item.category = 'general_misc';
          });

          const loadSetting = (id, elemId) => {
            const item = result.data.find(i => String(i.id) === id);
            const elem = document.getElementById(elemId);
            if (item && item.caption && elem) elem.innerText = item.caption;
          };

          loadSetting('settings_gift', 'giftDescription');
          loadSetting('settings_ring', 'ringDescription');
          loadSetting('settings_crop', 'cropDescription');

          if (currentCategory && currentCategory !== 'schedule') renderGallery();
          calculateTotal();

          if (activeModalItem) {
            const updated = window._rawServerData.find(i => String(i.id) === String(activeModalItem.id));
            if (updated) openAlbumModal(updated, currentAlbumIndex);
            else closeAlbumModal();
          }
        }
      } catch (err) {
        console.error("載入資料失敗", err);
      }
    }

    async function updateItemById(id, field, value) {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=updateItem&id=${id}&field=${field}&value=${encodeURIComponent(value)}`);
        const result = await response.json();
        return result.status === 'success';
      } catch (err) {
        console.error(err);
        return false;
      }
    }

    function compareItems(a, b) {
      const sortVal = document.getElementById('sortSelect').value;
      const priceA = parseFloat(a.price) || 0;
      const priceB = parseFloat(b.price) || 0;
      const timeA = a.timestamp || (isNaN(a.id) ? 0 : Number(a.id));
      const timeB = b.timestamp || (isNaN(b.id) ? 0 : Number(b.id));

      let primaryDiff = 0;
      if (sortVal === 'price_asc') primaryDiff = priceA - priceB;
      else if (sortVal === 'price_desc') primaryDiff = priceB - priceA;
      else if (sortVal === 'time_asc') primaryDiff = timeA - timeB;
      else primaryDiff = timeB - timeA;

      if (primaryDiff === 0) {
        return String(a.caption || '').localeCompare(String(b.caption || ''), 'zh-TW');
      }
      return primaryDiff;
    }

    function generateVisitorQtyOptions(adminQtyStr, selectedQty) {
      let optionsHTML = '';
      const text = String(adminQtyStr).trim();

      if (text === '大量') {
        const options = ['數量: 1', '數量: 2', '數量: 3', '數量: 4', '數量: 5', '數量: 6', '數量: 7', '數量: 8', '數量: 9', '數量: 10', '大量'];
        options.forEach(opt => {
          optionsHTML += `<option value="${opt}" ${selectedQty === opt ? 'selected' : ''}>${opt}</option>`;
        });
      } else {
        const match = text.match(/\d+/);
        const maxNum = match ? parseInt(match[0], 10) : 1;
        for (let i = 1; i <= maxNum; i++) {
          const val = `數量: ${i}`;
          optionsHTML += `<option value="${val}" ${selectedQty === val ? 'selected' : ''}>${val}</option>`;
        }
      }
      return optionsHTML;
    }

          const moveSel = card.querySelector(`#move-${item.id}`);
          if (moveSel) {
            moveSel.addEventListener('change', async () => {
              const targetCat = moveSel.value;
              if (!targetCat) return;
              const status = document.getElementById('status');
              status.innerText = "正在移動商品分類...";
              if (await updateItem(item.id, 'category', targetCat)) {
                item.category = targetCat;
                status.innerText = "移動成功！";
                renderGallery();
              } else {
                status.innerText = "移動失敗，請重試";
              }
              setTimeout(() => { status.innerText = ""; }, 1500);
            });
          }
        }

        const chkEl = card.querySelector(`#cart-chk-${item.id}`);
        if (chkEl) {
          chkEl.addEventListener('change', () => {
            const status = document.getElementById('status');
            if (chkEl.checked) {
              cartItems.set(String(item.id), '數量: 1');
              status.innerText = "🛒 已加入購物車！";
            } else {
              cartItems.delete(String(item.id));
              status.innerText = "❌ 已從購物車移除";
            }
            saveCartToStorage();
            setTimeout(() => { status.innerText = ""; }, 1500);
            updateCartButtonBadge();
            renderGallery();
            calculateTotal();
          });
        }

        const qtySelEl = card.querySelector(`#cart-qty-${item.id}`);
        if (qtySelEl) {
          qtySelEl.addEventListener('change', () => {
            cartItems.set(String(item.id), qtySelEl.value);
            saveCartToStorage();
            updateCartButtonBadge();
            calculateTotal();
          });
        }

        gallery.appendChild(card);

        if (isAdmin) {
          const selectEl = document.getElementById(`badge-${item.id}`);
          if (selectEl) {
            selectEl.addEventListener('change', async () => {
              const newValue = selectEl.value;
              const status = document.getElementById('status');
              status.innerText = "正在儲存至雲端...";
              if (await updateItem(item.id, 'quantity', newValue)) {
                item.quantity = newValue;
                selectEl.className = 'status-select';
                if (newValue.includes('暫售')) selectEl.classList.add('is-pending');
                else if (newValue.includes('已售出')) selectEl.classList.add('is-sold');
                status.innerText = "修改成功！";
                renderGallery(); 
              } else {
                status.innerText = "儲存失敗，請重試";
              }
              setTimeout(() => { status.innerText = ""; }, 1500);
            });
          }

          const interactSelectEl = document.getElementById(`interact-${item.id}`);
          if (interactSelectEl) {
            interactSelectEl.addEventListener('change', async () => {
              const newValue = interactSelectEl.value;
              const status = document.getElementById('status');
              status.innerText = "正在儲存至雲端...";
              if (await updateItem(item.id, 'interact', newValue)) {
                item.interact = newValue;
                interactSelectEl.className = `interact-select ${newValue === '有互動' ? 'has-interact' : 'no-interact'}`;
                status.innerText = "修改成功！";
              } else {
                status.innerText = "儲存失敗，請重試";
              }
              setTimeout(() => { status.innerText = ""; }, 1500);
            });
          }

          bindEditable(item.id, 'caption', `text-${item.id}`);
          bindEditable(item.id, 'price', `price-${item.id}`);
          bindEditable(item.id, 'note', `note-${item.id}`);
        }
      });
    }

    function bindEditable(id, field, elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      let originalValue = "";

      el.addEventListener('focus', () => {
        if (!isAdmin) return;
        originalValue = el.innerText.trim();
      });

      el.addEventListener('blur', async () => {
        if (!isAdmin) return;
        let newValue = el.innerText.trim();
        if (field === 'price') {
          newValue = newValue.replace(/\D/g, '').slice(0, 3);
          el.innerText = newValue;
        }
        if (newValue === originalValue) return;

        const targetItem = allData.find(item => String(item.id) === String(id));
        if (targetItem) targetItem[field] = newValue;

        const status = document.getElementById('status');
        status.innerText = "正在儲存至雲端...";
        
        if (await updateItem(id, field, newValue)) {
          originalValue = newValue;
          status.innerText = "修改成功！";
          if (['caption', 'price'].includes(field)) {
            renderGallery();
            calculateTotal();
          }
        } else {
          status.innerText = "儲存失敗，請重試";
        }
        setTimeout(() => { status.innerText = ""; }, 1500);
      });

      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      });
    }

    async function updateItem(id, field, value) {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=updateItem&id=${id}&field=${field}&value=${encodeURIComponent(value)}`);
        const result = await response.json();
        return result.status === 'success';
      } catch (err) {
        console.error(err);
        return false;
      }
    }

    async function deleteItem(id) {
      await fetch(`${SCRIPT_URL}?action=deleteItem&id=${id}`);
      allData = allData.filter(item => String(item.id) !== String(id));
      cartItems.delete(String(id));
      saveCartToStorage();
      updateCartButtonBadge();
      renderGallery();
      calculateTotal();
    }

    function setupModalEvents() {
      const modal = document.getElementById('albumModal');
      const closeBtn = document.getElementById('modalCloseBtn');
      const prevBtn = document.getElementById('modalPrevBtn');
      const nextBtn = document.getElementById('modalNextBtn');
      const deletePhotoBtn = document.getElementById('deleteCurrentPhotoBtn');

      closeBtn.addEventListener('click', closeAlbumModal);
      modal.addEventListener('click', (e) => { if (e.target === modal) closeAlbumModal(); });

      prevBtn.addEventListener('click', () => {
        if (currentAlbumList.length <= 1) return;
        currentAlbumIndex = (currentAlbumIndex - 1 + currentAlbumList.length) % currentAlbumList.length;
        updateModalView();
      });

      nextBtn.addEventListener('click', () => {
        if (currentAlbumList.length <= 1) return;
        currentAlbumIndex = (currentAlbumIndex + 1) % currentAlbumList.length;
        updateModalView();
      });

      deletePhotoBtn.addEventListener('click', async () => {
        const currentPhoto = currentAlbumList[currentAlbumIndex];
        if (currentPhoto && confirm('確定要刪除這張相片嗎？')) {
          await deleteItem(currentPhoto.id);
          await fetchData();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (modal.style.display !== 'flex') return;
        if (e.key === 'ArrowLeft') prevBtn.click();
        else if (e.key === 'ArrowRight') nextBtn.click();
        else if (e.key === 'Escape') closeAlbumModal();
      });

      const modalDropZone = document.getElementById('modalDropZone');
      document.addEventListener('paste', (e) => {
        if (!isAdmin || !activeModalItem || modal.style.display !== 'flex' || document.activeElement.isContentEditable) return;
        const items = e.clipboardData?.items;
        if (!items) return;
        for (let item of items) {
          if (item.type.includes('image')) {
            handleModalImageFile(item.getAsFile());
            break;
          }
        }
      });

      modalDropZone.addEventListener('dragover', (e) => { e.preventDefault(); modalDropZone.classList.add('dragover'); });
      modalDropZone.addEventListener('dragleave', () => modalDropZone.classList.remove('dragover'));
      modalDropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        modalDropZone.classList.remove('dragover');
        if (isAdmin && activeModalItem && e.dataTransfer.files.length > 0) {
          handleModalImageFile(e.dataTransfer.files[0]);
        }
      });
    }

    function openAlbumModal(item, index = 0) {
      activeModalItem = item;
      const modal = document.getElementById('albumModal');
      document.getElementById('modalDropZone').style.display = isAdmin ? 'block' : 'none';
      modal.style.display = 'flex';

      const rawData = window._rawServerData || [];
      currentAlbumList = rawData.filter(i => i.category === 'album_item' && String(i.note) === String(activeModalItem.id));
      currentAlbumIndex = currentAlbumList.length > 0 ? Math.min(index, currentAlbumList.length - 1) : 0;

      updateModalView();
    }

    function closeAlbumModal() {
      document.getElementById('albumModal').style.display = 'none';
      activeModalItem = null;
      currentAlbumList = [];
      currentAlbumIndex = 0;
    }

    function updateModalView() {
      const mainImg = document.getElementById('modalMainImg');
      const dotsContainer = document.getElementById('modalDotsContainer');
      const prevBtn = document.getElementById('modalPrevBtn');
      const nextBtn = document.getElementById('modalNextBtn');
      const deletePhotoBtn = document.getElementById('deleteCurrentPhotoBtn');

      if (currentAlbumList.length === 0) {
        mainImg.src = '';
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
        dotsContainer.innerHTML = '';
        deletePhotoBtn.style.display = 'none';
        return;
      }

      mainImg.src = currentAlbumList[currentAlbumIndex].url;
      prevBtn.style.display = currentAlbumList.length > 1 ? 'block' : 'none';
      nextBtn.style.display = currentAlbumList.length > 1 ? 'block' : 'none';

      dotsContainer.innerHTML = '';
      currentAlbumList.forEach((imgObj, idx) => {
        const dot = document.createElement('div');
        dot.className = `modal-dot ${idx === currentAlbumIndex ? 'active' : ''}`;
        dot.addEventListener('click', () => { currentAlbumIndex = idx; updateModalView(); });
        dotsContainer.appendChild(dot);
      });

      deletePhotoBtn.style.display = isAdmin ? 'block' : 'none';
    }

    async function handleModalImageFile(file) {
      if (!isAdmin || !activeModalItem || !file || !file.type.startsWith('image/')) return;
      const status = document.getElementById('modalStatus');
      status.innerText = "正在縮小並上傳相片至相簿...";

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          // ⚡ 優化：將相簿大圖限制為 800px 並將畫質設定為 0.75，大幅縮減檔案體積
          const compressedDataUrl = await compressImage(e.target.result, 800, 0.75);
          const base64Data = compressedDataUrl.split(',')[1];

          const formData = new URLSearchParams();
          formData.append('action', 'addItem');
          formData.append('category', 'album_item');
          formData.append('caption', activeModalItem.caption + ' (相片)');
          formData.append('price', '0');
          formData.append('quantity', '數量: 1');
          formData.append('interact', '無互動');
          formData.append('note', activeModalItem.id);
          formData.append('mimeType', 'image/jpeg');
          formData.append('imageBase64', base64Data);

          const response = await fetch(SCRIPT_URL, { method: 'POST', body: formData });
          const result = await response.json();
          if (result.status === 'success') {
            status.innerText = "相簿上傳成功！";
            await fetchData();
            if (window._rawServerData) {
              currentAlbumList = window._rawServerData.filter(i => i.category === 'album_item' && String(i.note) === String(activeModalItem.id));
              currentAlbumIndex = currentAlbumList.length - 1;
              updateModalView();
            }
            setTimeout(() => status.innerText = "", 1500);
          }
        } catch (err) {
          status.innerText = "上傳失敗";
          console.error(err);
          await fetchData();
        }
      };
      reader.readAsDataURL(file);
    }

    function compressImage(srcUrl, maxSize = 400, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
          let width = img.width, height = img.height;
          if (width > height) {
            if (width > maxSize) { height *= maxSize / width; width = maxSize; }
          } else {
            if (height > maxSize) { width *= maxSize / height; height = maxSize; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = (e) => reject(e);
        img.src = srcUrl;
      });
    }

    function handleImageFile(file) {
      if (!isAdmin || !file || !file.type.startsWith('image/')) return;
      const status = document.getElementById('status');
      status.innerText = "正在縮小並上傳圖片...";

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          // ⚡ 優化：商品小圖解析度維持 400px，畫質微調至 0.75，兼顧清晰度與加載速度
          const compressedDataUrl = await compressImage(e.target.result, 400, 0.75);
          const base64Data = compressedDataUrl.split(',')[1];
          const defaultTime = String(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
          
          allData.unshift({
            id: 'temp_' + new Date().getTime(),
            category: currentCategory,
            url: compressedDataUrl,
            caption: defaultTime,
            price: '',
            quantity: '數量: 1',
            interact: '無互動',
            note: '',
            timestamp: new Date().getTime()
          });
          renderGallery();

          const formData = new URLSearchParams();
          formData.append('action', 'addItem');
          formData.append('category', currentCategory);
          formData.append('caption', defaultTime);
          formData.append('price', '');
          formData.append('quantity', '數量: 1');
          formData.append('interact', '無互動');
          formData.append('note', '');
          formData.append('mimeType', 'image/jpeg');
          formData.append('imageBase64', base64Data);

          const response = await fetch(SCRIPT_URL, { method: 'POST', body: formData });
          const result = await response.json();
          if (result.status === 'success') {
            status.innerText = "上傳成功！";
            fetchData();
            setTimeout(() => status.innerText = "", 1500);
          }
        } catch (err) {
          status.innerText = "上傳失敗";
          console.error(err);
          fetchData();
        }
      };
      reader.readAsDataURL(file);
    }

    document.addEventListener('paste', (e) => {
      const modal = document.getElementById('albumModal');
      if (!isAdmin || document.activeElement.isContentEditable || (modal && modal.style.display === 'flex') || currentCategory === 'schedule' || !currentCategory) return;
      const items = e.clipboardData?.items;
      if (!items) return;
      for (let item of items) {
        if (item.type.includes('image')) {
          handleImageFile(item.getAsFile());
          break;
        }
      }
    });

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const modal = document.getElementById('albumModal');
      if ((modal && modal.style.display === 'flex') || currentCategory === 'schedule' || !currentCategory) return;
      if (isAdmin && e.dataTransfer.files.length > 0) handleImageFile(e.dataTransfer.files[0]);
    });
  </script>
