<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⭐ 米米小舖-Club MStar ⭐</title>
  <style>
    :root {
      --bg-color: #36393f;
      --card-bg: #2f3136;
      --text-color: #dcddde;
      --accent-color: #5865f2;
      --danger-color: #ed4245;
      --success-color: #57F287;
      --warning-color: #fee75c;
      /* 新增粉色系變數 */
      --pink-color: #ffb7c5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      padding-right: 140px; 
    }

    @media (max-width: 900px) {
      body {
        padding-right: 20px;
      }
    }

    .sticky-header-wrapper {
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      z-index: 1000;
      padding-top: 10px;
      padding-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .header-layout {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .header-left-group {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      flex-wrap: wrap;
      flex: 1;
    }

    .left-control-panel {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 140px;
    }

    .title-area h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .discord-info {
      font-size: 13px;
      color: #b9bbbe;
      white-space: nowrap;
    }

    .right-control-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .center-notice-panel {
      flex: 1;
      min-width: 250px;
      max-width: 500px;
    }

    .info-badge {
      display: inline-flex;
      align-items: flex-start;
      gap: 6px;
      background-color: #202225;
      border: 1px solid #4f545c;
      color: #b9bbbe;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      box-sizing: border-box;
      text-align: left;
      width: auto;
      max-width: 100%;
    }

    .info-badge .editable-text {
      outline: none;
      color: #dcddde;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .header-search-row {
      width: 100%;
      box-sizing: border-box;
    }

    .search-input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #4f545c;
      background: #202225;
      color: #fff;
      width: 100%;
      font-size: 14px;
      box-sizing: border-box;
    }

    .side-tabs-panel {
      position: fixed;
      right: 20px;
      top: 160px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1100;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      border: 1px solid #4f545c;
    }

    .tab-btn, .dropdown-toggle {
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid #4f545c;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      width: 100px;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .tab-btn:hover, .dropdown-toggle:hover {
      background: #4f545c;
    }

    .tab-btn.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
      font-weight: bold;
    }

    .dropdown {
      position: relative;
      display: block;
      width: 100px;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 0;
      right: calc(100% + 8px);
      background-color: #2f3136;
      min-width: 110px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5);
      border-radius: 6px;
      z-index: 1200;
      padding: 4px 0;
      border: 1px solid #4f545c;
    }

    .dropdown:hover .dropdown-menu,
    .dropdown-menu:hover {
      display: block;
    }

    .dropdown-item {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      color: var(--text-color);
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      box-sizing: border-box;
      background: none;
      border: none;
      text-align: left;
    }

    .dropdown-item:hover {
      background-color: var(--accent-color);
      color: #fff;
    }

    .auth-box {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
    }

    .auth-inputs {
      display: none;
      gap: 6px;
      align-items: center;
    }

    .auth-inputs input {
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #4f545c;
      background: #202225;
      color: #fff;
      width: 90px;
      font-size: 12px;
    }

    .auth-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .cancel-btn {
      background: #4f545c;
      color: white;
      border: none;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    /* 通用說明區塊 (贈品與戒指) */
    .special-notice-container {
      display: none;
      width: 100%;
      max-width: 800px;
      margin: 15px auto 0 auto;
      text-align: center;
    }

    .special-notice-box {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      background-color: #202225;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      text-align: left;
      box-sizing: border-box;
    }

    /* 贈品區樣式 (綠色) */
    .notice-gift { border: 1px solid #57F287; color: #b9bbbe; }
    /* 戒指區樣式 (粉色) */
    .notice-ring { border: 1px solid var(--pink-color); color: var(--pink-color); }

    .special-notice-box .editable-text {
      outline: none;
      white-space: pre-wrap;
      word-break: break-all;
      flex: 1;
    }

    .is-admin .special-notice-box .editable-text {
      background: rgba(0, 0, 0, 0.2);
      cursor: text;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .is-admin .notice-gift .editable-text { border: 1px dashed #57F287; }
    .is-admin .notice-ring .editable-text { border: 1px dashed var(--pink-color); }

    .drop-zone {
      border: 2px dashed #4f545c;
      background: var(--card-bg);
      padding: 25px;
      text-align: center;
      border-radius: 8px;
      margin-top: 20px;
      margin-bottom: 25px;
      display: none;
    }
    
    .drop-zone.dragover {
      background: #393c43;
      border-color: var(--accent-color);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, 120px);
      gap: 12px;
      align-items: start;
      margin-top: 20px;
    }

    .img-card {
      width: 120px;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      position: relative;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .img-card.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    .img-wrapper {
      width: 120px;
      height: 120px;
      position: relative;
      background-color: #202225;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .status-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 10;
      background-color: rgba(32, 34, 37, 0.85);
      color: #fff;
      border: 1px solid #4f545c;
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 9px;
      font-weight: bold;
      max-width: 85px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-badge.is-pending {
      background-color: rgba(254, 231, 92, 0.95);
      border-color: var(--warning-color);
      color: #000000;
    }

    .status-badge.is-sold {
      background-color: rgba(237, 66, 69, 0.9);
      border-color: var(--danger-color);
      color: #ffffff;
    }

    .status-select {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 10;
      background-color: rgba(32, 34, 37, 0.95);
      color: #fff;
      border: 1px solid var(--accent-color);
      border-radius: 4px;
      padding: 1px 2px;
      font-size: 9px;
      font-weight: bold;
      cursor: pointer;
      outline: none;
    }

    .status-select.is-pending {
      background-color: rgba(254, 231, 92, 0.95);
      border-color: var(--warning-color);
      color: #000000;
    }

    .status-select.is-sold {
      background-color: rgba(237, 66, 69, 0.9);
      border-color: var(--danger-color);
      color: #ffffff;
    }

    .delete-btn {
      position: absolute;
      top: 4px;
      left: 4px;
      background-color: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      z-index: 10;
    }

    .delete-btn:hover { background-color: var(--danger-color); }

    .img-info {
      padding: 6px;
      font-size: 11px;
      color: #b9bbbe;
      background-color: #2f3136;
      text-align: center;
    }

    .editable-text {
      outline: none;
      padding: 2px 4px;
      border-radius: 4px;
      color: #ffffff;
      word-break: break-all;
      display: block;
    }

    .admin-note-box {
      display: none;
      background-color: #202225;
      border-top: 1px solid #4f545c;
      padding: 6px;
      font-size: 10px;
      text-align: left;
    }

    .is-admin .admin-note-box { display: block; }

    .admin-note-label {
      color: #57F287;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .admin-note-text {
      outline: none;
      color: #dcddde;
      word-break: break-all;
      display: block;
      padding: 2px;
      border-radius: 3px;
      min-height: 14px;
    }

    .is-admin .editable-text, .is-admin .admin-note-text { 
      background: rgba(0, 0, 0, 0.2); 
      cursor: text; 
    }
    
    .is-admin .img-card:hover .delete-btn { display: flex; }
  </style>
</head>
<body>

  <!-- 右側直立懸浮分頁 -->
  <div class="side-tabs-panel">
    <button class="tab-btn active" data-category="general">🏠 家具</button>
    <button class="tab-btn" data-category="memes">🧸 熊熊</button>
    <button class="tab-btn" data-category="pot">🪴 花盆</button>
    
    <div class="dropdown">
      <button class="dropdown-toggle">💍 戒指 ▾</button>
      <div class="dropdown-menu">
        <button class="dropdown-item tab-btn" data-category="ring_male">👦 限男</button>
        <button class="dropdown-item tab-btn" data-category="ring_female">👧 限女</button>
      </div>
    </div>

    <div class="dropdown">
      <button class="dropdown-toggle">🌱 作物 ▾</button>
      <div class="dropdown-menu">
        <button class="dropdown-item tab-btn" data-category="crop_male">👦 限男</button>
        <button class="dropdown-item tab-btn" data-category="crop_female">👧 限女</button>
      </div>
    </div>

    <button class="tab-btn" data-category="gift">🎁 贈品區</button>
  </div>

  <!-- 上方黏貼頂端區塊 -->
  <div class="sticky-header-wrapper">
    <div class="header-layout">
      
      <div class="header-top-row">
        <div class="header-left-group">
          <div class="left-control-panel">
            <div class="title-area">
              <h2>⭐ 米米小舖 ⭐</h2>
            </div>
            <div class="discord-info">
              Discord：mimi_ouo
            </div>
          </div>

          <div class="center-notice-panel">
            <div class="info-badge">
              <span>📕</span>
              <span class="editable-text" id="siteDescription" contenteditable="false">本人夜班，交易需另約時間，故不接急單
交易方式：可糖可T，比值1:1</span>
            </div>
          </div>
        </div>

        <div class="right-control-panel">
          <div class="auth-box" id="authBox">
            <button class="auth-btn" id="showLoginBtn">登入</button>
            <div class="auth-inputs" id="authInputs">
              <input type="password" id="passwordInput" placeholder="管理員密碼">
              <button class="auth-btn" id="loginBtn">確認</button>
              <button class="cancel-btn" id="cancelBtn">✕</button>
            </div>
          </div>
        </div>
      </div>

      <div class="header-search-row">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋名稱或備註...">
      </div>

    </div>
  </div>
  
  <!-- 贈品區說明 -->
  <div class="special-notice-container" id="giftNoticeContainer">
    <div class="special-notice-box notice-gift">
      <span>🎁</span>
      <span class="editable-text" id="giftDescription" contenteditable="false">本區一律2糖，如有購買任一商品或本區滿五件，可選本區一件免費贈送</span>
    </div>
  </div>

  <!-- 戒指區說明 (粉色系) -->
  <div class="special-notice-container" id="ringNoticeContainer">
    <div class="special-notice-box notice-ring">
      <span>💍</span>
      <span class="editable-text" id="ringDescription" contenteditable="false">情侶等級由買方負擔</span>
    </div>
  </div>

  <div class="drop-zone" id="dropZone">
    <p style="font-size: 16px; margin-bottom: 8px;">💡 當前分頁：<b id="currentTabName">🏠 家具</b>（Ctrl + V 貼上圖片 / 拖曳上傳）</p>
    <p id="status" style="color: var(--accent-color); margin: 0; font-weight: bold;"></p>
  </div>

  <div class="gallery" id="gallery"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVrP__g-bnoVRQQrJkKLlMZDhSbFeUuTMyw6-zVRhtYkkSedoVbJXKUwN0bUyc4vs3rQ/exec";

    let currentCategory = 'general';
    let currentCategoryDisplayName = '🏠 家具';
    let isAdmin = localStorage.getItem('isAdmin') === 'true';
    let allData = [];

    const ADMIN_PASSWORD = "1j6ul42l4ji3++";

    document.addEventListener('DOMContentLoaded', () => {
      initAuthUI();
      setupTabs();
      fetchData();
      
      document.getElementById('searchInput').addEventListener('input', renderGallery);
    });

    function initAuthUI() {
      const authBox = document.getElementById('authBox');
      const dropZone = document.getElementById('dropZone');
      const descElem = document.getElementById('siteDescription');
      const giftDescElem = document.getElementById('giftDescription');
      const ringDescElem = document.getElementById('ringDescription');

      if (isAdmin) {
        document.body.classList.add('is-admin');
        dropZone.style.display = 'block';
        descElem.contentEditable = "true";
        giftDescElem.contentEditable = "true";
        ringDescElem.contentEditable = "true";
        authBox.innerHTML = `
          <span style="color:#57F287; font-size:13px;">已登入管理員</span>
          <button class="auth-btn" id="logoutBtn" style="background:#4f545c">登出</button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => {
          localStorage.removeItem('isAdmin');
          location.reload();
        });
      } else {
        document.body.classList.remove('is-admin');
        dropZone.style.display = 'none';
        descElem.contentEditable = "false";
        giftDescElem.contentEditable = "false";
        ringDescElem.contentEditable = "false";
        authBox.innerHTML = `
          <button class="auth-btn" id="showLoginBtn">登入</button>
          <div class="auth-inputs" id="authInputs">
            <input type="password" id="passwordInput" placeholder="管理員密碼">
            <button class="auth-btn" id="loginBtn">確認</button>
            <button class="cancel-btn" id="cancelBtn">✕</button>
          </div>
        `;
        bindAuthEvents();
      }

      // 共用儲存邏輯 (簡化)
      const setupBlurSave = (elem, id, field) => {
        let originalValue = "";
        elem.addEventListener('focus', () => { if(isAdmin) originalValue = elem.innerText; });
        elem.addEventListener('blur', async () => {
          if (!isAdmin || elem.innerText === originalValue) return;
          const status = document.getElementById('status');
          status.innerText = "正在儲存...";
          const success = await updateItemById(id, field, elem.innerText);
          if (success) { originalValue = elem.innerText; status.innerText = "修改成功！"; }
          else { status.innerText = "儲存失敗"; }
          setTimeout(() => status.innerText = "", 1500);
        });
      };

      setupBlurSave(descElem, 'settings_desc', 'caption');
      setupBlurSave(giftDescElem, 'settings_gift', 'caption');
      setupBlurSave(ringDescElem, 'settings_ring', 'caption');
    }

    function bindAuthEvents() {
      const showLoginBtn = document.getElementById('showLoginBtn');
      const authInputs = document.getElementById('authInputs');
      const cancelBtn = document.getElementById('cancelBtn');
      const loginBtn = document.getElementById('loginBtn');

      showLoginBtn.addEventListener('click', () => { showLoginBtn.style.display = 'none'; authInputs.style.display = 'flex'; });
      cancelBtn.addEventListener('click', () => { authInputs.style.display = 'none'; showLoginBtn.style.display = 'inline-block'; });
      loginBtn.addEventListener('click', () => {
        if (document.getElementById('passwordInput').value === ADMIN_PASSWORD) {
          localStorage.setItem('isAdmin', 'true');
          location.reload();
        } else { alert('密碼錯誤！'); }
      });
    }

    function setupTabs() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.getAttribute('data-category');
          currentCategoryDisplayName = btn.innerText.trim();
          document.getElementById('currentTabName').innerText = currentCategoryDisplayName;
          
          const giftNotice = document.getElementById('giftNoticeContainer');
          const ringNotice = document.getElementById('ringNoticeContainer');
          
          giftNotice.style.display = (currentCategory === 'gift') ? 'block' : 'none';
          ringNotice.style.display = (currentCategory.includes('ring')) ? 'block' : 'none';

          renderGallery();
        });
      });
    }

    async function fetchData() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getData`);
        const result = await response.json();
        if (result.status === 'success') {
          allData = result.data.filter(item => !['settings_desc', 'settings_gift', 'settings_ring'].includes(String(item.id)));
          
          const updateText = (id, elemId) => {
            const item = result.data.find(i => String(i.id) === id);
            if (item && item.caption) document.getElementById(elemId).innerText = item.caption;
          };
          updateText('settings_desc', 'siteDescription');
          updateText('settings_gift', 'giftDescription');
          updateText('settings_ring', 'ringDescription');

          renderGallery();
        }
      } catch (err) { console.error(err); }
    }

    async function updateItemById(id, field, value) {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=updateItem&id=${id}&field=${field}&value=${encodeURIComponent(value)}`);
        return (await response.json()).status === 'success';
      } catch (err) { return false; }
    }

    function hasChinese(str) { return /[\u4e00-\u9fa5]/.test(str); }

    function compareCaption(a, b) {
      const capA = String(a.caption || '').trim();
      const capB = String(b.caption || '').trim();
      if (!capA && !capB) return 0;
      if (!capA) return 1;
      if (!capB) return -1;
      const aHasChinese = hasChinese(capA);
      const bHasChinese = hasChinese(capB);
      if (aHasChinese && !bHasChinese) return -1;
      if (!aHasChinese && bHasChinese) return 1;
      return capA.localeCompare(capB, 'zh-Hant', { numeric: true, sensitivity: 'base' });
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = allData.filter(item => {
        if (item.category !== currentCategory) return false;
        if (!keyword) return true;
        return String(item.caption || '').toLowerCase().includes(keyword) || String(item.note || '').toLowerCase().includes(keyword);
      });
      
      filtered.sort(compareCaption);
      gallery.innerHTML = '';

      filtered.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'img-card';
        card.innerHTML = `
          <button class="delete-btn" title="刪除圖片">✕</button>
          <div class="img-wrapper">
            <span class="status-badge" id="badge-${item.id}">${item.quantity || '數量: 1'}</span>
            <img src="${item.url}" alt="image" loading="lazy" />
          </div>
          <div class="img-info">
            <span class="editable-text" contenteditable="${isAdmin}" id="text-${item.id}">${item.caption || ''}</span>
          </div>
        `;
        gallery.appendChild(card);
      });
    }
  </script>
</body>
</html>
