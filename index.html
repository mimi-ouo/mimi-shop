<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⭐ 米米小舖-Club MStar ⭐</title>
  <style>
    :root {
      --bg-color: #36393f;
      --card-bg: #2f3136;
      --text-color: #dcddde;
      --accent-color: #5865f2;
      --danger-color: #ed4245;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 頂部列：標題、說明區塊與登入區 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      gap: 20px;
    }

    /* 左側標題與紅框說明區組合 */
    .title-left {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      flex: 1;
    }

    .title-left h2 {
      margin: 0;
      white-space: nowrap;
      line-height: 1.4;
    }

    /* 說明欄樣式 */
    .info-badge {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      background-color: #202225;
      border: 1px solid #4f545c;
      color: #b9bbbe;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
      width: 100%;
      max-width: 280px;
      min-height: 38px;
      box-sizing: border-box;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .info-badge .editable-text {
      flex: 1;
      outline: none;
    }

    /* 登入區控制 */
    .auth-box {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .auth-inputs {
      display: none;
      gap: 8px;
      align-items: center;
    }

    .auth-inputs input {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #4f545c;
      background: #202225;
      color: #fff;
    }

    .auth-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    .cancel-btn {
      background: #4f545c;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* 分頁選單 */
    .tabs-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #4f545c;
      padding-bottom: 10px;
      overflow-x: auto;
    }

    .tab-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #fff;
      font-weight: bold;
    }

    /* 管理員可編輯分頁的視覺提示 */
    .is-admin .tab-btn span[contenteditable="true"] {
      cursor: text;
      padding: 2px 4px;
      border-radius: 4px;
      outline: none;
    }

    .is-admin .tab-btn span[contenteditable="true"]:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .is-admin .tab-btn span[contenteditable="true"]:focus {
      background: rgba(0, 0, 0, 0.3);
      box-shadow: 0 0 0 1px #fff;
    }

    /* 上傳區 (預設隱藏，登入後顯示) */
    .drop-zone {
      border: 2px dashed #4f545c;
      background: var(--card-bg);
      padding: 25px;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 25px;
      display: none;
    }
    
    .drop-zone.dragover {
      background: #393c43;
      border-color: var(--accent-color);
    }

    /* 圖片網格：固定 120px */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, 120px);
      gap: 12px;
    }

    /* 圖片卡片：固定 120px */
    .img-card {
      width: 120px;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .img-wrapper {
      width: 120px;
      height: 120px;
      position: relative;
      background-color: #202225;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 右上角自訂標籤 (通用樣式) */
    .status-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 10;
      background-color: rgba(32, 34, 37, 0.85);
      color: #fff;
      border: 1px solid #4f545c;
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 9px;
      font-weight: bold;
      backdrop-filter: blur(4px);
      max-width: 75px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      outline: none;
    }

    /* 管理員可編輯標籤狀態 */
    .is-admin .status-badge {
      cursor: text;
    }
    .is-admin .status-badge:hover {
      border-color: var(--accent-color);
    }

    /* 包含「售出」時的紅色樣式 */
    .status-badge.is-sold {
      background-color: rgba(237, 66, 69, 0.9);
      border-color: var(--danger-color);
      color: #ffffff;
    }

    /* 刪除按鈕 (左上角) */
    .delete-btn {
      position: absolute;
      top: 4px;
      left: 4px;
      background-color: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      z-index: 10;
    }

    .delete-btn:hover {
      background-color: var(--danger-color);
    }

    .img-info {
      padding: 4px 6px;
      font-size: 11px;
      color: #b9bbbe;
      background-color: #2f3136;
      text-align: center;
    }

    .editable-text {
      outline: none;
      padding: 1px 2px;
      border-radius: 4px;
      color: #ffffff;
      word-break: break-all;
      display: block;
    }

    /* 登入後可編輯的視覺提示 */
    .is-admin .editable-text {
      background: rgba(0, 0, 0, 0.2);
      cursor: text;
    }
    .is-admin .editable-text:hover {
      border: 1px #4f545c solid;
    }
    .is-admin .img-card:hover .delete-btn {
      display: flex;
    }
  </style>
</head>
<body>

  <!-- 頂部列：左側標題與紅框說明區、右側登入區 -->
  <div class="header">
    <div class="title-left">
      <h2>⭐ 米米小舖 ⭐</h2>
      <div class="info-badge">
        <span class="info-icon">📕</span>
        <span class="editable-text" id="siteDescription" contenteditable="false">載入中...</span>
      </div>
    </div>

    <div class="auth-box" id="authBox">
      <button class="auth-btn" id="showLoginBtn">登入</button>
      <div class="auth-inputs" id="authInputs">
        <input type="email" id="emailInput" placeholder="管理員 Email">
        <input type="password" id="passwordInput" placeholder="密碼">
        <button class="auth-btn" id="loginBtn">確認</button>
        <button class="cancel-btn" id="cancelBtn">✕</button>
      </div>
    </div>
  </div>

  <!-- 分頁選單 (包含可編輯的 span) -->
  <div class="tabs-container">
    <button class="tab-btn active" data-category="general"><span contenteditable="false" id="tab-label-general">🏠 家具</span></button>
    <button class="tab-btn" data-category="memes"><span contenteditable="false" id="tab-label-memes">🧸 熊熊</span></button>
    <button class="tab-btn" data-category="design"><span contenteditable="false" id="tab-label-design">💍 戒指(限男)</span></button>
    <button class="tab-btn" data-category="photos"><span contenteditable="false" id="tab-label-photos">💍 戒指(限女)</span></button>
    <button class="tab-btn" data-category="crops_m"><span contenteditable="false" id="tab-label-crops_m">🌱 作物(限男)</span></button>
    <button class="tab-btn" data-category="crops_f"><span contenteditable="false" id="tab-label-crops_f">🌱 作物(限女)</span></button>
  </div>
  
  <!-- 上傳區 (僅管理員可見) -->
  <div class="drop-zone" id="dropZone">
    <p style="font-size: 16px; margin-bottom: 8px;">💡 當前分頁：<b id="currentTabName">家具</b>（Ctrl + V 貼上圖片 / 拖曳上傳）</p>
    <p id="status" style="color: var(--accent-color); margin: 0; font-weight: bold;"></p>
  </div>

  <div class="gallery" id="gallery"></div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, update, remove, set, onValue, onChildAdded, onChildChanged, onChildRemoved, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCVUSw-B1it_bQ2sF3pAsTI0pXcyF-Tdfg",
      authDomain: "mimishop-93214.firebaseapp.com",
      databaseURL: "https://mimishop-93214-default-rtdb.firebaseio.com",
      projectId: "mimishop-93214",
      storageBucket: "mimishop-93214.firebasestorage.app",
      messagingSenderId: "953118400447",
      appId: "1:953118400447:web:3a0e2fc6c4d2b65425cb0a",
      measurementId: "G-0EDJDFNFWF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentCategory = 'general';
    let activeRef = null;
    let isAdmin = false;

    // 預設分頁名稱表
    const defaultTabs = {
      general: "🏠 家具",
      memes: "🧸 熊熊",
      design: "💍 戒指(限男)",
      photos: "💍 戒指(限女)",
      crops_m: "🌱 作物(限男)",
      crops_f: "🌱 作物(限女)"
    };

    function getDefaultTimeStr() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatStatusValue(val) {
      if (!val) return '數量: 1';
      return val;
    }

    // 1. 說明欄即時同步與編輯
    const descElem = document.getElementById('siteDescription');
    const descRef = ref(db, 'settings/description');

    onValue(descRef, (snapshot) => {
      const data = snapshot.val();
      const defaultText = "訪客僅供檢視，管理員登入後可上傳與編輯。";
      if (document.activeElement !== descElem) {
        descElem.innerText = data !== null ? data : defaultText;
      }
    });

    descElem.addEventListener('blur', () => {
      if (!isAdmin) return;
      const newDesc = descElem.innerText.trim();
      set(descRef, newDesc);
    });

    // 2. 分頁名稱即時同步與編輯
    const tabsRef = ref(db, 'settings/tabs');
    onValue(tabsRef, (snapshot) => {
      const tabsData = snapshot.val() || {};
      Object.keys(defaultTabs).forEach(cat => {
        const spanElem = document.getElementById(`tab-label-${cat}`);
        if (spanElem && document.activeElement !== spanElem) {
          const tabTitle = tabsData[cat] || defaultTabs[cat];
          spanElem.innerText = tabTitle;
          // 若當前分頁名稱有改變，更新上傳區提示
          if (cat === currentCategory) {
            document.getElementById('currentTabName').innerText = tabTitle;
          }
        }
      });
    });

    // 初始化分頁事件與可編輯屬性控制
    document.querySelectorAll('.tab-btn').forEach(btn => {
      const cat = btn.getAttribute('data-category');
      const span = btn.querySelector('span');

      // 點擊分頁（點擊文字內部編輯時不觸發切換）
      btn.addEventListener('click', (e) => {
        if (e.target === span && isAdmin && span.isContentEditable) {
          return; // 正處於編輯狀態，不切換分頁
        }
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('currentTabName').innerText = span.innerText;
        switchCategory(cat);
      });

      // 儲存修改後的分頁名稱
      span.addEventListener('blur', () => {
        if (!isAdmin) return;
        const newText = span.innerText.trim();
        set(ref(db, `settings/tabs/${cat}`), newText);
      });

      span.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          span.blur();
        }
      });
    });

    // 3. 登入狀態監聽
    onAuthStateChanged(auth, (user) => {
      const authBox = document.getElementById('authBox');
      const dropZone = document.getElementById('dropZone');

      if (user) {
        isAdmin = true;
        document.body.classList.add('is-admin');
        dropZone.style.display = 'block';
        if (descElem) descElem.contentEditable = "true";

        // 開啟分頁編輯權限
        document.querySelectorAll('.tab-btn span').forEach(s => s.contentEditable = "true");
        
        authBox.innerHTML = `
          <span style="color:#57F287; font-size:14px;">已登入管理員</span>
          <button class="auth-btn" id="logoutBtn" style="background:#4f545c">登出</button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
      } else {
        isAdmin = false;
        document.body.classList.remove('is-admin');
        dropZone.style.display = 'none';
        if (descElem) descElem.contentEditable = "false";

        // 關閉分頁編輯權限
        document.querySelectorAll('.tab-btn span').forEach(s => s.contentEditable = "false");
        
        authBox.innerHTML = `
          <button class="auth-btn" id="showLoginBtn">登入</button>
          <div class="auth-inputs" id="authInputs">
            <input type="email" id="emailInput" placeholder="管理員 Email">
            <input type="password" id="passwordInput" placeholder="密碼">
            <button class="auth-btn" id="loginBtn">確認</button>
            <button class="cancel-btn" id="cancelBtn">✕</button>
          </div>
        `;
        bindAuthEvents();
      }
      
      switchCategory(currentCategory);
    });

    function bindAuthEvents() {
      const showLoginBtn = document.getElementById('showLoginBtn');
      const authInputs = document.getElementById('authInputs');
      const cancelBtn = document.getElementById('cancelBtn');
      const loginBtn = document.getElementById('loginBtn');

      if (showLoginBtn) {
        showLoginBtn.addEventListener('click', () => {
          showLoginBtn.style.display = 'none';
          authInputs.style.display = 'flex';
        });
      }

      if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
          authInputs.style.display = 'none';
          showLoginBtn.style.display = 'inline-block';
        });
      }

      if (loginBtn) {
        loginBtn.addEventListener('click', handleLogin);
      }
    }

    async function handleLogin() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        alert('登入失敗：' + err.message);
      }
    }

    // 渲染右上角可即時編輯的標籤
    function renderStatusElement(key, rawStatusValue) {
      const statusValue = formatStatusValue(rawStatusValue);
      const isSoldClass = statusValue.includes('售出') ? 'is-sold' : '';
      return `
        <span class="status-badge ${isSoldClass}" id="badge-${key}" contenteditable="${isAdmin}">
          ${statusValue}
        </span>
      `;
    }

    // 4. 圖片分頁監聽與更新
    function switchCategory(newCategory) {
      if (activeRef) off(activeRef);

      currentCategory = newCategory;
      activeRef = ref(db, `images/${currentCategory}`);
      document.getElementById('gallery').innerHTML = '';

      onChildAdded(activeRef, (snapshot) => {
        const key = snapshot.key;
        const data = snapshot.val();
        const gallery = document.getElementById('gallery');

        const card = document.createElement('div');
        card.className = 'img-card';
        card.id = `card-${key}`;

        const textValue = data.caption || getDefaultTimeStr();
        const statusValue = data.quantity || '數量: 1';

        card.innerHTML = `
          <button class="delete-btn" title="刪除圖片">✕</button>
          <div class="img-wrapper">
            ${renderStatusElement(key, statusValue)}
            <img src="${data.url}" loading="lazy" alt="uploaded image" />
          </div>
          <div class="img-info">
            <span class="editable-text" contenteditable="${isAdmin}" id="text-${key}">${textValue}</span>
          </div>
        `;

        gallery.prepend(card);

        // 管理員模式下綁定右上標籤即時編輯事件
        const badgeElem = card.querySelector(`#badge-${key}`);
        if (badgeElem) {
          badgeElem.addEventListener('blur', () => {
            if (!isAdmin) return;
            const newBadgeText = badgeElem.innerText.trim();
            update(ref(db, `images/${currentCategory}/${key}`), { quantity: newBadgeText });
          });

          badgeElem.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              badgeElem.blur();
            }
          });
        }

        // 刪除按鈕
        const deleteBtn = card.querySelector('.delete-btn');
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (isAdmin && confirm('確定要刪除這張圖片嗎？')) {
            remove(ref(db, `images/${currentCategory}/${key}`));
          }
        });

        // 編輯標題
        const editableElem = card.querySelector('.editable-text');
        editableElem.addEventListener('blur', () => {
          if (!isAdmin) return;
          const newText = editableElem.innerText.trim();
          update(ref(db, `images/${currentCategory}/${key}`), { caption: newText });
        });

        editableElem.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            editableElem.blur();
          }
        });
      });

      onChildChanged(activeRef, (snapshot) => {
        const key = snapshot.key;
        const data = snapshot.val();
        
        // 即時更新標題
        const targetTextElem = document.getElementById(`text-${key}`);
        if (targetTextElem && document.activeElement !== targetTextElem) {
          targetTextElem.innerText = data.caption || '';
        }

        // 即時更新右上角標籤文字與樣式
        const newStatus = formatStatusValue(data.quantity);
        const targetBadgeElem = document.getElementById(`badge-${key}`);
        if (targetBadgeElem && document.activeElement !== targetBadgeElem) {
          targetBadgeElem.innerText = newStatus;
          if (newStatus.includes('售出')) {
            targetBadgeElem.classList.add('is-sold');
          } else {
            targetBadgeElem.classList.remove('is-sold');
          }
        }
      });

      onChildRemoved(activeRef, (snapshot) => {
        const key = snapshot.key;
        const cardElem = document.getElementById(`card-${key}`);
        if (cardElem) cardElem.remove();
      });
    }

    // 圖片上傳邏輯
    function handleImageFile(file) {
      if (!isAdmin || !file || !file.type.startsWith('image/')) return;

      const status = document.getElementById('status');
      status.innerText = "正在發送圖片...";

      const reader = new FileReader();
      reader.onload = function(e) {
        push(ref(db, `images/${currentCategory}`), {
          url: e.target.result,
          caption: getDefaultTimeStr(),
          quantity: '數量: 1',
          timestamp: Date.now()
        });
        status.innerText = "發送成功！";
        setTimeout(() => status.innerText = "", 1500);
      };
      reader.readAsDataURL(file);
    }

    // 剪貼簿與拖曳事件
    document.addEventListener('paste', (e) => {
      if (!isAdmin || document.activeElement.isContentEditable) return;
      const items = e.clipboardData?.items;
      if (!items) return;
      for (let item of items) {
        if (item.type.includes('image')) {
          handleImageFile(item.getAsFile());
          break;
        }
      }
    });

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (isAdmin && e.dataTransfer.files.length > 0) {
        handleImageFile(e.dataTransfer.files[0]);
      }
    });
  </script>
</body>
</html>
