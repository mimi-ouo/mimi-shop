<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⭐ 米米小舖-Club MStar ⭐</title>

  <!-- 引入 Firebase Compat 版本 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <!-- 引入 Tally 嵌入腳本 -->
  <script async src="https://tally.so/widgets/embed.js"></script>
  <!-- 購物車一鍵截圖功能：用於將購物車金額與商品格子轉成圖片 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #ffffff;
      --danger-color: #ff4d4d;
      --success-color: #cccccc;
      --warning-color: #ffd700;
      --cart-color: #2b73df;
      --border-color: #3f3f46;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      width: 100%;
      box-sizing: border-box;
      margin: 0;
      padding: 15px;
      padding-right: 15px;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    /* 在線人數樣式優化排版 (改成底部固定) */
    .online-counter-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-color);
      z-index: 900;
      padding-top: 10px;
      padding-bottom: 15px;
      box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.5);
    }

    .counter-box {
      font-size: 14px;
      color: var(--text-color);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    #count {
      font-size: 16px;
      color: #00ff88;
      font-weight: bold;
    }

    .update-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(135deg, #ff3366, #ff9933);
      color: #fff;
      text-align: center;
      padding: 12px;
      font-weight: bold;
      z-index: 99999;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from { transform: translateY(-100%); }
      to { transform: translateY(0); }
    }

    @keyframes spinStar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Q彈跳動微動畫 (樣式三) */
    @keyframes bounceTag {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .rotating-star {
      display: inline-block;
      animation: spinStar 3s linear infinite;
      font-size: 10px;
    }

    .update-banner button {
      background: #fff;
      color: #ff3366;
      border: none;
      padding: 5px 15px;
      margin-left: 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .update-banner button:hover {
      background: #f0f0f0;
    }

    .cart-summary {
      background: var(--card-bg);
      border: 1px solid var(--cart-color);
      color: #ffffff;
      padding: 10px 12px;
      border-radius: 7px;
      margin-bottom: 14px;
      display: none;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      gap: 8px;
    }

    .cart-summary-main-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .cart-total-text {
      flex: 1 1 auto;
      min-width: 0;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-height: 44px;
      font-size: 19px;
      line-height: 1.15;
      font-weight: 800;
      white-space: nowrap;
    }

    .cart-total-text #totalAmount {
      font-size: 29px;
      line-height: 1;
      margin-left: 6px;
      font-weight: 900;
    }

    .cart-summary-right {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 5px;
    }

    .cart-summary-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      width: 100%;
    }

    .clear-cart-btn {
      background-color: var(--danger-color);
      color: white;
      border: none;
      padding: 6px 11px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }
    
    .clear-cart-btn:hover {
      background-color: #cc3d3d;
    }

    /* 購物車交易設定：本地儲存，不同步到雲端 */
    .cart-preference-row {
      width: auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex-wrap: nowrap;
      box-sizing: border-box;
      padding-top: 0;
    }

    .cart-preference-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 1 auto;
    }

    .cart-preference-label {
      color: #cfcfcf;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }

    .cart-preference-select {
      background-color: #2b2b2b;
      color: #ffffff;
      border: 1px solid var(--cart-color);
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      text-align: center;
      text-align-last: center;
      min-width: 118px;
    }

    .cart-preference-select:focus {
      border-color: #7da9ff;
      box-shadow: 0 0 0 2px rgba(43, 115, 223, 0.2);
    }

    .cart-preference-select option {
      background-color: #2b2b2b;
      color: #ffffff;
    }

    #backToTopBtn {
      position: fixed;
      bottom: 75px;
      right: 30px;
      display: none;
      background-color: var(--card-bg);
      color: var(--accent-color);
      border: 1px solid var(--border-color);
      padding: 10px 15px;
      border-radius: 50px;
      cursor: pointer;
      z-index: 9999;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: background 0.3s;
    }
    #backToTopBtn:hover {
      background-color: #333;
    }

    .sticky-header-wrapper {
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      z-index: 900;
      padding-top: 10px;
      padding-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .header-layout {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .left-control-panel {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      flex: 1;
      min-width: 280px;
    }

    .title-area-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .title-discord-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .title-area h2 {
      margin: 0;
      font-size: 26px;
      line-height: 1.4;
      white-space: nowrap;
      color: #ffffff;
      background: linear-gradient(45deg, #ff3366, #ff9933, #33cc33, #3399ff, #9933ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .discord-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .discord-container {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .discord-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #5865F2;
      border: 1px solid #4752C4;
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      width: fit-content;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(88, 101, 242, 0.35);
      transition: all 0.2s ease-in-out;
    }

    .discord-badge:hover {
      background-color: #4752C4;
      border-color: #3b429f;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(88, 101, 242, 0.55);
      transform: translateY(-1px);
    }

   .tally-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      width: fit-content;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(168, 85, 247, 0.25);
      transition: all 0.2s ease-in-out;
    }

    .tally-badge:hover {
      background: linear-gradient(135deg, #b875f8, #f472b6);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.45);
      transform: translateY(-1px);
    }

    .discord-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .side-tabs-panel {
      position: fixed;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1100;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      transition: opacity 0.3s ease, padding 0.3s ease;
    }

    @media (min-width: 769px) {
      .side-tabs-panel {
        top: calc(120px + (100vh - 120px - 60px) / 2);
        transform: translateY(-50%);
        left: calc(50% + 615px);
        right: auto;
      }
    }

    @media (max-width: 768px) {
      .side-tabs-panel {
        top: 10px;
        right: 15px;
        left: auto;
        transform: none;
      }
    }

    .side-tabs-panel.collapsed {
      padding: 8px;
      gap: 4px;
    }
    .side-tabs-panel.collapsed .collapse-content {
      display: none;
    }

    .collapse-toggle-btn {
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 100px;
      box-sizing: border-box;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .collapse-toggle-btn:hover {
      background: #2a2a2a;
      border-color: var(--accent-color);
    }

    .collapse-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tab-btn, .dropdown-toggle {
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      width: 100px;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .tab-btn:hover, .dropdown-toggle:hover {
      background: #2a2a2a;
      border-color: var(--accent-color);
    }

    .tab-btn.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: #121212;
      font-weight: bold;
    }

    .tab-btn[data-category="cart"] {
      border-color: var(--cart-color);
      color: #7289da;
      justify-content: space-between;
      position: relative;
    }
    .tab-btn[data-category="cart"].active {
      background: var(--cart-color);
      color: #ffffff;
      font-weight: bold;
    }

    .cart-badge-count {
      background-color: #ff4d4d;
      color: #ffffff;
      font-size: 10px;
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 14px;
      line-height: 1.2;
    }

    .dropdown {
      position: relative;
      display: block;
      width: 100px;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 0;
      right: calc(100% + 8px);
      background-color: var(--card-bg);
      min-width: 110px;
      box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.5);
      border-radius: 6px;
      z-index: 1200;
      padding: 4px 0;
      border: 1px solid var(--border-color);
    }

    .dropdown:hover .dropdown-menu,
    .dropdown.open .dropdown-menu,
    .dropdown-menu:hover {
      display: block;
    }

    .dropdown-item {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      color: var(--text-color);
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      box-sizing: border-box;
      background: none;
      border: none;
      text-align: left;
    }

    .dropdown-item:hover {
      background-color: var(--accent-color);
      color: #121212;
    }

    .auth-section-wrapper {
      border-top: 1px solid var(--border-color);
      padding-top: 8px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100px;
      box-sizing: border-box;
    }

    .auth-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .auth-inputs {
      display: none;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .auth-inputs input {
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      width: 100%;
      font-size: 12px;
      box-sizing: border-box;
    }

    .auth-btn {
      background: var(--accent-color);
      color: #121212;
      border: none;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }

    .cancel-btn {
      background: #3f3f46;
      color: var(--text-color);
      border: none;
      padding: 4px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      width: 100%;
      text-align: center;
    }

    .section-sort-container {
      display: flex;
      justify-content: flex-end;
      margin-top: 15px;
      margin-bottom: 5px;
      width: 100%;
    }

    .search-sort-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
    }

    .search-input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      flex: 1;
      font-size: 13px;
      box-sizing: border-box;
    }

    .sort-select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      font-size: 13px;
      cursor: pointer;
      outline: none;
      box-sizing: border-box;
    }

    .custom-notice-container {
      display: none;
      width: 100%;
      margin: 15px 0 0 0;
      text-align: center;
    }

    .custom-notice-box {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.5;
      text-align: left;
      box-sizing: border-box;
      width: 100%;
    }

    .drop-zone {
      border: 2px dashed var(--border-color);
      background: var(--card-bg);
      padding: 25px;
      text-align: center;
      border-radius: 8px;
      margin-top: 20px;
      margin-bottom: 25px;
      display: none;
    }
    
    .drop-zone.dragover {
      background: #2a2a2a;
      border-color: var(--accent-color);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      align-items: start;
      margin-top: 10px;
      margin-bottom: 50px;
    }

    @media (max-width: 768px) {
      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
        gap: 5px;
      }
      .img-card, .img-wrapper {
        width: 112px !important;
      }
      .img-wrapper {
        height: 112px !important;
      }
      
      .hot-badge-tag, .hot-select {
        font-size: 6px !important;
        padding: 0px 6px;
      }
    }

    .welcome-message {
      grid-column: 1 / -1;
      text-align: left;
      padding: 35px 30px;
      font-size: 15px;
      line-height: 1.8;
      border: 1px solid rgba(255, 153, 51, 0.3);
      background: linear-gradient(145deg, #181818, #222222);
      border-radius: 16px;
      margin-top: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .welcome-message::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 100%;
      background: linear-gradient(to bottom, #ff3366, #ff9933, #9933ff);
    }

    .welcome-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 20px;
      letter-spacing: 1px;
      animation: colorFlash 1.5s infinite;
      text-align: center;
      text-shadow: 0 2px 10px rgba(255, 100, 100, 0.2);
    }

    @keyframes colorFlash {
      0% { color: #ff3366; }
      25% { color: #ff9933; }
      50% { color: #33cc33; }
      75% { color: #3399ff; }
      100% { color: #9933ff; }
    }

    .welcome-content-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: rgba(0, 0, 0, 0.25);
      padding: 22px 25px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .welcome-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .welcome-label {
      font-weight: 700;
      color: #ffd700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .welcome-desc {
      color: #dcdcdc;
      font-size: 14px;
      padding-left: 24px;
      font-weight: normal;
    }

    .welcome-footer-action {
      margin-top: 25px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .welcome-sweet-tip {
      font-size: 16px;
      font-weight: bold;
      color: #ff99bb;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(255, 153, 187, 0.2);
    }

    .welcome-action-btn {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      background: linear-gradient(135deg, #ff3366, #ff9933);
      padding: 12px 30px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
      letter-spacing: 1.5px;
      display: inline-block;
      transition: transform 0.2s, box-shadow 0.2s;
      user-select: none;
      cursor: pointer;
    }

    .welcome-action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 51, 102, 0.6);
    }

    .img-card {
      width: 140px;
      background-color: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      position: relative;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .img-card.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    .img-wrapper {
      width: 140px;
      height: 140px;
      position: relative;
      background-color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-text {
      position: absolute;
      font-size: 10px;
      color: #888888;
      text-align: center;
      width: 100%;
      padding: 0 2px;
      box-sizing: border-box;
      z-index: 1;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      position: relative;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .img-card.loaded .img-wrapper img {

    const db = firebase.database();

    const userStatusDatabaseRef = db.ref('status');

    db.ref('.info/connected').on('value', function(snapshot) {
      if (snapshot.val() === false) {
        return;
      }
      const myConnectionRef = userStatusDatabaseRef.push();
      myConnectionRef.onDisconnect().remove();
      myConnectionRef.set({
        online: true,
        timestamp: firebase.database.ServerValue.TIMESTAMP

    userStatusDatabaseRef.on('value', function(snapshot) {

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVrP__g-bnoVRQQrJkKLlMZDhSbFeUuTMyw6-zVRhtYkkSedoVbJXKUwN0bUyc4vs3rQ/exec";

    let currentCategory = ''; 
    let currentCategoryDisplayName = '尚未選擇分頁';
    let isAdmin = false;
    let allData = [];
    let cartItems = loadCartFromStorage();
    let cartPaymentMethod = loadCartPreference('cartPaymentMethod', '💰 轉帳');
    let cartCharacterGender = loadCartPreference('cartCharacterGender', '男號');
    let activeModalItem = null;
    let currentAlbumList = [];
    let currentAlbumIndex = 0;

    let scheduleYear = 2026;
    let scheduleMonth = 7;

    let initialDataHash = '';

    function loadCartFromStorage() {
      try {
        const stored = localStorage.getItem('userCartItems');
        if (stored) {
          const arr = JSON.parse(stored);
          return new Map(arr);
        }
      } catch (e) {
        console.error('讀取購物車失敗:', e);
      }
      return new Map();
    }

    function saveCartToStorage() {
      try {
        const arr = Array.from(cartItems.entries());
        localStorage.setItem('userCartItems', JSON.stringify(arr));
      } catch (e) {
        console.error('儲存購物車失敗:', e);
      }
    }

    function loadCartPreference(key, fallback) {
      try {
        const stored = localStorage.getItem(key);
        return stored !== null ? stored : fallback;
      } catch (e) {
        console.error('讀取購物車設定失敗:', e);
        return fallback;
      }
    }

    function saveCartPreference(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (e) {
        console.error('儲存購物車設定失敗:', e);
      }
    }

    function applyCartPreferencesToUI() {
      const paymentEl = document.getElementById('cartPaymentMethod');
      const genderEl = document.getElementById('cartCharacterGender');

      if (paymentEl) {
        paymentEl.value = cartPaymentMethod;
        if (paymentEl.value !== cartPaymentMethod) {
          cartPaymentMethod = paymentEl.options[0]?.value || '💰 轉帳';

      }

      if (genderEl) {
        genderEl.value = cartCharacterGender;
        if (genderEl.value !== cartCharacterGender) {
          cartCharacterGender = genderEl.options[0]?.value || '男號';
        }

    function setupCartPreferences() {
      const paymentEl = document.getElementById('cartPaymentMethod');
      const genderEl = document.getElementById('cartCharacterGender');

      applyCartPreferencesToUI();

      if (paymentEl) {
        paymentEl.addEventListener('change', () => {

      auth.onAuthStateChanged((user) => {
        if (user && user.email === "comtw919@gmail.com") {

    function computeDataHash(data) {
      return JSON.stringify(data.map(i => i.id).sort());
    }

    async function checkForUpdates() {
      if (isAdmin) return;

      try {
        const response = await fetch(`${SCRIPT_URL}?action=getData`);
        const result = await response.json();
        if (result.status === 'success') {
          const settingsIds = ['settings_desc', 'settings_gift', 'settings_ring', 'settings_crop'];
          const filtered = result.data.filter(item => !settingsIds.includes(String(item.id)) && item.category !== 'album_item');
          const newHash = computeDataHash(filtered);

          if (initialDataHash && newHash !== initialDataHash) {
            document.getElementById('updateBanner').style.display = 'block';
          }
        }
      } catch (err) {
        console.error("檢查更新失敗", err);
      }
    }

    function setupClearCartBtn() {
      document.getElementById('clearCartBtn').addEventListener('click', () => {
        if (confirm('確定要清空購物車嗎？')) {
          cartItems.clear();
          saveCartToStorage();
          updateCartButtonBadge();
          renderGallery();
          calculateTotal();
        }
      });
    }

    function calculateTotal() {
        let total = 0;
        cartItems.forEach((qtyStr, id) => {
            const item = allData.find(i => String(i.id) === String(id));
            if (item && item.category !== 'gift') {
                const price = parseInt(item.price) || 0;
                const qtyMatch = qtyStr.match(/\d+/);
                const qty = qtyMatch ? parseInt(qtyMatch[0], 10) : 1;
                total += (price * qty);
            }
        });
        document.getElementById('totalAmount').innerText = total;
    }

    let cartCaptureStatusTimer = null;

    function setCartCaptureStatus(message, isError = false, autoHide = true) {
      const statusEl = document.getElementById('cartCaptureStatus');
      if (!statusEl) return;

      if (cartCaptureStatusTimer) {
        clearTimeout(cartCaptureStatusTimer);
        cartCaptureStatusTimer = null;
      }

      statusEl.innerText = message || '';
      statusEl.style.color = isError ? '#ff9a9a' : '#9ad0ff';

      if (message && autoHide) {
        cartCaptureStatusTimer = setTimeout(() => {
          statusEl.innerText = '';
          cartCaptureStatusTimer = null;
        }, 3000);
      }
    }

    function waitForImages(root) {
      const images = Array.from(root.querySelectorAll('img'));
      return Promise.all(images.map((img) => {
        if (img.complete && img.naturalWidth > 0) {
          return Promise.resolve();
        }
        return new Promise((resolve) => {
          const done = () => {
            img.removeEventListener('load', done);
            img.removeEventListener('error', done);
            resolve();
          };
          img.addEventListener('load', done, { once: true });
          img.addEventListener('error', done, { once: true });
        });
      }));
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) {
            resolve(blob);
          } else {
            reject(new Error('圖片產生失敗，請再試一次。'));
          }
        }, 'image/png');
      });
    }

    function isMobileDevice() {
      return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
             (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    async function copyCanvasToClipboard(canvas) {
      if (!navigator.clipboard || typeof navigator.clipboard.write !== 'function' || typeof ClipboardItem === 'undefined') {
        throw new Error('目前瀏覽器不支援圖片剪貼簿功能，請改用最新版 Chrome / Safari，並確認網站使用 HTTPS。');
      }

      const blob = await canvasToBlob(canvas);
      await navigator.clipboard.write([
        new ClipboardItem({ 'image/png': blob })
      ]);
    }

    /*
     * 手機端重點修正：
     * iOS Safari / 部分 Android 瀏覽器會在 await html2canvas() 之後判定
     * 使用者點擊的 activation 已失效，導致 navigator.clipboard.write() 被拒絕。
     *
     * 因此先在「點擊事件仍有效」的同步階段呼叫 clipboard.write()，
     * ClipboardItem 裡的 PNG Blob 改用 Promise 等待後續 html2canvas 完成。
     */
    function startMobileSafeClipboardCapture(captureCanvasPromise) {
      if (!navigator.clipboard ||
          typeof navigator.clipboard.write !== 'function' ||
          typeof ClipboardItem === 'undefined') {
        return null;
      }

      try {
        const blobPromise = captureCanvasPromise.then(canvasToBlob);
        const item = new ClipboardItem({
          'image/png': blobPromise
        });

        // 這裡刻意不要 await，必須在原始 click event 的 activation 期間呼叫。
        return navigator.clipboard.write([item]);
      } catch (error) {
        console.warn('無法啟動手機剪貼簿流程:', error);
        return null;
      }

    async function downloadCanvasImage(canvas) {

      const link = document.createElement('a');
      link.href = url;
      link.download = `購物車_${new Date().toISOString().slice(0, 10)}.png`;
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function shareCanvasImage(canvas) {
      if (!navigator.share) return false;

      const blob = await canvasToBlob(canvas);
      const file = new File([blob], `購物車_${new Date().toISOString().slice(0, 10)}.png`, {
        type: 'image/png'
      });

      if (navigator.canShare && !navigator.canShare({ files: [file] })) {
        return false;
      }

      await navigator.share({
        files: [file],
        title: '購物車截圖'
      });
      return true;
    }

    function buildCartCaptureStage() {
      const existing = document.getElementById('cartCaptureStage');
      if (existing) existing.remove();

      const stage = document.createElement('div');
      stage.id = 'cartCaptureStage';
      stage.className = 'cart-capture-stage';
      stage.setAttribute('aria-hidden', 'true');

      const summary = document.getElementById('cartSummary');
      const gallery = document.getElementById('gallery');

      if (!summary || !gallery) {
        throw new Error('找不到購物車內容。');
      }

      const summaryClone = summary.cloneNode(true);
      summaryClone.id = 'cartSummaryCapture';
      summaryClone.classList.add('cart-summary-capture');

      const galleryClone = gallery.cloneNode(true);
      galleryClone.id = 'cartGalleryCapture';

      stage.appendChild(summaryClone);
      stage.appendChild(galleryClone);
      document.body.appendChild(stage);

      // 原商品格子使用 lazy loading；截圖副本改為 eager，避免長購物車後段圖片未載入。
      galleryClone.querySelectorAll('img').forEach((img) => {
        img.removeAttribute('loading');
        img.setAttribute('loading', 'eager');
        img.setAttribute('decoding', 'async');
      });

      return stage;
    }

    async function captureAndCopyCart() {
      const button = document.getElementById('cartCaptureBtn');
      if (!button) return;

      if (currentCategory !== 'cart') {
        setCartCaptureStatus('請先進入「🛒 購物車」分頁再使用截圖功能。', true);
        return;
      }

      if (!cartItems || cartItems.size === 0) {
        setCartCaptureStatus('購物車目前沒有商品，無法建立商品截圖。', true);
        return;
      }

      if (typeof html2canvas !== 'function') {
        setCartCaptureStatus('截圖元件尚未載入完成，請稍後再試一次。', true);
        return;
      }

      button.disabled = true;
      setCartCaptureStatus('📸 正在整理購物車圖片，請稍候...');

      let stage = null;
      try {
        calculateTotal();
        applyCartPreferencesToUI();
        stage = buildCartCaptureStage();

        /*
         * 先建立完整截圖 Promise。
         * 手機端必須在 click handler 的同步階段就呼叫 clipboard.write，
         * 不能等 html2canvas 完成後才第一次觸發 Clipboard API。
         */
        const captureCanvasPromise = (async () => {
          await new Promise((resolve) =>
            requestAnimationFrame(() =>
              requestAnimationFrame(resolve)
            )
          );
          await waitForImages(stage);

          return html2canvas(stage, {
            backgroundColor: '#121212',
            useCORS: true,
            allowTaint: false,
            scale: Math.min(window.devicePixelRatio || 1, 2),
            logging: false,
            imageTimeout: 15000,
            removeContainer: true
          });
        })();

        // 手機優先使用「同步啟動、非同步完成」的 ClipboardItem 流程。
        const mobileClipboardPromise = isMobileDevice()
          ? startMobileSafeClipboardCapture(captureCanvasPromise)
          : null;

        const canvas = await captureCanvasPromise;

        if (mobileClipboardPromise) {
          try {
            await mobileClipboardPromise;
            setCartCaptureStatus('✅ 截圖完成！已複製到剪貼簿，可直接貼到 Discord / LINE。');
            return;
          } catch (clipboardError) {
            console.warn('手機圖片剪貼簿失敗，改用備援方式:', clipboardError);

            // 某些手機瀏覽器即使支援 Clipboard API，也可能禁止圖片寫入。
            // 優先開啟系統分享；若分享不可用，再直接下載 PNG。
            try {
              if (await shareCanvasImage(canvas)) {
                setCartCaptureStatus('✅ 截圖完成！已開啟手機分享選單。');
                return;
              }
            } catch (shareError) {
              console.warn('手機分享失敗:', shareError);
            }

            await downloadCanvasImage(canvas);
            setCartCaptureStatus('✅ 截圖完成！手機瀏覽器限制圖片剪貼簿，已改為下載 PNG。');
            return;
          }
        }

        // 桌面端維持原本的圖片剪貼簿流程。
        try {
          await copyCanvasToClipboard(canvas);
          setCartCaptureStatus('✅ 截圖完成！購物車金額與商品格子圖片已複製到剪貼簿，可直接貼到 Discord / LINE。');
        } catch (clipboardError) {
          // 非 HTTPS / 不支援 Clipboard API 時，至少保留可用的圖片下載。
          console.warn('桌面圖片剪貼簿失敗，改用下載備援:', clipboardError);
          await downloadCanvasImage(canvas);
          setCartCaptureStatus('✅ 截圖完成！圖片剪貼簿不可用，已改為下載 PNG。');
        }
      } catch (error) {
        console.error('購物車截圖失敗:', error);
        const message = error && error.message ? error.message : '截圖或複製失敗，請再試一次。';
        setCartCaptureStatus('❌ ' + message, true);
      } finally {
        if (stage) stage.remove();
        button.disabled = false;
      }
    }

    function isWorkDay(date) {
      const baseDate = new Date(2026, 7, 8); 
      const diffTime = date.getTime() - baseDate.getTime();
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
      const mod = ((diffDays % 4) + 4) % 4;
      return mod === 2 || mod === 3;
    }

    function renderSchedule() {
      const titleElem = document.getElementById('scheduleMonthTitle');
      const gridElem = document.getElementById('calendarDaysGrid');
      
      titleElem.innerText = `${scheduleYear}年 ${scheduleMonth + 1}月 班表`;
      gridElem.innerHTML = '';

      const firstDayIndex = new Date(scheduleYear, scheduleMonth, 1).getDay();
      const totalDays = new Date(scheduleYear, scheduleMonth + 1, 0).getDate();
      const prevTotalDays = new Date(scheduleYear, scheduleMonth, 0).getDate();

      for (let i = firstDayIndex - 1; i >= 0; i--) {
        const dayNum = prevTotalDays - i;
        const cell = document.createElement('div');
        cell.className = 'calendar-cell other-month';
        const d = new Date(scheduleYear, scheduleMonth - 1, dayNum);
        const work = isWorkDay(d);
        cell.innerHTML = `
          <div class="calendar-date-num">${dayNum}</div>
          <div class="calendar-badge ${work ? 'badge-work' : 'badge-off'}">${work ? '🫠 上班' : '😍 休假'}</div>
        `;
        gridElem.appendChild(cell);
      }

      for (let i = 1; i <= totalDays; i++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-cell';
        const d = new Date(scheduleYear, scheduleMonth, i);
        const work = isWorkDay(d);
        
        const today = new Date();
        const isToday = d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate();
        if (isToday) {
          cell.style.borderColor = 'var(--accent-color)';
        }

        cell.innerHTML = `
          <div class="calendar-date-num" ${isToday ? 'style="color:var(--warning-color);"' : ''}>${i}${isToday ? ' <span class="rotating-star">⭐</span> 今天' : ''}</div>
          <div class="calendar-badge ${work ? 'badge-work' : 'badge-off'}">${work ? '🫠 上班' : '😍 休假'}</div>
        `;
        gridElem.appendChild(cell);
      }

      const totalCells = firstDayIndex + totalDays;
      const remainingCells = (totalCells % 7 === 0) ? 0 : 7 - (totalCells % 7);
      for (let i = 1; i <= remainingCells; i++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-cell other-month';
        const d = new Date(scheduleYear, scheduleMonth + 1, i);
        const work = isWorkDay(d);
        cell.innerHTML = `
          <div class="calendar-date-num">${i}</div>
          <div class="calendar-badge ${work ? 'badge-work' : 'badge-off'}">${work ? '🫠 上班' : '😍 休假'}</div>
        `;
        gridElem.appendChild(cell);
      }
    }

    function compareItems(a, b) {
      const sortVal = document.getElementById('sortSelect').value;
      const priceA = parseFloat(a.price) || 0;
      const priceB = parseFloat(b.price) || 0;
      
      const idA = isNaN(a.id) ? 0 : Number(a.id);
      const idB = isNaN(b.id) ? 0 : Number(b.id);
      const timeA = a.timestamp || idA;
      const timeB = b.timestamp || idB;

      let primaryDiff = 0;
      if (sortVal === 'price_asc') {
        primaryDiff = priceA - priceB;
      } else if (sortVal === 'price_desc') {
        primaryDiff = priceB - priceA;
      } else if (sortVal === 'time_asc') {
        primaryDiff = timeA - timeB;
      } else {
        primaryDiff = timeB - timeA;
      }

      if (primaryDiff === 0) {
        const captionA = String(a.caption || '');
        const captionB = String(b.caption || '');
        return captionA.localeCompare(captionB, 'zh-TW');
      }

      return primaryDiff;
    }

        const note = String(item.note || '').toLowerCase();
        return caption.includes(keyword) || note.includes(keyword);
      };

      // 一般商品分頁維持原本邏輯；只有購物車改成依商品原本的 item.category 分組。
      const filtered = allData.filter(item => {
        if (currentCategory === 'cart') {
          // 購物車搜尋只搜尋已加入購物車的商品，避免搜尋時把其他分頁商品帶進來。
          return cartItems.has(String(item.id)) && matchesKeyword(item);
        }

        if (keyword) {
          return matchesKeyword(item);
        }

        return item.category === currentCategory;
      });
      
      filtered.sort(compareItems);

      const isTransaction = (qty) => {
        const q = String(qty || '');
        return q.includes('暫售') || q.includes('已售出');
      };

      const renderItemCards = (itemsToRender) => {
        itemsToRender.forEach((item) => {
          const card = document.createElement('div');
          const isHotItem = (item.real_img === 'HOT');
          card.className = `img-card ${isHotItem ? 'is-hot' : ''}`;
          card.id = `card-${item.id}`;
          card.setAttribute('data-id', item.id);

          const currentQty = item.quantity || '數量: 1';
          const isPending = String(currentQty).includes('暫售');
          const isSold = String(currentQty).includes('已售出');
          
          let statusClass = '';
          if (isPending) statusClass = 'is-pending';
          else if (isSold) statusClass = 'is-sold';

          let badgeHTML = '';
          const isChecked = cartItems.has(String(item.id));
          const selectedQty = cartItems.get(String(item.id)) || '數量: 1';

          let hotSelectHTML = '';
          if (isAdmin) {
            hotSelectHTML = `
              <select class="hot-select ${isHotItem ? 'is-hot' : ''}" id="hot-sel-${item.id}">
                <option value="一般" ${!isHotItem ? 'selected' : ''}>一般</option>
                <option value="HOT" ${isHotItem ? 'selected' : ''}>🔥 HOT</option>
              </select>
            `;
          } else if (isHotItem) {
            hotSelectHTML = `<span class="hot-badge-tag">🔥 HOT</span>`;
          }

          if (isAdmin) {
            let topRightHTML = `<select class="status-select ${statusClass}" id="badge-${item.id}">
              <option value="數量: 1" ${currentQty === '數量: 1' ? 'selected' : ''}>數量: 1</option>
              <option value="數量: 2" ${currentQty === '數量: 2' ? 'selected' : ''}>數量: 2</option>
              <option value="數量: 3" ${currentQty === '數量: 3' ? 'selected' : ''}>數量: 3</option>
              <option value="數量: 4" ${currentQty === '數量: 4' ? 'selected' : ''}>數量: 4</option>
              <option value="數量: 5" ${currentQty === '數量: 5' ? 'selected' : ''}>數量: 5</option>
              <option value="數量: 6" ${currentQty === '數量: 6' ? 'selected' : ''}>數量: 6</option>
              <option value="數量: 7" ${currentQty === '數量: 7' ? 'selected' : ''}>數量: 7</option>
              <option value="數量: 8" ${currentQty === '數量: 8' ? 'selected' : ''}>數量: 8</option>
              <option value="數量: 9" ${currentQty === '數量: 9' ? 'selected' : ''}>數量: 9</option>
              <option value="數量: 10" ${currentQty === '數量: 10' ? 'selected' : ''}>數量: 10</option>
              <option value="大量" ${currentQty === '大量' ? 'selected' : ''}>大量</option>
              <option value="暫售，待交易" ${isPending ? 'selected' : ''}>暫售，待交易</option>
              <option value="已售出" ${isSold ? 'selected' : ''}>已售出</option>
            </select>`;

            if (isChecked) {
              topRightHTML = `
                <select class="cart-qty-select" id="cart-qty-${item.id}">
                  ${generateVisitorQtyOptions(currentQty, selectedQty)}
                </select>
              `;
            }

            badgeHTML = `
              <input type="checkbox" class="cart-checkbox" id="cart-chk-${item.id}" ${isChecked ? 'checked' : ''} title="加入購物車" />
              ${topRightHTML}
              ${hotSelectHTML}
            `;
          } else {
            let topRightHTML = `<span class="status-badge ${statusClass}" style="right:3px; left:auto;" id="badge-${item.id}">${currentQty}</span>`;
            if (isChecked) {
              topRightHTML = `
                <select class="cart-qty-select" id="cart-qty-${item.id}">
                  ${generateVisitorQtyOptions(currentQty, selectedQty)}
                </select>
              `;
            }

            let checkboxHTML = (!isSold) ? `<input type="checkbox" class="cart-checkbox" id="cart-chk-${item.id}" ${isChecked ? 'checked' : ''} title="加入購物車" />` : '';

            badgeHTML = `
              ${checkboxHTML}
              ${topRightHTML}
              ${hotSelectHTML}
            `;
          }

          const fullCaption = item.caption || '';
          let priceVal = item.price || '';
          let textVal = fullCaption;
          let interactVal = item.interact === '有互動' ? '單人互動' : (item.interact || '無互動');

          let moveSelectHTML = '';
          if (isAdmin && currentCategory && currentCategory !== 'cart' && currentCategory !== 'schedule') {
            moveSelectHTML = `
              <div class="interact-col">
                <select class="move-category-select" id="move-${item.id}">
                  <option value="" disabled selected>📦 移動到...</option>
                  <option value="general_new">✨ 本月新品</option>
                  <option value="general_misc">📦 哩哩摳摳</option>
                  <option value="general_consumable">🧪 消耗品</option>
                  <option value="memes">🧸 熊熊</option>
                  <option value="animal_other">📦 其他 (小動物)</option>
                  <option value="pot">🪴 花盆</option>
                  <option value="ring_male">💍 戒指 (限男)</option>
                  <option value="ring_female">💍 戒指 (限女)</option>
                  <option value="crop_male">🌱 作物 (限男)</option>
                  <option value="crop_female">🌱 作物 (限女)</option>
                  <option value="gift">🎁 贈品區</option>
                </select>
              </div>
            `;
          }

          const showInteractSelect = (item.category === 'general_new' || item.category === 'general_misc' || item.category === 'memes' || item.category === 'animal_other' || item.category === 'gift');
          
          let interactHTML = '';
          if (showInteractSelect) {
            interactHTML = `
              <div class="interact-col">
                <select class="interact-select ${interactVal === '無互動' ? 'option-none' : interactVal === '雙人互動' ? 'option-double' : interactVal === '多人互動' ? 'option-multi' : 'option-single'}" id="interact-${item.id}" ${!isAdmin ? 'disabled' : ''}>
                  <option value="無互動" ${interactVal === '無互動' ? 'selected' : ''}>無互動</option>
                  <option value="單人互動" ${interactVal === '單人互動' || interactVal === '有互動' ? 'selected' : ''}>單人互動</option>
                  <option value="雙人互動" ${interactVal === '雙人互動' ? 'selected' : ''}>雙人互動</option>
                  <option value="多人互動" ${interactVal === '多人互動' ? 'selected' : ''}>多人互動</option>
                </select>
              </div>
            `;
          }

          let priceColStyle = (!isAdmin && isSold) ? 'display: none;' : '';

          card.innerHTML = `
            <button class="delete-btn" title="刪除商品">✕</button>
            <div class="img-wrapper">
              <span class="loading-text">加載中</span>
              ${badgeHTML}
              <img src="${item.url}" alt="image" loading="lazy" decoding="async" />
            </div>
            <div class="img-info">
              <div class="caption-container">
                <div class="caption-row-top">
                  <div class="price-col" style="${priceColStyle}">
                    <span class="currency-symbol">$</span>
                    <span class="editable-price" contenteditable="${isAdmin}" id="price-${item.id}" maxlength="3">${priceVal}</span>
                  </div>
                  <div class="desc-col">
                    <span class="editable-text" contenteditable="${isAdmin}" id="text-${item.id}">${textVal}</span>
                  </div>
                </div>
                ${interactHTML}
                ${moveSelectHTML}
              </div>
            </div>
            <div class="admin-note-box">
              <div class="admin-note-label">🔒 備註</div>
              <span class="admin-note-text" contenteditable="${isAdmin}" id="note-${item.id}">${item.note || ''}</span>
            </div>
          `;

          const imgEl = card.querySelector('img');
          imgEl.addEventListener('load', () => {
            card.classList.add('loaded');
          });
          if (imgEl.complete) {
            card.classList.add('loaded');
          }

          card.addEventListener('click', (e) => {
            if (e.target.closest('button') || e.target.closest('input') || e.target.closest('select') || e.target.closest('[contenteditable="true"]')) {
              return;
            }
            openAlbumModal(item, 0);
          });

          if (isAdmin) {
            card.querySelector('.delete-btn').addEventListener('click', (e) => {
              e.stopPropagation();
              if (confirm('確定要刪除這個商品嗎？')) {
                deleteItem(item.id);
              }
            });

            const moveSel = card.querySelector(`#move-${item.id}`);
            if (moveSel) {
              moveSel.addEventListener('change', async () => {
                const targetCat = moveSel.value;
                if (!targetCat) return;
                const status = document.getElementById('status');
                status.innerText = "正在移動商品分類...";
                
                const success = await updateItem(item.id, 'category', targetCat);
                if (success) {
                  item.category = targetCat;
                  status.innerText = "移動成功！";
                  renderGallery();
                } else {
                  status.innerText = "移動失敗，請重試";
                }
                setTimeout(() => { status.innerText = ""; }, 1500);
              });
            }

            const hotSel = card.querySelector(`#hot-sel-${item.id}`);
            if (hotSel) {
              hotSel.addEventListener('change', async () => {
                const newHotVal = hotSel.value;
                const status = document.getElementById('status');
                status.innerText = "正在更新 HOT 狀態...";
                
                const success = await updateItem(item.id, 'real_img', newHotVal);
                if (success) {
                  item.real_img = newHotVal;
                  status.innerText = "更新成功！";
                  renderGallery();
                } else {
                  status.innerText = "更新失敗，請重試";
                }
                setTimeout(() => { status.innerText = ""; }, 1500);
              });
            }
          }

          const chkEl = card.querySelector(`#cart-chk-${item.id}`);
          if (chkEl) {
            chkEl.addEventListener('change', () => {
              const status = document.getElementById('status');
              if (chkEl.checked) {
                cartItems.set(String(item.id), '數量: 1');
                status.innerText = "🛒 已加入購物車！";
              } else {
                cartItems.delete(String(item.id));
                status.innerText = "❌ 已從購物車移除";
              }
              saveCartToStorage();
              setTimeout(() => { status.innerText = ""; }, 1500);
              updateCartButtonBadge();
              renderGallery();
              calculateTotal();
            });
          }

          const qtySelEl = card.querySelector(`#cart-qty-${item.id}`);
          if (qtySelEl) {
            qtySelEl.addEventListener('change', () => {
              cartItems.set(String(item.id), qtySelEl.value);
              saveCartToStorage();
              updateCartButtonBadge();
              calculateTotal();
            });
          }

          gallery.appendChild(card);

          if (isAdmin) {
            const selectEl = document.getElementById(`badge-${item.id}`);
            if (selectEl) {
              selectEl.addEventListener('change', async () => {
                const newValue = selectEl.value;
                const status = document.getElementById('status');
                status.innerText = "正在儲存至雲端...";
                
                const success = await updateItem(item.id, 'quantity', newValue);
                if (success) {
                  item.quantity = newValue;
                  selectEl.className = 'status-select';
                  if (newValue.includes('暫售')) {
                    selectEl.classList.add('is-pending');
                  } else if (newValue.includes('已售出')) {
                    selectEl.classList.add('is-sold');
                  }
                  status.innerText = "修改成功！";
                  renderGallery(); 
                } else {
                  status.innerText = "儲存失敗，請重試";
                }
                setTimeout(() => { status.innerText = ""; }, 1500);
              });
            }

            const interactSelectEl = document.getElementById(`interact-${item.id}`);
            if (interactSelectEl) {
              interactSelectEl.addEventListener('change', async () => {
                const newValue = interactSelectEl.value;
                const status = document.getElementById('status');
                status.innerText = "正在儲存至雲端...";
                
                const success = await updateItem(item.id, 'interact', newValue);
                if (success) {
                  item.interact = newValue;
                  interactSelectEl.className = `interact-select ${newValue === '無互動' ? 'option-none' : newValue === '雙人互動' ? 'option-double' : newValue === '多人互動' ? 'option-multi' : 'option-single'}`;
                  status.innerText = "修改成功！";
                } else {
                  status.innerText = "儲存失敗，請重試";
                }
                setTimeout(() => { status.innerText = ""; }, 1500);
              });
            }

            bindEditable(item.id, 'caption', `text-${item.id}`);
            bindEditable(item.id, 'price', `price-${item.id}`);
            bindEditable(item.id, 'note', `note-${item.id}`);
          }
        });
      };

      if (currentCategory === 'cart') {
        // 取得左側「實際商品分頁」的順序，作為購物車分區順序。
        // 這樣之後只要調整左側分頁順序，購物車分區也會跟著調整。
        const categoryButtons = Array.from(
          document.querySelectorAll('.tab-btn[data-category]')
        ).filter(btn => {
          const category = btn.getAttribute('data-category');
          return category && category !== 'cart' && category !== 'schedule';
        });

        const categoryOrder = [];
        const categoryNames = new Map();

        categoryButtons.forEach(btn => {
          const category = btn.getAttribute('data-category');
          if (!categoryOrder.includes(category)) {
            categoryOrder.push(category);
            categoryNames.set(category, btn.innerText.trim());
          }
        });

        // 若資料中存在目前左側沒有按鈕的舊分類，仍然顯示，避免購物車商品消失。
        filtered.forEach(item => {
          const category = String(item.category || '');
          if (category && !categoryOrder.includes(category)) {
            categoryOrder.push(category);
            categoryNames.set(category, category);
          }
        });

        let cartSectionCount = 0;

        categoryOrder.forEach(category => {
          const categoryItems = filtered.filter(item => String(item.category || '') === category);
          if (!categoryItems.length) return;

          if (cartSectionCount > 0) {
            const divider = document.createElement('hr');
            divider.className = 'section-divider-line';
            gallery.appendChild(divider);
          }

          const titleDiv = document.createElement('div');
          titleDiv.className = 'section-block-title normal-title';
          titleDiv.innerHTML = categoryNames.get(category) || category;
          gallery.appendChild(titleDiv);

          // 每個購物車分區內仍沿用原本的 HOT / 一般 / 交易排序邏輯。
          const hotList = categoryItems.filter(item => item.real_img === 'HOT' && !isTransaction(item.quantity));
          const normalList = categoryItems.filter(item => item.real_img !== 'HOT' && !isTransaction(item.quantity));
          const transactionList = categoryItems.filter(item => isTransaction(item.quantity));

          renderItemCards(hotList);
          renderItemCards(normalList);
          renderItemCards(transactionList);
          cartSectionCount++;
        });
      } else {
        // 非購物車分頁完全維持原本的 HOT / 一般 / 交易三段式邏輯。
        const hotList = filtered.filter(item => item.real_img === 'HOT' && !isTransaction(item.quantity));
        const normalList = filtered.filter(item => item.real_img !== 'HOT' && !isTransaction(item.quantity));
        const transactionList = filtered.filter(item => isTransaction(item.quantity));

        const hasHot = hotList.length > 0;
        const hasNormal = normalList.length > 0;
        const hasTransaction = transactionList.length > 0;
        let sectionCount = 0;

        if (hasHot) {
          const titleDiv = document.createElement('div');
          titleDiv.className = 'section-block-title hot-title';
          titleDiv.innerHTML = '🔥 HOT 熱門';
          gallery.appendChild(titleDiv);
          renderItemCards(hotList);
          sectionCount++;
        }

        if (hasNormal) {
          if (sectionCount > 0) {
            const divider = document.createElement('hr');
            divider.className = 'section-divider-line';
            gallery.appendChild(divider);
          }
          const normalTitle = document.createElement('div');
          normalTitle.className = 'section-block-title normal-title';
          normalTitle.innerHTML = currentCategoryDisplayName;
          gallery.appendChild(normalTitle);
          renderItemCards(normalList);
          sectionCount++;
        }

        if (hasTransaction) {
          if (sectionCount > 0) {
            const divider = document.createElement('hr');
            divider.className = 'section-divider-line';
            gallery.appendChild(divider);
          }
          const transactionTitle = document.createElement('div');
          transactionTitle.className = 'section-block-title transaction-title';
          transactionTitle.innerHTML = '🚚.. 已進入交易流程';
          gallery.appendChild(transactionTitle);
          renderItemCards(transactionList);
          sectionCount++;
        }
      }
    }

    function bindEditable(id, field, elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      let originalValue = "";

      el.addEventListener('focus', () => {
        if (!isAdmin) return;
        originalValue = el.innerText.trim();
      });

      el.addEventListener('blur', async () => {
        if (!isAdmin) return;
        let newValue = el.innerText.trim();
        
        if (field === 'price') {
          newValue = newValue.replace(/\D/g, '').slice(0, 3);
          el.innerText = newValue;
        }

        if (newValue === originalValue) return;

        const targetItem = allData.find(item => String(item.id) === String(id));
        if (targetItem) {
          targetItem[field] = newValue;
        }

        const status = document.getElementById('status');
        status.innerText = "正在儲存至雲端...";
        
        const success = await updateItem(id, field, newValue);
        if (success) {
          originalValue = newValue;
          status.innerText = "修改成功！";
          if (field === 'caption' || field === 'price') {
            renderGallery();
            calculateTotal();
          }
        } else {
          status.innerText = "儲存失敗，請重試";
        }
        setTimeout(() => { status.innerText = ""; }, 1500);
      });

      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      });
    }

    async function updateItem(id, field, value) {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=updateItem&id=${id}&field=${field}&value=${encodeURIComponent(value)}`);
        const result = await response.json();
        return result.status === 'success';
      } catch (err) {
        console.error(err);
        return false;
      }
    }

    async function deleteItem(id) {
      await fetch(`${SCRIPT_URL}?action=deleteItem&id=${id}`);
      allData = allData.filter(item => String(item.id) !== String(id));
      cartItems.delete(String(id));
      saveCartToStorage();
      updateCartButtonBadge();
      renderGallery();
      calculateTotal();
    }

    function setupModalEvents() {
      const modal = document.getElementById('albumModal');
      const closeBtn = document.getElementById('modalCloseBtn');
      const prevBtn = document.getElementById('modalPrevBtn');
      const nextBtn = document.getElementById('modalNextBtn');
      const deletePhotoBtn = document.getElementById('deleteCurrentPhotoBtn');

      closeBtn.addEventListener('click', closeAlbumModal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeAlbumModal();
      });

      prevBtn.addEventListener('click', () => {
        if (currentAlbumList.length <= 1) return;
        currentAlbumIndex = (currentAlbumIndex - 1 + currentAlbumList.length) % currentAlbumList.length;
        updateModalView();
      });

      nextBtn.addEventListener('click', () => {
        if (currentAlbumList.length <= 1) return;
        currentAlbumIndex = (currentAlbumIndex + 1) % currentAlbumList.length;
        updateModalView();
      });

      deletePhotoBtn.addEventListener('click', async () => {
        const currentPhoto = currentAlbumList[currentAlbumIndex];
        if (!currentPhoto) return;
        if (confirm('確定要刪除這張相片嗎？')) {
          await deleteItem(currentPhoto.id);
          await fetchData();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (modal.style.display !== 'flex') return;
        if (e.key === 'ArrowLeft') {
          prevBtn.click();
        } else if (e.key === 'ArrowRight') {
          nextBtn.click();
        } else if (e.key === 'Escape') {
          closeAlbumModal();
        }
      });

      const modalDropZone = document.getElementById('modalDropZone');
      
      document.addEventListener('paste', (e) => {
        if (!isAdmin || !activeModalItem || modal.style.display !== 'flex') return;
        if (document.activeElement.isContentEditable) return;
        
        const items = e.clipboardData?.items;
        if (!items) return;
        for (let item of items) {
          if (item.type.includes('image')) {
            e.stopPropagation();
            handleModalImageFile(item.getAsFile());
            break;
          }
        }
      });

      modalDropZone.addEventListener('dragover', (e) => { e.preventDefault(); modalDropZone.classList.add('dragover'); });
      modalDropZone.addEventListener('dragleave', () => modalDropZone.classList.remove('dragover'));
      modalDropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        modalDropZone.classList.remove('dragover');
        if (isAdmin && activeModalItem && e.dataTransfer.files.length > 0) {
          handleModalImageFile(e.dataTransfer.files[0]);
        }
      });
    }

    function openAlbumModal(item, index = 0) {
      activeModalItem = item;
      const modal = document.getElementById('albumModal');
      const modalDropZone = document.getElementById('modalDropZone');

      modalDropZone.style.display = isAdmin ? 'block' : 'none';
      modal.style.display = 'flex';

      const rawData = window._rawServerData || [];
      const albumImages = rawData.filter(i => i.category === 'album_item' && String(i.note) === String(activeModalItem.id));
      
      currentAlbumList = albumImages;
      currentAlbumIndex = currentAlbumList.length > 0 ? Math.min(index, currentAlbumList.length - 1) : 0;

      updateModalView();
    }

    function closeAlbumModal() {
      const modal = document.getElementById('albumModal');
      modal.style.display = 'none';
      activeModalItem = null;
      currentAlbumList = [];
      currentAlbumIndex = 0;
    }

    function updateModalView() {
      const mainImg = document.getElementById('modalMainImg');
      const dotsContainer = document.getElementById('modalDotsContainer');
      const prevBtn = document.getElementById('modalPrevBtn');
      const nextBtn = document.getElementById('modalNextBtn');
      const deletePhotoBtn = document.getElementById('deleteCurrentPhotoBtn');

      if (currentAlbumList.length === 0) {
        mainImg.src = '';
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
        dotsContainer.innerHTML = '';
        deletePhotoBtn.style.display = 'none';
        return;
      }

      const currentPhoto = currentAlbumList[currentAlbumIndex];
      mainImg.src = currentPhoto.url;

      if (currentAlbumList.length > 1) {
        prevBtn.style.display = 'block';
        nextBtn.style.display = 'block';
      } else {
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
      }

      dotsContainer.innerHTML = '';
      currentAlbumList.forEach((imgObj, idx) => {
        const dot = document.createElement('div');
        dot.className = `modal-dot ${idx === currentAlbumIndex ? 'active' : ''}`;
        dot.addEventListener('click', () => {
          currentAlbumIndex = idx;
          updateModalView();
        });
        dotsContainer.appendChild(dot);
      });

      if (isAdmin) {
        deletePhotoBtn.style.display = 'block';
      }
    }

    async function handleModalImageFile(file) {
      if (!isAdmin || !activeModalItem || !file || !file.type.startsWith('image/')) return;
      const status = document.getElementById('modalStatus');
      status.innerText = "正在縮小並上傳相片至相簿...";

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const compressedDataUrl = await compressImage(e.target.result, 800, 0.85);
          const base64Data = compressedDataUrl.split(',')[1];

          const formData = new URLSearchParams();
          formData.append('action', 'addItem');
          formData.append('category', 'album_item');
          formData.append('caption', activeModalItem.caption + ' (相片)');
          formData.append('price', '0');
          formData.append('quantity', '數量: 1');
          formData.append('interact', '無互動');
          formData.append('note', activeModalItem.id);
          formData.append('mimeType', 'image/jpeg');
          formData.append('imageBase64', base64Data);

          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: formData
          });
          const result = await response.json();
          if (result.status === 'success') {
            status.innerText = "相簿上傳成功！";
            await fetchData();
            if (window._rawServerData) {
              const updatedAlbumImages = window._rawServerData.filter(i => i.category === 'album_item' && String(i.note) === String(activeModalItem.id));
              currentAlbumList = updatedAlbumImages;
              currentAlbumIndex = currentAlbumList.length - 1;
              updateModalView();
            }
            setTimeout(() => status.innerText = "", 1500);
          }
        } catch (err) {
          status.innerText = "上傳失敗";
          console.error(err);
          await fetchData();
        }
      };
      reader.readAsDataURL(file);
    }

    function compressImage(srcUrl, maxSize = 400, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxSize) {
              height *= maxSize / width;
              width = maxSize;
            }
          } else {
            if (height > maxSize) {
              width *= maxSize / height;
              height = maxSize;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve(compressedDataUrl);
        };
        img.onerror = (e) => reject(e);
        img.src = srcUrl;
      });
    }

    function handleImageFile(file) {
      if (!isAdmin || !file || !file.type.startsWith('image/')) return;
      if (!currentCategory || currentCategory === 'cart' || currentCategory === 'schedule') {
        alert('請先選擇一個商品分頁再上傳圖片！');
        return;
      }
      const status = document.getElementById('status');
      status.innerText = "正在縮小並上傳圖片...";

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const compressedDataUrl = await compressImage(e.target.result, 800, 0.85);
          const base64Data = compressedDataUrl.split(',')[1];

          const formData = new URLSearchParams();
          formData.append('action', 'addItem');
          formData.append('category', currentCategory);
          formData.append('caption', '');
          formData.append('price', '0');
          formData.append('quantity', '數量: 1');
          formData.append('interact', '無互動');
          formData.append('real_img', '一般');
          formData.append('mimeType', 'image/jpeg');
          formData.append('imageBase64', base64Data);

          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: formData
          });
          const result = await response.json();
          if (result.status === 'success') {
            status.innerText = "上傳成功！";
            await fetchData();
            setTimeout(() => status.innerText = "", 1500);
          } else {
            status.innerText = "上傳失敗";
          }
        } catch (err) {
          status.innerText = "上傳失敗";
          console.error(err);
        }
      };
      reader.readAsDataURL(file);
    }

    function setupDropZone() {
      const dropZone = document.getElementById('dropZone');
      document.addEventListener('paste', (e) => {
        const modal = document.getElementById('albumModal');
        if (modal && modal.style.display === 'flex') return;

        if (!isAdmin || !currentCategory || currentCategory === 'cart' || currentCategory === 'schedule') return;
        if (document.activeElement.isContentEditable) return;
        const items = e.clipboardData?.items;
        if (!items) return;
        for (let item of items) {
          if (item.type.includes('image')) {
            handleImageFile(item.getAsFile());
            break;
          }
        }
      });

      dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (isAdmin && e.dataTransfer.files.length > 0) {
          handleImageFile(e.dataTransfer.files[0]);
        }
      });
    }
  </script>
